<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>unblockedgames</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
*, ::after, ::before, ::backdrop, ::file-selector-button { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
html, :host { line-height: 1.5; -webkit-text-size-adjust: 100%; tab-size: 4; font-family: "Outfit", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body { line-height: inherit; }
h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
a { color: inherit; text-decoration: inherit; }
b, strong { font-weight: bolder; }
code, kbd, samp, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 1em; }
img, svg, video, canvas, audio, iframe, embed, object { display: block; vertical-align: middle; }
img, video { max-width: 100%; height: auto; }
button, input, select, optgroup, textarea, ::file-selector-button {
  font: inherit; color: inherit; border-radius: 0; background-color: transparent; opacity: 1;
}
:root {
  --bg: #020203;
  --panel: #0b0b0d;
  --panel2: #111114;
  --border: rgba(255, 255, 255, 0.09);
  --text: #e6e6e6;
  --muted: #8a8a90;
}
html, body, #root { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: "Outfit", system-ui, sans-serif; overflow: hidden; }
button { cursor: pointer; font-family: inherit; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }

#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* Sidebar */
#sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 64px; background: #08080a; border-right: 1px solid var(--border); z-index: 30; display: flex; flex-direction: column; align-items: stretch; transition: width 0.25s ease; }
#sidebar.open { width: 196px; }
.side-group { display: flex; flex-direction: column; gap: 4px; padding: 2px; }
.side-btn { display: flex; align-items: center; gap: 14px; height: 44px; margin: 0; padding: 0 0 0 14px; border-radius: 999px; background: transparent; border: 1px solid transparent; color: #cfcfd4; cursor: pointer; transition: 0.2s; white-space: nowrap; overflow: hidden; font: 500 14px "Outfit"; position: relative; }
.side-btn svg { flex: 0 0 auto; width: 20px; height: 20px; }
.side-btn span { opacity: 0; transition: opacity 0.2s; }
#sidebar.open .side-btn span { opacity: 1; }
.side-btn:hover { background: rgba(255, 255, 255, 0.07); }
.side-btn.active { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.22); box-shadow: 0 0 22px rgba(255, 255, 255, 0.1); }
.side-btn.locked { opacity: 0.45; }
#sidebar .spacer { flex: 1; }
#expandBtn svg { transition: transform 0.25s; }
#sidebar.open #expandBtn svg { transform: rotate(180deg); }

/* Main */
main { position: fixed; left: 64px; right: 0; top: 0; bottom: 0; z-index: 10; overflow-y: auto; overflow-x: hidden; transition: left 0.25s ease; }
#sidebar.open ~ main { left: 196px; }
.view { height: 100%; animation: fade 0.35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Pills */
.pill { background: rgba(20, 20, 23, 0.85); border: 1px solid var(--border); border-radius: 12px; padding: 8px 16px; font-size: 13px; color: #d6d6da; cursor: pointer; transition: 0.2s; backdrop-filter: blur(6px); }
.pill:hover { background: rgba(40, 40, 46, 0.95); border-color: rgba(255, 255, 255, 0.25); }
#topRight { position: fixed; top: 16px; right: 16px; z-index: 20; }
#footerLinks { position: fixed; bottom: 16px; right: 16px; z-index: 20; display: flex; gap: 10px; }

/* Home */
#home { display: flex; align-items: center; justify-content: center; flex-direction: column; height: 100%; padding-bottom: 40px; position: relative; }
.logo-wrap { position: relative; margin-bottom: 30px; text-align: center; }
.logo-wrap::before { content: ""; position: absolute; left: 50%; top: 50%; width: 120%; height: 150%; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.14), transparent 65%); filter: blur(24px); z-index: -1; }
.logo { font-size: clamp(48px, 9vw, 128px); font-weight: 600; letter-spacing: -0.04em; line-height: 1; color: #e4e4e4; margin: 0; text-shadow: 0 0 40px rgba(255, 255, 255, 0.22); }
.search-wrap { position: relative; width: min(800px, 88vw); }
.search-wrap::after { content: ""; position: absolute; inset: auto -4% -26px -4%; height: 60px; background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.07), transparent 70%); filter: blur(14px); z-index: -1; }
.search { display: flex; align-items: center; gap: 14px; height: 82px; padding: 0 34px; background: rgba(14, 14, 16, 0.92); border: 1px solid var(--border); border-radius: 14px; transition: 0.25s; position: relative; overflow: hidden; }
.search::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent); }
.search:focus-within { border-color: rgba(255, 255, 255, 0.28); box-shadow: 0 0 40px rgba(255, 255, 255, 0.07); }
.search svg { width: 22px; height: 22px; color: #b9b9be; flex: 0 0 auto; }
.search input { flex: 1; background: transparent; border: 0; outline: 0; color: #f0f0f0; font: 400 20px "Outfit"; min-width: 0; }
.search input::placeholder { color: #8e8e94; }
.quick { display: flex; gap: 22px; margin-top: 34px; flex-wrap: wrap; justify-content: center; }
.quick button { display: flex; flex-direction: column; align-items: center; gap: 10px; background: none; border: 0; color: #d8d8dc; font: 500 14px "Outfit"; cursor: pointer; position: relative; }
.quick .circ { width: 60px; height: 60px; border-radius: 50%; background: #131316; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; transition: 0.25s; position: relative; }
.quick .circ svg { width: 22px; height: 22px; }
.quick button:hover .circ { background: #1d1d22; border-color: rgba(255, 255, 255, 0.3); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(255, 255, 255, 0.07); }
.ad { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: 0.14em; color: #8b8b90; font-weight: 600; display: flex; gap: 10px; align-items: center; }

/* Page layout */
.page { padding: 36px 40px 90px; max-width: 1400px; margin: 0 auto; }
.page h2 { font-size: 34px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.02em; }
.page p.sub { color: var(--muted); margin: 0 0 24px; }
.page code { background: rgba(255, 255, 255, 0.08); padding: 1px 6px; border-radius: 6px; font-size: 0.9em; }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .search { height: 52px; padding: 0 20px; flex: 1; min-width: 240px; border-radius: 12px; }
.toolbar .search input { font-size: 16px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.chip { background: rgba(20, 20, 23, 0.85); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font: 500 13px "Outfit"; color: #c9c9ce; cursor: pointer; transition: 0.2s; }
.chip:hover { border-color: rgba(255, 255, 255, 0.28); }
.chip.on { background: #e4e4e4; color: #0a0a0a; border-color: #e4e4e4; }
.count { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.card { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; cursor: pointer; transition: 0.25s; text-align: left; padding: 0; color: inherit; font-family: inherit; }
.card:hover { transform: translateY(-4px); border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 24px rgba(255, 255, 255, 0.05); }
.card .thumb { position: relative; height: 120px; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 700; color: rgba(255, 255, 255, 0.85); overflow: hidden; }
.card .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .badge { position: absolute; top: 8px; left: 8px; background: rgba(0, 0, 0, 0.78); border: 1px solid var(--border); border-radius: 999px; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; padding: 2px 8px; color: #ddd; z-index: 2; }
.card .badge.installed { background: rgba(22, 163, 74, 0.88); color: #fff; border-color: rgba(74, 222, 128, 0.5); }
.card .info { padding: 11px 13px 13px; }
.card .name { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .tag { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; justify-content: space-between; }
.empty { padding: 60px 0; text-align: center; color: var(--muted); }

/* Settings & Buttons */
.setting { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; }
.setting h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.setting p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.field { width: 100%; height: 44px; background: #0e0e11; border: 1px solid var(--border); border-radius: 10px; padding: 0 14px; color: #eee; font: 400 14px "Outfit"; outline: 0; }
.field:focus { border-color: rgba(255, 255, 255, 0.3); }
.tier-select { background: #121217; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; color: #fff; cursor: pointer; outline: 0; }
.tier-select option { background: #0e0e12; color: #fff; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.toggle { position: relative; width: 48px; height: 28px; flex: 0 0 auto; }
.toggle input { display: none; }
.toggle span { position: absolute; inset: 0; background: #26262b; border-radius: 999px; cursor: pointer; transition: 0.2s; }
.toggle span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #aaa; transition: 0.2s; }
.toggle input:checked + span { background: #e4e4e4; }
.toggle input:checked + span::after { transform: translateX(20px); background: #111; }
.btn { background: #e4e4e4; color: #0a0a0a; border: 0; border-radius: 10px; height: 44px; padding: 0 20px; font: 600 14px "Outfit"; cursor: pointer; transition: 0.2s; }
.btn:hover { background: #fff; box-shadow: 0 0 24px rgba(255, 255, 255, 0.25); }
.btn.ghost { background: rgba(255, 255, 255, 0.07); color: #ddd; border: 1px solid var(--border); }
.btn.ghost:hover { background: rgba(255, 255, 255, 0.13); box-shadow: none; }
.btn.danger { background: rgba(220, 38, 38, 0.16); color: #fca5a5; border: 1px solid rgba(220, 38, 38, 0.4); }
.btn.danger:hover { background: #dc2626; color: #fff; border-color: #dc2626; }
.btn.warn { background: rgba(245, 158, 11, 0.14); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.38); }
.btn.warn:hover { background: #d97706; color: #fff; border-color: #d97706; }
.btn.sm { height: 34px; padding: 0 13px; font-size: 12.5px; border-radius: 8px; }

/* Modal & Player */
#modalBg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: #0c0c0f; border: 1px solid var(--border); border-radius: 18px; padding: 26px; width: min(480px, 100%); animation: fade 0.25s ease; }
.modal h3 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
.modal p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 16px; }
.modal .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 30px); background: #e4e4e4; color: #111; padding: 10px 18px; border-radius: 999px; font-weight: 500; font-size: 14px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 200; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

#player { position: fixed; inset: 0; z-index: 90; background: #000; display: flex; flex-direction: column; animation: fade 0.25s ease; }
#player .bar { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 14px; background: #08080a; border-bottom: 1px solid var(--border); flex: 0 0 auto; overflow-x: auto; }
#player .bar .ttl { font-weight: 600; font-size: 15px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 10px; }
#player .bar .pill { padding: 6px 14px; white-space: nowrap; }
#player iframe { flex: 1; width: 100%; border: 0; background: #000; }

/* Auth & Panels */
.auth-overlay { position: fixed; inset: 0; z-index: 85; background: rgba(2, 2, 3, 0.92); backdrop-filter: blur(18px); display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade 0.3s ease; }
.auth-box { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 34px 30px; width: min(420px, 100%); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85); position: relative; overflow: hidden; }
.auth-logo { font-size: 36px; font-weight: 600; letter-spacing: -0.04em; color: #e4e4e4; text-align: center; margin: 0 0 6px; }
.auth-sub { color: var(--muted); font-size: 13.5px; text-align: center; margin: 0 0 24px; }
.auth-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
.auth-err { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); color: #fca5a5; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; text-align: center; }
.pop-panel { background: var(--panel); border: 1px solid rgba(255, 255, 255, 0.13); border-radius: 16px; padding: 18px 20px; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.7); transition: transform 0.22s ease, border-color 0.22s ease; position: relative; }
.pop-panel:hover { border-color: rgba(255, 255, 255, 0.25); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; display: inline-block; }
.status-dot.off { background: #71717a; box-shadow: none; }
.status-dot.exp { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
.slider { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; background: #232329; border-radius: 999px; outline: none; cursor: pointer; }
.slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #e4e4e4; cursor: pointer; border: 2px solid #0b0b0d; }
.slider:disabled { opacity: 0.35; cursor: not-allowed; }
.eye-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border); border-radius: 8px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; color: #cfcfd4; cursor: pointer; }
.eye-btn:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
.eye-btn svg { width: 15px; height: 15px; }
.mono-box { font-family: monospace; background: #070709; border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 13px; color: #e4e4e4; display: inline-flex; align-items: center; gap: 8px; }

/* Tier Badges */
.badge-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--border); letter-spacing: 0.03em; }
.badge-pill.owner { background: rgba(255, 255, 255, 0.18); color: #fff; border-color: rgba(255, 255, 255, 0.45); }
.badge-pill.live { background: rgba(34, 197, 94, 0.14); color: #86efac; border-color: rgba(34, 197, 94, 0.35); }
.badge-pill.tier-free { background: rgba(161, 161, 170, 0.14); color: #d4d4d8; border-color: rgba(161, 161, 170, 0.35); }
.badge-pill.tier-pro { background: rgba(59, 130, 246, 0.18); color: #93c5fd; border-color: rgba(59, 130, 246, 0.45); }
.badge-pill.tier-premium { background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(168, 85, 247, 0.22)); color: #fde68a; border-color: rgba(245, 158, 11, 0.55); box-shadow: 0 0 16px rgba(245, 158, 11, 0.18); }
.badge-pill.tier-max { background: linear-gradient(135deg, rgba(239, 68, 68, 0.32), rgba(249, 115, 22, 0.32)); color: #fecaca; border-color: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.38); }

/* Live Screen Broadcast Overlay (MAX & Owner) — Locked max-height so Close button is ALWAYS visible! */
.screen-broadcast-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(12px); z-index: 250; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade 0.25s ease; }
.screen-broadcast-box { background: linear-gradient(180deg, #1a0b0e 0%, #0b0b0f 100%); border: 2px solid #ef4444; border-radius: 22px; padding: 28px; width: min(500px, 94vw); max-height: 85vh; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 28px 75px rgba(239, 68, 68, 0.35), 0 0 40px rgba(0, 0, 0, 0.9); text-align: center; overflow: hidden; }
.screen-broadcast-msg { font-size: 22px; font-weight: 700; color: #fff; line-height: 1.4; margin: 14px 0 22px; word-break: break-word; overflow-y: auto; max-height: 45vh; padding: 0 4px; }

/* ESPN Sports Hub Styles */
.espn-banner { background: linear-gradient(135deg, #b91c1c 0%, #111115 70%); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 18px; padding: 22px 26px; margin-bottom: 22px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
.espn-logo { font-size: 30px; font-weight: 900; font-style: italic; letter-spacing: -0.03em; color: #fff; background: #dc2626; padding: 2px 14px; border-radius: 6px; display: inline-block; }
.espn-score-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.espn-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; transition: 0.2s; cursor: pointer; }
.espn-card:hover { border-color: #ef4444; transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.65); }

/* ============================================================================
   FULL-SCREEN GOOGLE-STYLE FROSTED GLASS BROWSER
   ============================================================================ */
.gbrowser-root { height: 100%; width: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.gbrowser-idle { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.gbrowser-top { background: rgba(14, 14, 18, 0.82); backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%); border-bottom: 1px solid rgba(255, 255, 255, 0.12); padding: 14px 28px 0; flex-shrink: 0; z-index: 15; }
.gbrowser-bar-row { display: flex; align-items: center; gap: 14px; max-width: 1100px; }
.glass-panel { width: min(820px, 92vw); background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 999px; padding: 8px 12px 8px 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.22); display: flex; align-items: center; gap: 12px; transition: all 0.22s ease; }
.glass-panel.compact { width: 100%; max-width: 780px; padding: 4px 8px 4px 18px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
.glass-panel:focus-within { background: rgba(255, 255, 255, 0.09); border-color: rgba(255, 255, 255, 0.38); box-shadow: 0 12px 36px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 255, 255, 0.08); }
.glass-panel svg { width: 22px; height: 22px; min-width: 22px; max-width: 22px; min-height: 22px; max-height: 22px; flex: 0 0 22px; width: 20px; height: 20px; color: rgba(255, 255, 255, 0.75); flex-shrink: 0; }
.glass-input { flex: 1; height: 46px; background: transparent; border: 0; outline: 0; color: #fff; font: 400 18px "Outfit", sans-serif; min-width: 0; }
.glass-panel.compact .glass-input { height: 38px; font-size: 15.5px; }
.glass-input::placeholder { color: rgba(255, 255, 255, 0.42); }
.gbrowser-tabs { display: flex; gap: 24px; margin-top: 12px; padding-left: 8px; }
.gbrowser-tab { padding: 8px 4px 11px; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; display: flex; align-items: center; gap: 7px; transition: 0.18s; }
.gbrowser-tab:hover { color: #fff; }
.gbrowser-tab.on { color: #60a5fa; border-bottom-color: #60a5fa; }
.gbrowser-body { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
.gbrowser-results-wrap { max-width: 960px; padding: 24px 32px 80px; display: flex; flex-direction: column; gap: 14px; }
.gbrowser-card { background: rgba(20, 20, 26, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.11); border-radius: 16px; padding: 16px 20px; cursor: pointer; transition: 0.2s; }
.gbrowser-card:hover { background: rgba(32, 32, 42, 0.85); border-color: rgba(96, 165, 250, 0.45); transform: translateY(-2px); }
.gbrowser-img-grid { padding: 24px 32px 80px; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
.gbrowser-img-card { background: #0d0d12; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; transition: 0.22s; }

  // --- Stars Background ---
  function Stars() {
    const ref = useRef(null);
    useEffect(() => {
      const cv = ref.current, ctx = cv.getContext("2d");
      let W = 0, H = 0, raf = 0, stars = [];
      const dpr = window.devicePixelRatio || 1;
      const resize = () => {
        W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
        cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
        const n = Math.floor((innerWidth * innerHeight) / 9000);
        stars = Array.from({ length: n }, () => ({
          x: Math.random() * W, y: Math.random() * H,
          r: (Math.random() * 1.4 + 0.5) * dpr, s: (Math.random() * 0.12 + 0.02) * dpr,
          p: Math.random() * Math.PI * 2, f: Math.random() * 0.02 + 0.005,
        }));
      };
      const frame = () => {
        ctx.clearRect(0, 0, W, H); ctx.fillStyle = "#fff";
        for (const s of stars) {
          s.y += s.s; s.p += s.f;
          if (s.y > H + 5) { s.y = -5; s.x = Math.random() * W; }
          ctx.globalAlpha = 0.35 + 0.55 * Math.abs(Math.sin(s.p));
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
        }
        raf = requestAnimationFrame(frame);
      };
      addEventListener("resize", resize); resize(); frame();
      return () => { removeEventListener("resize", resize); cancelAnimationFrame(raf); };
    }, []);
    return h("canvas", { id: "stars", ref });
  }

        if (pausedRef.current) { i = 0; del = false; setText("Browse"); t = setTimeout(tick, 600); return; }
        const word = WORDS[w];
        setText(word.slice(0, i) + "|");
        let delay = del ? 45 : 95;

        else if (del && i === 0) { del = false; w = (w + 1) % WORDS.length; delay = 400; }
        else i += del ? -1 : 1;
        t = setTimeout(tick, delay);
      };
      tick();
      return () => clearTimeout(t);
    }, []);
    return text;
  }

    function solveIncomingHackModal() {
        const allEls = Array.from(document.querySelectorAll('div, span'));
        const hackedHeaderEl = allEls.find(el => {
            if (gui.contains(el)) return false;
            const t = (el.innerText || '').trim();

        if (!hackedHeaderEl) return null;

        let modalEl = hackedHeaderEl.parentElement;

            }
            modalEl = modalEl.parentElement;
        }
        if (!modalEl || modalEl === document.body) {
            modalEl = hackedHeaderEl.parentElement?.parentElement || document.body;
        }

        const modalText = (modalEl.innerText || '').trim();
        const modalPropSummary = [];

        const innerNodes = Array.from(modalEl.querySelectorAll('*')).reverse();
        const visitedModalFibers = new Set();

        for (const innerEl of innerNodes) {
            let f = getDirectFiber(innerEl);
            let steps = 0;
            while (f && steps++ < 8) {
                if (!visitedModalFibers.has(f)) {
                    visitedModalFibers.add(f);
                    if (f.tag !== 5 && f.memoizedProps && typeof f.memoizedProps === 'object') {
                        const mp = f.memoizedProps;
                        const compName = typeof f.type === 'function' ? (f.type.displayName || f.type.name || 'MComp') : 'MComp';
                        const keys = Object.keys(mp).filter(k => k !== 'children');

                        if (['Zae', 'Fpe', 'Wve', 'hl', 'by', 'e0', 'Wae'].includes(compName)) break;
                        if ('question' in mp || 'ColyseusContext' in mp || 'roomId' in mp) break;

                        if (keys.length > 0 && modalPropSummary.length < 4) {
                            modalPropSummary.push(compName + '{' + keys.join(',') + '}');
                        }

                        for (const k of keys) {
                            if (typeof mp[k] === 'function' && (
                                k.toLowerCase().includes('complete') ||
                                k.toLowerCase().includes('solve') ||
                                k.toLowerCase().includes('finish') ||
                                k.toLowerCase().includes('done') ||
                                k.toLowerCase().includes('success') ||
                                k.toLowerCase().includes('win') ||
                                (keys.filter(x => typeof mp[x] === 'function').length === 1 && k !== 'onClick')
                            )) {
                                try { mp[k](); } catch (e) {}
                            }
                        }
                    }
                }
                f = f.return;
            }
        }

        const now = Date.now();
        if (now - lastMinigameActionTime < 45) {
            return '🛡️ Solving Hack Modal...\\n' + modalPropSummary.join(' | ');
        }
        lastMinigameActionTime = now;

        if (modalText.includes('1 to 10') || modalText.includes('Click the numbers')) {
            const numBoxes = [];
            const allModalDivs = Array.from(modalEl.querySelectorAll('div, button, span'));

            for (const el of allModalDivs) {
                const txt = (el.innerText || '').trim();
                if (/^(10|[1-9])$/.test(txt)) {
                    const num = parseInt(txt, 10);
                    let target = el;
                    if (el.parentElement && modalEl.contains(el.parentElement) && (el.parentElement.innerText || '').trim() === txt) {
                        target = el.parentElement;
                    }
                    const r = target.getBoundingClientRect();
                    const style = getComputedStyle(target);
                    if (r.width > 20 && r.height > 20 && style.visibility !== 'hidden' && parseFloat(style.opacity) > 0.3) {
                        numBoxes.push({ num, el: target });
                    }
                }
            }

            if (numBoxes.length > 0) {
                numBoxes.sort((a, b) => a.num - b.num);
                const seenNums = new Set();
                let delay = 0;
                for (const item of numBoxes) {
                    if (seenNums.has(item.num)) continue;
                    seenNums.add(item.num);
                    setTimeout(() => triggerRealClick(item.el), delay);
                    delay += 18;
                }
                return '🛡️ Solved 1-to-10 Numbers!\\n' + modalPropSummary.join(' | ');
            }
        }

        if (modalText.includes('Reorder the right colors')) {
            const modalRect = modalEl.getBoundingClientRect();
            const midX = modalRect.left + modalRect.width / 2;

            const candidateBoxes = Array.from(modalEl.querySelectorAll('div, button')).filter(el => {
                const r = el.getBoundingClientRect();
                if (r.width < 32 || r.width > 110 || r.height < 32 || r.height > 110) return false;
                if (Math.abs(r.width - r.height) > 16) return false;
                const bg = getComputedStyle(el).backgroundColor;
                return bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent' && bg !== 'rgb(0, 0, 0)';
            });

            const squares = [];
            candidateBoxes.sort((a, b) => (b.offsetWidth * b.offsetHeight) - (a.offsetWidth * a.offsetHeight));
            for (const sq of candidateBoxes) {
                if (!squares.some(existing => existing.contains(sq) || sq.contains(existing))) {
                    squares.push(sq);
                }
            }

            const leftCol = squares.filter(sq => sq.getBoundingClientRect().left < midX)
                .sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
            const rightCol = squares.filter(sq => sq.getBoundingClientRect().left >= midX)
                .sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);

            if (leftCol.length > 0 && leftCol.length === rightCol.length) {
                const getSig = (el) => getComputedStyle(el).backgroundColor;
                for (let i = 0; i < leftCol.length; i++) {
                    const targetSig = getSig(leftCol[i]);
                    const currSig = getSig(rightCol[i]);
                    if (currSig !== targetSig) {
                        for (let j = i + 1; j < rightCol.length; j++) {
                            if (getSig(rightCol[j]) === targetSig) {
                                triggerRealClick(rightCol[i]);
                                setTimeout(() => triggerRealClick(rightCol[j]), 20);
                                return '🛡️ Swapping Colors (' + (i + 1) + ' <-> ' + (j + 1) + ')...\\n' + modalPropSummary.join(' | ');
                            }
                        }
                    }
                }
            }
        }

        const clickableInModal = Array.from(modalEl.querySelectorAll('button, div')).filter(el => {
            if (el === modalEl || el === hackedHeaderEl) return false;
            const fNode = getDirectFiber(el);
            return fNode && fNode.memoizedProps && typeof fNode.memoizedProps.onClick === 'function';
        });

        if (clickableInModal.length > 0) {

            });
        }

        return '🛡️ Solving Hack Modal...\\n' + modalPropSummary.join(' | ');
    }

    function hookColyseusRoom(room) {

                                } else if (payload.isCorrect && lastGuessedPasswordText) {
                                    opponentPasswords[currentHackTargetName] = lastGuessedPasswordText;

                    });
                }
            }
        } catch (e) {}

    function scanGame() {
        let question = null;
        let answerResultObj = null;
        let outputPrize = null;
        let controllerPrize = null;
        let choiceArray = null;
        let onAnswerFn = null;
        let sendAnswerFn = null;
        let sendAnswerNextFn = null;
        let onPrizeClaimedFn = null;
        let onDoneFn = null;
        let answerSentVal = '';
        let isShowingFeedback = false;
        let controllerPhase = '';
        let classicCorrectPassword = null;

        const answerButtonMap = new Map();
        const seenFibers = new Set();
        const allEls = Array.from(document.querySelectorAll('body *')).reverse();

        for (let i = 0; i < allEls.length; i++) {
            const el = allEls[i];
            if (gui.contains(el)) continue;

            let f = getDirectFiber(el);
            let guard = 0;
            while (f && guard++ < 50) {
                const node = f;
                if (!seenFibers.has(node)) {
                    seenFibers.add(node);

                    if (node.tag !== 5) {
                        const mp = node.memoizedProps;
                        if (mp && typeof mp === 'object') {
                            if (typeof mp.answer === 'string' && typeof mp.onClick === 'function') {
                                const key = mp.answer.trim().toLowerCase();
                                const domBtn = getFirstHostDomNode(node);
                                if (domBtn && !answerButtonMap.has(key)) {
                                    answerButtonMap.set(key, {
                                        dom: domBtn,
                                        onClick: mp.onClick,
                                        rawAnswer: mp.answer
                                    });
                                }
                                if (mp.isShowingFeedback) isShowingFeedback = true;
                                if (mp.answerSent) answerSentVal = mp.answerSent;
                            }

                            if (mp.question && typeof mp.question === 'object' && Array.isArray(mp.question.answers)) {
                                if (!question) question = mp.question;
                                if (Array.isArray(mp.question.correctAnswers) && mp.question.correctAnswers.length > 0) {
                                    saveAnswerToMemory(mp.question, mp.question.correctAnswers);
                                }
                            }
                            if (Array.isArray(mp.questions)) harvestQuestionArray(mp.questions, mp.title);
                            if (mp.client && Array.isArray(mp.client.questions)) harvestQuestionArray(mp.client.questions, mp.client.title);
                            if (Array.isArray(mp.choices) && mp.choices.length === 3 && mp.choices[0] && !('answers' in mp.choices[0])) {
                                choiceArray = mp.choices;
                            }
                            if (typeof mp.onAnswer === 'function' && !onAnswerFn) {
                                onAnswerFn = mp.onAnswer;
                            }
                            if (mp.answerSent) {
                                answerSentVal = mp.answerSent;
                            }

                            if (typeof mp.sendAnswer === 'function' && !sendAnswerFn) {
                                sendAnswerFn = mp.sendAnswer;
                            }
                            if (typeof mp.sendAnswerNext === 'function' && !sendAnswerNextFn) {
                                sendAnswerNextFn = mp.sendAnswerNext;
                            }
                            if (typeof mp.onDone === 'function' && !onDoneFn) {
                                onDoneFn = mp.onDone;
                            }
                            if ('incorrectTimer' in mp || ('isCorrect' in mp && !('bgColor' in mp))) {
                                isShowingFeedback = true;
                            }

                            if (mp.prize && typeof mp.prize === 'object' && ('text' in mp.prize || 'type' in mp.prize)) {
                                outputPrize = mp.prize;
                            }
                            if (typeof mp.onPrizeClaimed === 'function' && !onPrizeClaimedFn) {
                                onPrizeClaimedFn = mp.onPrizeClaimed;
                            }

                            if (typeof mp.correctPassword === 'string') {
                                classicCorrectPassword = mp.correctPassword;
                            }
                            if (typeof mp.targetName === 'string' || typeof mp.playerName === 'string') {
                                currentHackTargetName = mp.targetName || mp.playerName;
                            }

                            if (mp.value && mp.value.room) {
                                hookColyseusRoom(mp.value.room);
                            }
                        }

                        let hk = node.memoizedState;
                        let hIdx = 0;
                        while (hk && hIdx++ < 45) {
                            const raw = hk.queue?.lastRenderedState ?? hk.memoizedState;
                            if (raw !== null && raw !== undefined) {
                                const val = (typeof raw === 'object' && 'current' in raw && Object.keys(raw).length === 1) ? raw.current : raw;
                                if (typeof val === 'string' && !controllerPhase && ['question', 'prize', 'hack', 'password', 'choose', 'defense', 'hacked', 'chest', 'choice', 'steal', 'swap'].includes(val.toLowerCase())) {
                                    controllerPhase = val;
                                } else if (Array.isArray(val) && val.length > 0 && val[0] && Array.isArray(val[0].correctAnswers)) {
                                    harvestQuestionArray(val, 'Auto-Detected Set');
                                } else if (Array.isArray(val) && val.length === 3 && val[0] && typeof val[0] === 'object' && ('type' in val[0] || 'text' in val[0] || 'val' in val[0]) && !('answers' in val[0]) && !('question' in val[0])) {
                                    if (!choiceArray) choiceArray = val;
                                } else if (val && typeof val === 'object') {
                                    if (Array.isArray(val.questions)) {
                                        harvestQuestionArray(val.questions, val.title);
                                    }
                                    if (Array.isArray(val.choices) && val.choices.length === 3 && val.choices[0] && !('answers' in val.choices[0])) {
                                        if (!choiceArray) choiceArray = val.choices;
                                    }
                                    if (Array.isArray(val.correctAnswers) && val.correctAnswers.length > 0 && ('isCorrect' in val || 'incorrectTime' in val)) {
                                        answerResultObj = val;
                                        isShowingFeedback = true;
                                    }
                                    if (!controllerPrize && 'type' in val && 'text' in val && ('rate' in val || 'blook' in val || 'val' in val)) {
                                        controllerPrize = val;
                                    }
                                    if (typeof val.correctPassword === 'string') {
                                        classicCorrectPassword = val.correctPassword;
                                    }
                                    if (val.roomId && val.serializer) {
                                        hookColyseusRoom(val);
                                    }
                                }
                            }
                            hk = hk.next;
                        }

                        const sn = node.stateNode;
                        if (sn && typeof sn === 'object') {
                            if (sn.props && typeof sn.props === 'object') {
                                if (Array.isArray(sn.props.questions)) harvestQuestionArray(sn.props.questions, sn.props.title);
                                if (sn.props.client && Array.isArray(sn.props.client.questions)) harvestQuestionArray(sn.props.client.questions, sn.props.client.title);
                            }
                            if (sn.state && typeof sn.state === 'object') {
                                if (Array.isArray(sn.state.questions)) harvestQuestionArray(sn.state.questions, sn.state.title);
                                if (sn.state.stage && !controllerPhase) controllerPhase = String(sn.state.stage);
                                if (sn.state.question) {
                                    question = sn.state.question;
                                    if (Array.isArray(sn.state.question.correctAnswers) && sn.state.question.correctAnswers.length > 0) {
                                        saveAnswerToMemory(sn.state.question, sn.state.question.correctAnswers);
                                    }
                                }
                                if (Array.isArray(sn.state.choices) && sn.state.choices.length === 3) {
                                    choiceArray = sn.state.choices;
                                }
                                if (typeof sn.state.correctPassword === 'string') {
                                    classicCorrectPassword = sn.state.correctPassword;
                                }
                            }
                        }
                    }
                }
                f = f.return;
            }
        }

        // Gold Quest / Classic fallback: if question is active but answer buttons didn't use Wae props, match DOM answer buttons by text
        if (question && Array.isArray(question.answers) && answerButtonMap.size === 0) {
            const answerTexts = new Map(question.answers.map(a => [String(a).trim().toLowerCase(), a]));
            const domCandidates = Array.from(document.querySelectorAll('[id^="answer"], [class*="answerContainer" i], [class*="answerButton" i], div[role="button"], button, div')).filter(el => {
                if (gui.contains(el)) return false;
                const r = el.getBoundingClientRect();
                if (r.width < 90 || r.height < 35 || r.top < window.innerHeight * 0.28) return false;
                const txt = (el.innerText || '').trim().toLowerCase();
                return answerTexts.has(txt);
            });
            // Keep outermost button container for each answer
            domCandidates.sort((a, b) => (b.offsetWidth * b.offsetHeight) - (a.offsetWidth * a.offsetHeight));
            for (const el of domCandidates) {
                const key = (el.innerText || '').trim().toLowerCase();
                if (answerTexts.has(key) && !answerButtonMap.has(key)) {
                    const f = getDirectFiber(el);
                    const clickFn = (f && f.memoizedProps && typeof f.memoizedProps.onClick === 'function')
                        ? f.memoizedProps.onClick
                        : () => triggerRealClick(el);
                    answerButtonMap.set(key, {
                        dom: el,
                        onClick: clickFn,
                        rawAnswer: answerTexts.get(key)
                    });
                }
            }
        }

        if (question) activeQuestionRef = question;
        if (answerResultObj && activeQuestionRef) {
            saveAnswerToMemory(activeQuestionRef, answerResultObj.correctAnswers);
        }

        return {
            question,
            answerButtonMap,
            prize: outputPrize || controllerPrize,
            choiceArray,
            onAnswerFn,
            sendAnswerFn,

  // ============================================================================
  // FULL-PAGE GOOGLE-LIKE FROSTED GLASS BROWSER (Premium & Max Tiers)
  // ============================================================================
  function BrowserView() {
    const [query, setQuery] = useState("");
    const [tab, setTab] = useState("all");
    const [webResults, setWebResults] = useState([]);
    const [imgResults, setImgResults] = useState([]);
    const [shopResults, setShopResults] = useState([]);
    const [vidResults, setVidResults] = useState([]);
    const [loading, setLoading] = useState(false);
    const [activeUrl, setActiveUrl] = useState("");
    const [frameHtml, setFrameHtml] = useState("");
    const [previewImg, setPreviewImg] = useState(null);
    const [previewVid, setPreviewVid] = useState(null);
    const debounceRef = useRef(null);

    const isUrlLike = (str) => {
      const s = (str || "").trim();
      return /^(https?:\/\/|www\.)/i.test(s) || (/^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}(\/.*)?$/.test(s) && !s.includes(" "));
    };

    const openUrlAutomatically = useCallback(async (rawUrl) => {
      let target = (rawUrl || "").trim();
      if (!target) return;
      if (!/^https?:\/\//i.test(target)) target = "https://" + target;

      setActiveUrl(target);
      setLoading(true);

      const clickInterceptor = `
        <base href="${target}">
        <script>
          document.addEventListener('click', function(e) {
            var a = e.target.closest('a');
            if (a && a.href && !a.href.startsWith('javascript:')) {
              e.preventDefault();
              parent.postMessage({ type: 'AUTO_BROWSER_NAV', url: a.href }, '*');
            }
          }, true);
          document.addEventListener('submit', function(e) {
            var f = e.target;
            if (f && f.action) {
              e.preventDefault();
              var fd = new FormData(f);
              var params = new URLSearchParams(fd).toString();
              var dest = f.action.split('?')[0] + '?' + params;
              parent.postMessage({ type: 'AUTO_BROWSER_NAV', url: dest }, '*');
            }
          }, true);
        <\/script>
      `;

      if (target.includes("wikipedia.org/wiki/")) {
        try {
          const titlePart = target.split("/wiki/")[1];
          const wRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/html/${titlePart}`);
          if (wRes.ok) {
            const wHtml = await wRes.text();
            setFrameHtml(`
              <base href="https://en.wikipedia.org/wiki/">
              <style>
                body { font-family: 'Outfit', system-ui, sans-serif !important; background: #0e0e12 !important; color: #e6e6e6 !important; padding: 28px 40px !important; line-height: 1.65 !important; }
                a { color: #60a5fa !important; }
                img { max-width: 100%; height: auto; border-radius: 8px; }
                table, .infobox { background: #16161d !important; color: #ddd !important; border-color: #333 !important; }
              </style>
              ${clickInterceptor}
              ${wHtml}
            `);
            setLoading(false);
            return;
          }
        } catch {}
      }

      try {
        const fetchAllOrigins = async () => {
          const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(target)}`);
          if (!r.ok) throw new Error("fail");
          const j = await r.json();
          if (!j.contents || j.contents.length < 40) throw new Error("empty");
          return j.contents;
        };
        const fetchCodeTabs = async () => {
          const r = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(target)}`);
          if (!r.ok) throw new Error("fail");
          const t = await r.text();
          if (!t || t.length < 40) throw new Error("empty");
          return t;
        };

        const winningHtml = await Promise.any([fetchAllOrigins(), fetchCodeTabs()]);
        setFrameHtml(clickInterceptor + winningHtml);
      } catch {
        setFrameHtml("");
      }
      setLoading(false);
    }, []);

    useEffect(() => {
      const onMsg = (e) => {
        if (e.data && e.data.type === "AUTO_BROWSER_NAV" && e.data.url) {
          openUrlAutomatically(e.data.url);
        }
      };
      window.addEventListener("message", onMsg);
      return () => window.removeEventListener("message", onMsg);
    }, [openUrlAutomatically]);

    const executeGoogleSearch = useCallback(async (qText) => {
      const clean = (qText || "").trim();
      if (!clean) {
        setWebResults([]); setImgResults([]); setShopResults([]); setVidResults([]);
        return;
      }
      setLoading(true);

      try {
        const [wikiSearch, ddgSearch, wikiImages, dummyShop, itunesShop, pipedVids] = await Promise.all([
          fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(clean)}&srlimit=12&utf8=&format=json&origin=*`).then((r) => r.json()).catch(() => null),
          fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(clean)}&format=json&no_html=1&skip_disambig=1`).then((r) => r.json()).catch(() => null),
          fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=filetype:bitmap+${encodeURIComponent(clean)}&gsrlimit=24&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=500&format=json&origin=*`).then((r) => r.json()).catch(() => null),
          fetch(`https://dummyjson.com/products/search?q=${encodeURIComponent(clean)}&limit=12`).then((r) => r.json()).catch(() => null),
          fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(clean)}&entity=software,ebook,movie&limit=16`).then((r) => r.json()).catch(() => null),
          fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(clean)}&filter=videos`).then((r) => r.json()).catch(() => null)
        ]);

        const webList = [];
        if (isUrlLike(clean)) {
          const norm = /^https?:\/\//i.test(clean) ? clean : "https://" + clean;
          webList.push({ title: `🌐 Go to ${norm}`, url: norm, snippet: `Open ${norm} directly in full-screen unblocked view.` });

        if (ddgSearch?.AbstractText && ddgSearch?.AbstractURL) {

  function extractYouTubeSearchFromHtml(html) {
    const results = [];
    const seen = new Set();
    try {
      const m = /var ytInitialData\s*=\s*(\{.+?\});<\/script>/.exec(html);
      if (m && m[1]) {
        const data = JSON.parse(m[1]);
        const walk = (node) => {
          if (!node || typeof node !== "object") return;
          if (node.videoRenderer && node.videoRenderer.videoId) {
            const vr = node.videoRenderer;
            const id = vr.videoId;
            if (id && id.length === 11 && !seen.has(id)) {
              seen.add(id);
              const title = vr.title?.runs?.map((r) => r.text).join("") || vr.title?.simpleText || "YouTube Video";
              const author = vr.ownerText?.runs?.[0]?.text || vr.longBylineText?.runs?.[0]?.text || "YouTube";
              const views = vr.shortViewCountText?.simpleText || vr.viewCountText?.simpleText || "HD Video";
              results.push({ id, title, author, views, thumb: `https://i.ytimg.com/vi/${id}/hqdefault.jpg` });
            }
            return;
          }
          if (Array.isArray(node)) {
            for (const item of node) walk(item);
          } else {
            for (const k of Object.keys(node)) walk(node[k]);
          }
        };
        walk(data);
      }
    } catch {}
    return results;
  }

        const items = Array.isArray(data) ? data : (data.items || []);
        const mapped = items.map((item) => {
          const id = item.videoId || (item.url ? (item.url.split("v=")[1] || item.url.split("/").pop()) : "");
          return {
            id,
            title: item.title || "Video",
            author: item.uploaderName || item.author || "Creator",
            views: item.views ? Number(item.views).toLocaleString() + " views" : "HD Video",
            thumb: item.thumbnail || (item.videoThumbnails && item.videoThumbnails[0] && item.videoThumbnails[0].url) || ("https://i.ytimg.com/vi/" + id + "/hqdefault.jpg")
          };
        }).filter((v) => v.id && v.id.length === 11);
        if (mapped.length === 0) throw new Error("empty");
        return mapped;
      };

      const fetchYouTubeProxy = async () => {
        const ytUrl = "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
        const res = await fetchWithTimeout("https://api.allorigins.win/get?url=" + encodeURIComponent(ytUrl), {}, 5000);
        if (!res.ok) throw new Error("proxy fail");
        const j = await res.json();
        const parsed = extractYouTubeSearchFromHtml(j.contents || "");
        if (parsed.length === 0) throw new Error("no results");
        return parsed;
      };

      let found = [];
      try {
        found = await Promise.any([
          fetchJsonApi("https://pipedapi.kavin.rocks/search?q=" + encodeURIComponent(q) + "&filter=videos"),
          fetchJsonApi("https://api.piped.private.coffee/search?q=" + encodeURIComponent(q) + "&filter=videos"),
          fetchJsonApi("https://inv.nadeko.net/api/v1/search?q=" + encodeURIComponent(q) + "&type=video"),
          fetchJsonApi("https://invidious.nerdvpn.de/api/v1/search?q=" + encodeURIComponent(q) + "&type=video"),
          fetchJsonApi("https://inv.tux.pizza/api/v1/search?q=" + encodeURIComponent(q) + "&type=video"),
          fetchYouTubeProxy()
        ]);
      } catch {
        found = [];
      }

      if (seq !== searchSeqRef.current) return;

      // Only use FALLBACK_YT_VIDEOS if all live APIs fail, filtered by words in the query
      if (found.length === 0) {
        const words = q.toLowerCase().split(/\s+/).filter(Boolean);
        const localMatches = FALLBACK_YT_VIDEOS.filter((v) => {
          const hay = (v.title + " " + v.author + " " + (v.tags || "")).toLowerCase();
          return words.some((w) => hay.includes(w));
        });
        found = localMatches.length > 0 ? localMatches : FALLBACK_YT_VIDEOS;
      }

      setVideos(found.slice(0, 36));
      setLoading(false);
    }, [selectVideo]);

    useEffect(() => {
      const initialQ = YT_PRESETS[Math.floor(Math.random() * YT_PRESETS.length)].q;
      searchYouTube(initialQ);
    }, [searchYouTube]);

    const embedOrigin = location.origin && location.origin.startsWith("http") ? `&origin=${encodeURIComponent(location.origin)}` : "";

    return h("section", { className: "view" },
      h("div", { className: "page" },
        h("div", { className: "row", style: { flexWrap: "wrap", marginBottom: 16 } },

  // ============================================================================
    function ChatView({ currentUser, accountsMap }) {
    const DAY_MS = 24 * 60 * 60 * 1000;

    const [messages, setMessages] = useState(() => {
      try {
        const cutoff = Date.now() - DAY_MS;
        const local = JSON.parse(localStorage.getItem("ug_global_chat_v1") || "[]");
        return local.filter((m) => m && (m.timestamp || 0) >= cutoff);
      } catch {
        return [];
      }
    });
    const [inputMessage, setInputMessage] = useState("");
    const [attachment, setAttachment] = useState(null);
    const messagesEndRef = useRef(null);
    const hasInitializedScroll = useRef(false);

    // Auto-purge messages older than 24 hours locally and from Firebase RTDB
    const purgeAndSetMessages = useCallback((rawList, rawData, base) => {
      const cutoff = Date.now() - DAY_MS;
      const fresh = (rawList || []).filter((m) => m && (m.timestamp || 0) >= cutoff);
      fresh.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

      try {
        localStorage.setItem("ug_global_chat_v1", JSON.stringify(fresh));
      } catch {}

      setMessages(fresh);

      // Background permanent deletion of messages older than 24 hours from Cloud Database
      if (base && rawData) {
        Object.keys(rawData).forEach((k) => {
          const item = rawData[k];
          if (item && (item.timestamp || 0) < cutoff) {
            fetch(base + "/global_chat/" + encodeURIComponent(k) + ".json", { method: "DELETE" }).catch(() => {});
          }
        });
      }
    }, [DAY_MS]);

    const fetchChat = useCallback(async () => {
      const base = getDbUrl();
      if (!base) {
        try {
          const cutoff = Date.now() - DAY_MS;
          const local = JSON.parse(localStorage.getItem("ug_global_chat_v1") || "[]");
          const fresh = local.filter((m) => m && (m.timestamp || 0) >= cutoff);
          setMessages(fresh);
        } catch {}
        return;
      }
      try {
        // Must include orderBy="$key" for Firebase REST API limitToLast to succeed with 200 OK!
        const res = await fetch(base + '/global_chat.json?orderBy="$key"&limitToLast=25', { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          if (data) {
            const list = Object.keys(data).map((k) => Object.assign({ id: k }, data[k]));
            purgeAndSetMessages(list, data, base);
          } else {
            setMessages([]);
          }
        }
      } catch {}
    }, [DAY_MS, purgeAndSetMessages]);

    useEffect(() => {
      fetchChat();
      const interval = setInterval(fetchChat, 2500);
      return () => clearInterval(interval);
    }, [fetchChat]);

    // Initial scroll down ONLY ONCE on mount, then auto-scroll is OFF so user can scroll up freely
    useEffect(() => {
      if (!hasInitializedScroll.current && messages.length > 0) {
        hasInitializedScroll.current = true;
        setTimeout(() => {
          messagesEndRef.current?.scrollIntoView({ behavior: "auto" });
        }, 120);
      }
    }, [messages.length]);

    const scrollToBottom = () => {
      messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
    };

    const handleFileChange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) {
        alert("File size must be under 2MB for cloud sync.");
        return;
      }
      const reader = new FileReader();
      reader.onload = (uploadEvent) => {
        setAttachment({
          name: file.name,
          type: file.type,
          data: uploadEvent.target.result
        });
      };
      reader.readAsDataURL(file);
    };

    const sendMessage = async (e) => {
      e.preventDefault();
      const text = inputMessage.trim();
      if (!text && !attachment) return;
      if (!currentUser) return;

      const acc = accountsMap[currentUser.username.toLowerCase()] || currentUser;
      const isUserOwner = isOwnerIdentity(currentUser.username, acc);

      const newMsg = {
        sender: currentUser.username,
        role: isUserOwner ? "owner" : "user",
        tier: getUserTier(acc, isUserOwner),
        text,
        attachment: attachment || null,
        timestamp: Date.now()
      };

      // Optimistic update so message shows in 0ms immediately without freezing!
      const optId = "msg_opt_" + Date.now();
      const optimisticList = [...messages, Object.assign({ id: optId }, newMsg)];
      setMessages(optimisticList);
      try {
        localStorage.setItem("ug_global_chat_v1", JSON.stringify(optimisticList));
      } catch {}

      setInputMessage("");
      setAttachment(null);

      const base = getDbUrl();
      if (base) {
        try {
          await fetch(base + "/global_chat.json", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newMsg)
          });
        } catch {}
      }

      if (bc) bc.postMessage({ type: "chat_message_sent" });

      setTimeout(async () => {
        await fetchChat();
        scrollToBottom();
      }, 150);
    };

    return h("section", { className: "view", style: { height: "100%", display: "flex", flexDirection: "column" } },

        ),

      ),

            messages.length === 0
              ? h("div", { style: { textAlign: "center", color: "#666", marginTop: 40 } }, "No messages in the last 24 hours. Start the conversation!")
              : messages.map((m) => {

                  const isMsgOwner = m.role === "owner";
                  return h("div", {

                      border: "1px solid " + (isMe ? "rgba(30, 215, 96, 0.3)" : "rgba(255, 255, 255, 0.08)"),

    const [accountsMap, setAccountsMap] = useState({});
    const [sessionsMap, setSessionsMap] = useState({});

    const toast = useCallback((msg) => {
      setToastMsg(msg); setToastOn(true);
      clearTimeout(toastT.current);
      toastT.current = setTimeout(() => setToastOn(false), 2400);
    }, []);

    const isOwner = useMemo(() => {
      if (!currentUser) return false;
      const acc = accountsMap[currentUser.username?.toLowerCase()];
      return isOwnerIdentity(currentUser.username, acc || currentUser);
    }, [currentUser, accountsMap]);

    const userTier = useMemo(() => {
      if (!currentUser) return "free";
      const acc = accountsMap[currentUser.username?.toLowerCase()] || currentUser;
      return getUserTier(acc, isOwner);
    }, [currentUser, accountsMap, isOwner]);

    const navigate = useCallback((v) => {
      if (v === "tiktok") {
        setMaintenanceModal(true);
        return;
      }
      if (!canAccessView(userTier, v)) {
        const req = requiredTierForView(v);
        setUpgradePrompt({ viewName: v.toUpperCase(), reqTier: req });
        return;
      }
      setView(v);
      mainRef.current?.scrollTo(0, 0);
    }, [userTier]);

    const checkIncomingBroadcast = useCallback((bcObj, uname) => {
      if (!bcObj || !bcObj.id || !uname) return;
      if (Date.now() - (bcObj.timestamp || 0) > 600000) return;
      const targetClean = (bcObj.target || "all").toLowerCase();
      if (targetClean !== "all" && targetClean !== uname.toLowerCase()) return;
      try {
        const dismissed = JSON.parse(localStorage.getItem(LS_DISMISSED_BC) || "{}");
        if (dismissed[bcObj.id]) return;
      } catch {}
      setActiveBroadcast({
        ...bcObj,
        message: String(bcObj.message || "").slice(0, MAX_BROADCAST_CHARS)
      });
    }, []);

    const dismissBroadcast = (id) => {
      try {
        const dismissed = JSON.parse(localStorage.getItem(LS_DISMISSED_BC) || "{}");
        dismissed[id] = true;
        localStorage.setItem(LS_DISMISSED_BC, JSON.stringify(dismissed));
      } catch {}
      setActiveBroadcast(null);
    };

    const refreshDatabaseAndSession = useCallback(async () => {
      const { accounts, sessions, broadcast } = await dbFetchAll();
      setAccountsMap(accounts);
      setSessionsMap(sessions);

      const saved = getSavedSession();
      if (!saved || !saved.username) { setCurrentUser(null); return; }

      const key = saved.username.trim().toLowerCase();
      const acc = accounts[key];
      if (!acc) { saveCurrentSession(null); setCurrentUser(null); setPlaying(null); toast("Account revoked."); return; }

      const own = isOwnerIdentity(acc.username, acc);
      if (!own && !acc.infinite && acc.expiresAt && Date.now() >= acc.expiresAt) {
        await dbDeleteSession(acc.username); saveCurrentSession(null); setCurrentUser(null); setPlaying(null); toast("License expired."); return;
      }

      const remoteSess = sessions[key];
      if (remoteSess && remoteSess.kicked && (!saved.loginAt || (remoteSess.kickedAt || 0) >= saved.loginAt)) {
        await dbDeleteSession(acc.username); saveCurrentSession(null); setCurrentUser(null); setPlaying(null); toast("Kicked out by owner."); return;
      }

      if (broadcast && broadcast.id) {
        checkIncomingBroadcast(broadcast, acc.username);
      }

      const liveTier = getUserTier(acc, own);
      if (!canAccessView(liveTier, view)) {
        setView("home");
      }

      await dbUpsertSession({
        username: acc.username,
        email: acc.email || "",
        role: own ? "owner" : "user",
        tier: liveTier,
        sessionId: saved.sessionId || TAB_SESSION_ID,
        loginAt: saved.loginAt || Date.now(),
        lastPing: Date.now(),
        currentView: view,
        kicked: false
      });
      setSessionsMap(getLocalStore(LS_SESSIONS));
    }, [view, toast, checkIncomingBroadcast]);

    useEffect(() => {
      refreshDatabaseAndSession();
      const interval = setInterval(refreshDatabaseAndSession, 3500);
      return () => clearInterval(interval);
    }, [refreshDatabaseAndSession]);

    useEffect(() => {
      if (!bc) return;
      const onMsg = (e) => {
        if (e.data && e.data.type === "live_broadcast" && currentUser?.username) {
          checkIncomingBroadcast(e.data.payload, currentUser.username);
        }
      };
      bc.addEventListener("message", onMsg);
      return () => bc.removeEventListener("message", onMsg);
    }, [currentUser, checkIncomingBroadcast]);

    const launchGame = useCallback((g) => {
      saveInstalledGame(g.slug);
      setInstalledMap(getInstalledGames());
      if (!settings.cloak) {
        setPlaying(g);
        return;
      }
      if (!openCloaked(frameSource(g), settings)) toast("Popup blocked");
    }, [settings, toast]);

    const hideFloatingPills = view === "browser" || view === "movies" || view === "music";

    return h(Fragment, null,
      h(Stars),
      !currentUser ? h(LoginBox, { onLoginSuccess: (sess) => { setCurrentUser(sess); refreshDatabaseAndSession(); toast(`Welcome, ${sess.username}!`); } }) : null,
      h(Sidebar, { view, open, onToggle: () => setOpen((o) => !o), onNavigate: navigate, isOwner, userTier }),
      !hideFloatingPills ? h("div", { id: "topRight", style: { display: "flex", gap: 8, alignItems: "center" } },
        currentUser ? h("button", { className: "pill", style: { display: "flex", alignItems: "center", gap: 8 }, onClick: () => navigate(isOwner ? "creator" : "account") },
          h("span", null, currentUser.username),
          renderTierBadge(userTier, isOwner)
        ) : null
      ) : null,
      h("main", { ref: mainRef },
        view === "home" ? h(Home, { onNavigate: navigate, onSearch: (q) => { setQuery(q); navigate("games"); }, userTier }) : null,
        view === "blooket" && isOwner ? h(BlooketView, { toast }) : null,
        view === "sports" ? h(SportsView, { currentUser, userTier, isOwner, sessionsMap, toast }) : null,
        view === "broadcast" ? h(BroadcastView, { currentUser, userTier, isOwner, sessionsMap, accountsMap, toast }) : null,
        view === "youtube" ? h(YouTubeView, { toast }) : null,
        view === "tiktok" ? h(TikTokView, { toast }) : null,
        view === "browser" ? h(BrowserView, { toast }) : null,
        view === "games" ? h(GamesView, { query, onQuery: setQuery, onPlay: launchGame, installedMap }) : null,
        view === "chat" ? h(ChatView, { currentUser, accountsMap }) : null,
        view === "movies" ? h(MoviesView, { toast }) : null,
        view === "music" ? h(MusicView, { toast }) : null,
        view === "account" ? h(AccountProfileView, { currentUser, accountsMap, onLogout: async () => { await dbDeleteSession(currentUser.username); saveCurrentSession(null); setCurrentUser(null); setView("home"); }, onOpenCreator: () => navigate("creator"), isOwner, userTier }) : null,
        view === "creator" && isOwner ? h(AccountCreatorView, { accountsMap, sessionsMap, onRefresh: refreshDatabaseAndSession, toast }) : null,
        view === "settings" ? h(SettingsView, { settings, onSave: (s) => { setSettings(s); saveSettings(s); toast("Saved"); }, onCloakSite: () => cloakSite(settings) }) : null
      ),

      // TIKTOK UNDER MAINTENANCE POPUP
      maintenanceModal ? h(Modal, { onClose: () => setMaintenanceModal(false) },
        h("h3", null, "🔧 Under Maintenance"),
        h("p", null, "TikTok is currently locked for everybody while it is under maintenance. Please check back soon!"),
        h("div", { className: "actions" },
          h("button", { className: "btn", onClick: () => setMaintenanceModal(false) }, "Close")
        )
      ) : null,

      // TIER UPGRADE PROMPT MODAL
      upgradePrompt ? h(Modal, { onClose: () => setUpgradePrompt(null) },
        h("h3", null, `🔒 ${upgradePrompt.reqTier} Tier Required`),
        h("p", null, `Your account is currently on the ${userTier.toUpperCase()} tier. Accessing ${upgradePrompt.viewName} requires a ${upgradePrompt.reqTier} license. Contact the Owner to upgrade your account tier!`),
        h("div", { className: "actions" },
          h("button", { className: "btn", onClick: () => setUpgradePrompt(null) }, "Got It")
        )
      ) : null,

      // INCOMING LIVE SCREEN BROADCAST OVERLAY (Capped at 90 chars + Close button always visible!)
      activeBroadcast ? h("div", { className: "screen-broadcast-bg" },
        h("div", { className: "screen-broadcast-box" },
          h("div", null,
            h("div", { style: { display: "flex", justifyContent: "center", alignItems: "center", gap: 8, marginBottom: 12 } },
              h("span", { style: { fontSize: 24 } }, "📢"),
              renderTierBadge(activeBroadcast.tier || "max", activeBroadcast.tier === "owner")
            ),
            h("div", { style: { fontSize: 13, color: "#fca5a5", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6 } },
              `Live Screen Message from ${activeBroadcast.sender}`
            )
          ),
          h("div", { className: "screen-broadcast-msg" },
            String(activeBroadcast.message || "").slice(0, MAX_BROADCAST_CHARS)
          ),
          h("button", {
            className: "btn",
            style: { background: "#ef4444", color: "#fff", width: "100%", height: 48, fontSize: 16, flexShrink: 0 },
            onClick: () => dismissBroadcast(activeBroadcast.id)
          }, "Close")
        )
      ) : null,

      playing ? h(Player, { game: playing, onClose: () => setPlaying(null) }) : null,
      h("div", { id: "toast", className: toastOn ? "show" : "" }, toastMsg)
    );
  }

  createRoot(document.getElementById("root")).render(h(StrictMode, null, h(App)));
})();
    </script>
  </body>
</html>
