<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>unblockedgames</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
*, ::after, ::before, ::backdrop, ::file-selector-button { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
html, :host { line-height: 1.5; -webkit-text-size-adjust: 100%; tab-size: 4; font-family: "Outfit", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body { line-height: inherit; }
h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
a { color: inherit; text-decoration: inherit; }
b, strong { font-weight: bolder; }
code, kbd, samp, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 1em; }
img, svg, video, canvas, audio, iframe, embed, object { display: block; vertical-align: middle; }
img, video { max-width: 100%; height: auto; }
button, input, select, optgroup, textarea, ::file-selector-button {
  font: inherit; color: inherit; border-radius: 0; background-color: transparent; opacity: 1;
}
:root {
  --bg: #020203;
  --panel: #0b0b0d;
  --panel2: #111114;
  --border: rgba(255, 255, 255, 0.09);
  --text: #e6e6e6;
  --muted: #8a8a90;
}
html, body, #root { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: "Outfit", system-ui, sans-serif; overflow: hidden; }
button { cursor: pointer; font-family: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }
#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
/* Sidebar */
#sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 64px; background: #08080a; border-right: 1px solid var(--border); z-index: 30; display: flex; flex-direction: column; align-items: stretch; transition: width 0.25s ease; }
#sidebar.open { width: 196px; }
.side-group { display: flex; flex-direction: column; gap: 4px; padding: 2px; }
.side-btn { display: flex; align-items: center; gap: 14px; height: 44px; margin: 0; padding: 0 0 0 14px; border-radius: 999px; background: transparent; border: 1px solid transparent; color: #cfcfd4; cursor: pointer; transition: 0.2s; white-space: nowrap; overflow: hidden; font: 500 14px "Outfit"; position: relative; }
.side-btn svg { flex: 0 0 auto; width: 20px; height: 20px; }
.side-btn span { opacity: 0; transition: opacity 0.2s; }
#sidebar.open .side-btn span { opacity: 1; }
.side-btn:hover { background: rgba(255, 255, 255, 0.07); }
.side-btn.active { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.22); box-shadow: 0 0 22px rgba(255, 255, 255, 0.1); }
.side-btn.locked { opacity: 0.45; }
#sidebar .spacer { flex: 1; }
#expandBtn svg { transition: transform 0.25s; }
#sidebar.open #expandBtn svg { transform: rotate(180deg); }
/* Main */
main { position: fixed; left: 64px; right: 0; top: 0; bottom: 0; z-index: 10; overflow-y: auto; overflow-x: hidden; transition: left 0.25s ease; }
#sidebar.open ~ main { left: 196px; }
.view { height: 100%; animation: fade 0.35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
/* Pills */
.pill { background: rgba(20, 20, 23, 0.85); border: 1px solid var(--border); border-radius: 12px; padding: 8px 16px; font-size: 13px; color: #d6d6da; cursor: pointer; transition: 0.2s; backdrop-filter: blur(6px); }
.pill:hover { background: rgba(40, 40, 46, 0.95); border-color: rgba(255, 255, 255, 0.25); }
#topRight { position: fixed; top: 16px; right: 16px; z-index: 20; }
#footerLinks { position: fixed; bottom: 16px; right: 16px; z-index: 20; display: flex; gap: 10px; }
/* Home */
#home { display: flex; align-items: center; justify-content: center; flex-direction: column; height: 100%; padding-bottom: 40px; position: relative; }
.logo-wrap { position: relative; margin-bottom: 30px; text-align: center; }
.logo-wrap::before { content: ""; position: absolute; left: 50%; top: 50%; width: 120%; height: 150%; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.14), transparent 65%); filter: blur(24px); z-index: -1; }
.logo { font-size: clamp(48px, 9vw, 128px); font-weight: 600; letter-spacing: -0.04em; line-height: 1; color: #e4e4e4; margin: 0; text-shadow: 0 0 40px rgba(255, 255, 255, 0.22); }
.search-wrap { position: relative; width: min(800px, 88vw); }
.search-wrap::after { content: ""; position: absolute; inset: auto -4% -26px -4%; height: 60px; background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.07), transparent 70%); filter: blur(14px); z-index: -1; }
.search { display: flex; align-items: center; gap: 14px; height: 82px; padding: 0 34px; background: rgba(14, 14, 16, 0.92); border: 1px solid var(--border); border-radius: 14px; transition: 0.25s; position: relative; overflow: hidden; }
.search::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent); }
.search:focus-within { border-color: rgba(255, 255, 255, 0.28); box-shadow: 0 0 40px rgba(255, 255, 255, 0.07); }
.search svg { width: 22px; height: 22px; color: #b9b9be; flex: 0 0 auto; }
.search input { flex: 1; background: transparent; border: 0; outline: 0; color: #f0f0f0; font: 400 20px "Outfit"; min-width: 0; }
.search input::placeholder { color: #8e8e94; }
.quick { display: flex; gap: 22px; margin-top: 34px; flex-wrap: wrap; justify-content: center; }
.quick button { display: flex; flex-direction: column; align-items: center; gap: 10px; background: none; border: 0; color: #d8d8dc; font: 500 14px "Outfit"; cursor: pointer; position: relative; }
.quick .circ { width: 60px; height: 60px; border-radius: 50%; background: #131316; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; transition: 0.25s; position: relative; }
.quick .circ svg { width: 22px; height: 22px; }
.quick button:hover .circ { background: #1d1d22; border-color: rgba(255, 255, 255, 0.3); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(255, 255, 255, 0.07); }
.ad { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: 0.14em; color: #8b8b90; font-weight: 600; display: flex; gap: 10px; align-items: center; }
/* Page layout */
.page { padding: 36px 40px 90px; max-width: 1400px; margin: 0 auto; }
.page h2 { font-size: 34px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.02em; }
.page p.sub { color: var(--muted); margin: 0 0 24px; }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .search { height: 52px; padding: 0 20px; flex: 1; min-width: 240px; border-radius: 12px; }
.toolbar .search input { font-size: 16px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.chip { background: rgba(20, 20, 23, 0.85); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font: 500 13px "Outfit"; color: #c9c9ce; cursor: pointer; transition: 0.2s; }
.chip:hover { border-color: rgba(255, 255, 255, 0.28); }
.chip.on { background: #e4e4e4; color: #0a0a0a; border-color: #e4e4e4; }
.count { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.card { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; cursor: pointer; transition: 0.25s; text-align: left; padding: 0; color: inherit; font-family: inherit; }
.card:hover { transform: translateY(-4px); border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 24px rgba(255, 255, 255, 0.05); }
.card .thumb { position: relative; height: 120px; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 700; color: rgba(255, 255, 255, 0.85); overflow: hidden; }
.card .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .badge { position: absolute; top: 8px; left: 8px; background: rgba(0, 0, 0, 0.78); border: 1px solid var(--border); border-radius: 999px; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; padding: 2px 8px; color: #ddd; z-index: 2; }
.card .badge.installed { background: rgba(22, 163, 74, 0.88); color: #fff; border-color: rgba(74, 222, 128, 0.5); }
.card .info { padding: 11px 13px 13px; }
.card .name { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .tag { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; justify-content: space-between; }
.empty { padding: 60px 0; text-align: center; color: var(--muted); }
/* Settings & Buttons */
.setting { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; }
.setting h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.setting p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.field { width: 100%; height: 44px; background: #0e0e11; border: 1px solid var(--border); border-radius: 10px; padding: 0 14px; color: #eee; font: 400 14px "Outfit"; outline: 0; }
.field:focus { border-color: rgba(255, 255, 255, 0.3); }
.tier-select { background: #121217; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; color: #fff; cursor: pointer; outline: 0; }
.tier-select option { background: #0e0e12; color: #fff; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.toggle { position: relative; width: 48px; height: 28px; flex: 0 0 auto; }
.toggle input { display: none; }
.toggle span { position: absolute; inset: 0; background: #26262b; border-radius: 999px; cursor: pointer; transition: 0.2s; }
.toggle span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #aaa; transition: 0.2s; }
.toggle input:checked + span { background: #e4e4e4; }
.toggle input:checked + span::after { transform: translateX(20px); background: #111; }
.btn { background: #e4e4e4; color: #0a0a0a; border: 0; border-radius: 10px; height: 44px; padding: 0 20px; font: 600 14px "Outfit"; cursor: pointer; transition: 0.2s; }
.btn:hover { background: #fff; box-shadow: 0 0 24px rgba(255, 255, 255, 0.25); }
.btn.ghost { background: rgba(255, 255, 255, 0.07); color: #ddd; border: 1px solid var(--border); }
.btn.ghost:hover { background: rgba(255, 255, 255, 0.13); box-shadow: none; }
.btn.danger { background: rgba(220, 38, 38, 0.16); color: #fca5a5; border: 1px solid rgba(220, 38, 38, 0.4); }
.btn.danger:hover { background: #dc2626; color: #fff; border-color: #dc2626; }
.btn.warn { background: rgba(245, 158, 11, 0.14); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.38); }
.btn.warn:hover { background: #d97706; color: #fff; border-color: #d97706; }
.btn.sm { height: 34px; padding: 0 13px; font-size: 12.5px; border-radius: 8px; }
/* Modal & Player */
#modalBg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: #0c0c0f; border: 1px solid var(--border); border-radius: 18px; padding: 26px; width: min(480px, 100%); animation: fade 0.25s ease; }
.modal h3 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
.modal p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 16px; }
.modal .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 30px); background: #e4e4e4; color: #111; padding: 10px 18px; border-radius: 999px; font-weight: 500; font-size: 14px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 200; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#player { position: fixed; inset: 0; z-index: 90; background: #000; display: flex; flex-direction: column; animation: fade 0.25s ease; }
#player .bar { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 14px; background: #08080a; border-bottom: 1px solid var(--border); flex: 0 0 auto; overflow-x: auto; }
#player .bar .ttl { font-weight: 600; font-size: 15px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 10px; }
#player .bar .pill { padding: 6px 14px; white-space: nowrap; }
#player iframe { flex: 1; width: 100%; border: 0; background: #000; }
/* Auth & Panels */
.auth-overlay { position: fixed; inset: 0; z-index: 85; background: rgba(2, 2, 3, 0.92); backdrop-filter: blur(18px); display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade 0.3s ease; }
.auth-box { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 34px 30px; width: min(420px, 100%); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85); position: relative; overflow: hidden; }
.auth-logo { font-size: 36px; font-weight: 600; letter-spacing: -0.04em; color: #e4e4e4; text-align: center; margin: 0 0 6px; }
.auth-sub { color: var(--muted); font-size: 13.5px; text-align: center; margin: 0 0 24px; }
.auth-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
.auth-err { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); color: #fca5a5; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; text-align: center; }
.pop-panel { background: var(--panel); border: 1px solid rgba(255, 255, 255, 0.13); border-radius: 16px; padding: 18px 20px; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.7); transition: transform 0.22s ease, border-color 0.22s ease; position: relative; }
.pop-panel:hover { border-color: rgba(255, 255, 255, 0.25); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; display: inline-block; }
.status-dot.off { background: #71717a; box-shadow: none; }
.slider { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; background: #232329; border-radius: 999px; outline: none; cursor: pointer; }
.slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #e4e4e4; cursor: pointer; border: 2px solid #0b0b0d; }
.slider:disabled { opacity: 0.35; cursor: not-allowed; }
.eye-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border); border-radius: 8px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; color: #cfcfd4; cursor: pointer; }
.eye-btn:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
.eye-btn svg { width: 15px; height: 15px; }
.mono-box { font-family: monospace; background: #070709; border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 13px; color: #e4e4e4; display: inline-flex; align-items: center; gap: 8px; }
/* Tier Badges */
.badge-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--border); letter-spacing: 0.03em; }
.badge-pill.owner { background: rgba(255, 255, 255, 0.18); color: #fff; border-color: rgba(255, 255, 255, 0.45); }
.badge-pill.live { background: rgba(34, 197, 94, 0.14); color: #86efac; border-color: rgba(34, 197, 94, 0.35); }
.badge-pill.tier-free { background: rgba(161, 161, 170, 0.14); color: #d4d4d8; border-color: rgba(161, 161, 170, 0.35); }
.badge-pill.tier-pro { background: rgba(59, 130, 246, 0.18); color: #93c5fd; border-color: rgba(59, 130, 246, 0.45); }
.badge-pill.tier-premium { background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(168, 85, 247, 0.22)); color: #fde68a; border-color: rgba(245, 158, 11, 0.55); box-shadow: 0 0 16px rgba(245, 158, 11, 0.18); }
.badge-pill.tier-max { background: linear-gradient(135deg, rgba(239, 68, 68, 0.32), rgba(249, 115, 22, 0.32)); color: #fecaca; border-color: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.38); }
/* Live Screen Broadcast Overlay */
.screen-broadcast-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(12px); z-index: 250; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade 0.25s ease; }
.screen-broadcast-box { background: linear-gradient(180deg, #1a0b0e 0%, #0b0b0f 100%); border: 2px solid #ef4444; border-radius: 22px; padding: 28px; width: min(500px, 94vw); max-height: 85vh; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 28px 75px rgba(239, 68, 68, 0.35), 0 0 40px rgba(0, 0, 0, 0.9); text-align: center; overflow: hidden; }
.screen-broadcast-msg { font-size: 22px; font-weight: 700; color: #fff; line-height: 1.4; margin: 14px 0 22px; word-break: break-word; overflow-y: auto; max-height: 45vh; padding: 0 4px; }
/* ESPN Sports Hub */
.espn-banner { background: linear-gradient(135deg, #b91c1c 0%, #111115 70%); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 18px; padding: 22px 26px; margin-bottom: 22px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
.espn-logo { font-size: 30px; font-weight: 900; font-style: italic; letter-spacing: -0.03em; color: #fff; background: #dc2626; padding: 2px 14px; border-radius: 6px; display: inline-block; }
.espn-score-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.espn-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; transition: 0.2s; cursor: pointer; }
.espn-card:hover { border-color: #ef4444; transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.65); }
/* Browser, Movies, Spotify */
.gbrowser-root { height: 100%; width: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.gbrowser-idle { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.gbrowser-top { background: rgba(14, 14, 18, 0.82); backdrop-filter: blur(24px) saturate(150%); border-bottom: 1px solid rgba(255, 255, 255, 0.12); padding: 14px 28px 0; flex-shrink: 0; z-index: 15; }
.gbrowser-bar-row { display: flex; align-items: center; gap: 14px; max-width: 1100px; }
.glass-panel { width: min(820px, 92vw); background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(24px) saturate(140%); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 999px; padding: 8px 12px 8px 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7); display: flex; align-items: center; gap: 12px; }
.glass-panel.compact { width: 100%; max-width: 780px; padding: 4px 8px 4px 18px; }
.glass-input { flex: 1; height: 46px; background: transparent; border: 0; outline: 0; color: #fff; font: 400 18px "Outfit", sans-serif; min-width: 0; }
.glass-panel.compact .glass-input { height: 38px; font-size: 15.5px; }
.gbrowser-tabs { display: flex; gap: 24px; margin-top: 12px; padding-left: 8px; }
.gbrowser-tab { padding: 8px 4px 11px; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; display: flex; align-items: center; gap: 7px; }
.gbrowser-tab.on { color: #60a5fa; border-bottom-color: #60a5fa; }
.gbrowser-body { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
.gbrowser-results-wrap { max-width: 960px; padding: 24px 32px 80px; display: flex; flex-direction: column; gap: 14px; }
.gbrowser-card { background: rgba(20, 20, 26, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.11); border-radius: 16px; padding: 16px 20px; cursor: pointer; }
.gbrowser-img-grid { padding: 24px 32px 80px; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
.gbrowser-img-card { background: #0d0d12; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; }
.gbrowser-img-card img { width: 100%; height: 175px; object-fit: cover; }
.gbrowser-shop-grid { padding: 24px 32px 80px; display: grid; grid-template-columns: repeat(auto-fill, minmax(225px, 1fr)); gap: 18px; }
.gbrowser-shop-card { background: rgba(20, 20, 26, 0.75); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; cursor: pointer; }
.gbrowser-shop-card img { width: 100%; height: 190px; object-fit: contain; background: #fff; padding: 12px; }
.nf-wrap { background: #141414; min-height: 100%; padding-bottom: 80px; color: #fff; position: relative; }
.nf-topnav { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; padding: 16px 42px; background: rgba(20,20,20,0.85); backdrop-filter: blur(8px); }
.nf-logo { color: #e50914; font-size: 28px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
.nf-hero { position: relative; height: 62vh; min-height: 400px; width: 100%; overflow: hidden; display: flex; align-items: flex-end; padding: 0 42px 54px; }
.nf-hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); }
.nf-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #141414 0%, rgba(20,20,20,0.75) 45%, transparent 100%), linear-gradient(180deg, transparent 50%, #141414 100%); }

      }

          const data = await res.json();
          if (data) {
            const list = Object.keys(data).map((k) => ({ id: k, ...data[k] }));
            list.sort((a, b) => a.timestamp - b.timestamp);
            setMessages(list);
          }
        }

        }

            h("p", { className: "sub", style: { margin: "6px 0 0" } }, "Manage licensed user credentials and access.")
          ),
          h("button", { className: "btn", onClick: () => setCreateModal(true) }, "+ Create Account")
        ),
        h("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(320px, 1fr))", gap: 16 } },
          accountsList.map((acc) =>
            h("div", { key: acc.username, className: "pop-panel" },
              h("div", { className: "row", style: { marginBottom: 12 } },
                h("strong", { style: { fontSize: 16 } }, acc.username),
                h("button", { className: "btn danger sm", onClick: () => handleRevokeAccount(acc.username) }, "Revoke & Delete")
              ),
              h("div", { style: { background: "#070709", padding: 10, borderRadius: 8, fontSize: 13, display: "flex", flexDirection: "column", gap: 6 } },
                h("div", { className: "row" }, h("span", { style: { color: "#888" } }, "Tier:"), renderTierBadge(acc.tier || "free", acc.role === "owner")),
                h("div", { className: "row" }, h("span", { style: { color: "#888" } }, "2FA:"), h("strong", { style: { color: "#86efac" } }, acc.twoFA || "None")),
                h("div", { className: "row" }, h("span", { style: { color: "#888" } }, "Remaining:"), h("span", null, formatRemainingTime(acc, now)))
              )
            )
          )
        )
      ),
      createModal ? h(Modal, { onClose: () => setCreateModal(false) },
        h("h3", null, "Create Account"),
        h("form", { onSubmit: handleCreateAccount },
          h("div", { style: { marginBottom: 10 } }, h("label", { className: "auth-label" }, "Username"), h("input", { className: "field", value: newUsername, onChange: (e) => setNewUsername(e.target.value) })),
          h("div", { style: { marginBottom: 10 } }, h("label", { className: "auth-label" }, "Password"), h("input", { className: "field", value: newPassword, onChange: (e) => setNewPassword(e.target.value) })),
          h("div", { style: { marginBottom: 14 } },
            h("label", { className: "auth-label" }, "Tier"),
            h("select", { className: "field", value: newTier, onChange: (e) => setNewTier(e.target.value) },
              h("option", { value: "free" }, "Free"),
              h("option", { value: "pro" }, "Pro"),
              h("option", { value: "premium" }, "Premium"),
              h("option", { value: "max" }, "MAX")
            )
          ),
          h("div", { className: "actions" },
            h("button", { type: "submit", className: "btn" }, "Create"),
            h("button", { type: "button", className: "btn ghost", onClick: () => setCreateModal(false) }, "Cancel")
          )
        )
      ) : null,
      codeInfo ? h(Modal, { onClose: () => setCodeInfo(null) },
        h("h3", null, "🔑 2FA Key Generated"),
        h("p", null, `Copy this 2FA code for "${codeInfo.username}":`),
        h("div", { className: "mono-box", style: { fontSize: 22, margin: "14px 0" } }, codeInfo.code),
        h("div", { className: "actions" }, h("button", { className: "btn", onClick: () => setCodeInfo(null) }, "Done"))
      ) : null
    );
  }
  function SettingsView({ settings, onSave, onCloakSite }) {
    const [s, setS] = useState(settings);
    return h("section", { className: "view", id: "settings" },
      h("div", { className: "page", style: { maxWidth: 720 } },
        h("h2", null, "Settings"),
        h("p", { className: "sub" }, "Configure cloak settings."),
        h("div", { className: "setting" },
          h("div", { className: "row" },
            h("h3", null, "Open games in external about:blank"),
            h("input", { type: "checkbox", checked: s.cloak, onChange: (e) => setS({ ...s, cloak: e.target.checked }) })
          )
        ),
        h("button", { className: "btn", onClick: () => onSave(s) }, "Save")
      )
    );
  }
  // ============================================================================
  // SECURE LOGIN BOX — 1-USER CONCURRENCY LOCK & ALERT NOTIFICATIONS
  // ============================================================================
  function LoginBox({ onLoginSuccess }) {
    const [identifier, setIdentifier] = useState("");
    const [password, setPassword] = useState("");
    const [showPw, setShowPw] = useState(false);
    const [code, setCode] = useState("");
    const [err, setErr] = useState("");
    const [loading, setLoading] = useState(false);
    const handleSubmit = async (e) => {
      e.preventDefault();
      setErr("");
      const idClean = identifier.trim().toLowerCase();
      const pwClean = password.trim();
      if (!idClean || !pwClean) { setErr("Username and password required."); return; }
      setLoading(true);
      const blacklist = getRevokedBlacklist();
      if (blacklist[idClean]) {
        setLoading(false);
        setErr("This account has been revoked.");
        return;
      }
      const { accounts, sessions } = await dbFetchAll();
      const matched = accounts[idClean] || Object.values(accounts).find((a) => a.email && a.email.trim().toLowerCase() === idClean);
      if (!matched) {
        setLoading(false);
        if (idClean === "kevin" || idClean === "owner" || idClean === "admin" || AUTH_CONFIG.ownerEmails.includes(idClean)) {
          dispatchSecurityAlertEmail("UNAUTHORIZED_OWNER_ATTEMPT", { attemptedUser: idClean, status: "Account does not exist" });
        }
        setErr("Invalid username or password.");
        return;
      }
      if (matched.password !== pwClean) {
        setLoading(false);
        if (matched.role === "owner" || isOwnerIdentity(matched.username, matched)) {
          dispatchSecurityAlertEmail("FAILED_OWNER_PASSWORD", { attemptedUser: matched.username });
        }
        setErr("Invalid username or password.");
        return;
      }
      const isOwn = isOwnerIdentity(matched.username, matched);
      // STRICT 1 PERSON AT A TIME CONCURRENCY LOCK
      // If someone else has pinged within the last 30s, deny entry!
      const activeSess = sessions[matched.username.toLowerCase()];
      if (activeSess && !activeSess.kicked && Date.now() - (activeSess.lastPing || 0) < 30000) {
        const mySaved = getSavedSession();
        if (!mySaved || mySaved.sessionId !== activeSess.sessionId) {
          setLoading(false);
          setErr("⚠️ This account is currently in use on another computer/tab! Only 1 person is allowed at a time.");
          return;
        }
      }
      // 2FA requirement
      if (isOwn || matched.twoFA) {
        if (!code.trim() || (matched.twoFA && matched.twoFA.trim() !== code.trim())) {
          setLoading(false);
          if (isOwn) {
            dispatchSecurityAlertEmail("FAILED_OWNER_2FA", { attemptedUser: matched.username, enteredCode: code });
          }
          setErr("2FA Code is required or invalid.");
          return;
        }
      }
      const newSessionId = "sess_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
      const sess = {
        sessionId: newSessionId,
        username: matched.username,
        email: matched.email || "",
        role: isOwn ? "owner" : "user",
        tier: isOwn ? "owner" : (matched.tier || "free"),
        loginAt: Date.now(),
        lastPing: Date.now(),
        currentView: "home",
        kicked: false
      };
      if (isOwn) {
        dispatchSecurityAlertEmail("SUCCESSFUL_OWNER_LOGIN", { username: matched.username });
      }
      await dbUpsertSession(sess);
      saveCurrentSession(sess);
      setLoading(false);
      onLoginSuccess(sess);
    };
    return h("div", { className: "auth-overlay" },
      h("div", { className: "auth-box" },
        h("h1", { className: "auth-logo" }, "unblockedgames"),
        h("p", { className: "auth-sub" }, "1 person per account policy enforced."),
        err ? h("div", { className: "auth-err" }, err) : null,
        h("form", { onSubmit: handleSubmit, autoComplete: "off" },
          h("div", { style: { marginBottom: 14 } },
            h("label", { className: "auth-label" }, "Username"),
            h("input", { className: "field", placeholder: "Username...", value: identifier, onChange: (e) => setIdentifier(e.target.value) })
          ),
          h("div", { style: { marginBottom: 20 } },
            h("label", { className: "auth-label" }, "Password"),
            h("div", { style: { position: "relative", display: "flex", alignItems: "center" } },
              h("input", { className: "field", type: showPw ? "text" : "password", placeholder: "Password...", value: password, onChange: (e) => setPassword(e.target.value), style: { paddingRight: 44 } }),
              h("button", { type: "button", className: "eye-btn", onClick: () => setShowPw((v) => !v), style: { position: "absolute", right: 7, border: 0, background: "transparent" } }, showPw ? h(EyeOffIcon) : h(EyeIcon))
            )
          ),
          h("div", { style: { marginBottom: 20 } },
            h("label", { className: "auth-label" }, "2FA Code (If enabled)"),
            h("input", { className: "field", placeholder: "8-digit 2FA code", value: code, onChange: (e) => setCode(e.target.value) })
          ),
          h("button", { type: "submit", className: "btn", disabled: loading, style: { width: "100%" } }, loading ? "Verifying..." : "Sign In")
        )
      )
    );
  }
  // ============================================================================
  // APP ROOT COMPONENT
  // ============================================================================
  function App() {
    const [view, setView] = useState("home");
    const [open, setOpen] = useState(false);
    const [settings, setSettings] = useState(loadSettings);
    const [query, setQuery] = useState("");
    const [playing, setPlaying] = useState(null);
    const [installedMap, setInstalledMap] = useState(getInstalledGames);
    const [maintenanceModal, setMaintenanceModal] = useState(false);
    const [activeBroadcast, setActiveBroadcast] = useState(null);
    const [toastMsg, setToastMsg] = useState("");
    const [toastOn, setToastOn] = useState(false);
    const toastT = useRef(undefined);
    const [currentUser, setCurrentUser] = useState(getSavedSession);
    const [accountsMap, setAccountsMap] = useState({});
    const [sessionsMap, setSessionsMap] = useState({});
    const toast = useCallback((msg) => {
      setToastMsg(msg); setToastOn(true);
      clearTimeout(toastT.current);
      toastT.current = setTimeout(() => setToastOn(false), 2400);
    }, []);
    const isOwner = useMemo(() => {
      if (!currentUser) return false;
      const acc = accountsMap[currentUser.username?.toLowerCase()];
      return isOwnerIdentity(currentUser.username, acc || currentUser);
    }, [currentUser, accountsMap]);
    const userTier = useMemo(() => {
      if (!currentUser) return "free";
      const acc = accountsMap[currentUser.username?.toLowerCase()] || currentUser;
      return getUserTier(acc, isOwner);
    }, [currentUser, accountsMap, isOwner]);
    const navigate = useCallback((v) => {
      if (v === "tiktok") {
        setMaintenanceModal(true);
        return;
      }
      setView(v);
    }, []);
    const checkIncomingBroadcast = useCallback((bcObj, uname) => {
      if (!bcObj || !bcObj.id || !uname) return;
      if (Date.now() - (bcObj.timestamp || 0) > 300000) return;
      const targetClean = (bcObj.target || "all").toLowerCase();
      if (targetClean !== "all" && targetClean !== uname.toLowerCase()) return;
      try {
        const dismissed = JSON.parse(localStorage.getItem(LS_DISMISSED_BC) || "{}");
        if (dismissed[bcObj.id]) return;
      } catch {}
      setActiveBroadcast(bcObj);
    }, []);
    const dismissBroadcast = (id) => {
      try {
        const dismissed = JSON.parse(localStorage.getItem(LS_DISMISSED_BC) || "{}");
        dismissed[id] = true;
        localStorage.setItem(LS_DISMISSED_BC, JSON.stringify(dismissed));
      } catch {}
      setActiveBroadcast(null);
    };
    // Heartbeat & session integrity loop (Enforces 1 person per account)
    const refreshDatabase = useCallback(async () => {
      const { accounts, sessions, broadcast } = await dbFetchAll();
      setAccountsMap(accounts);
      setSessionsMap(sessions);
      const saved = getSavedSession();
      if (!saved || !saved.username) return;
      const key = saved.username.trim().toLowerCase();
      const blacklist = getRevokedBlacklist();
      // If account was revoked, kick immediately
      if (blacklist[key] || !accounts[key]) {
        saveCurrentSession(null);
        setCurrentUser(null);
        setPlaying(null);
        toast("Account revoked.");
        return;
      }
      // Check concurrency conflict: did another session take over?
      const remoteSess = sessions[key];
      if (remoteSess && remoteSess.sessionId && saved.sessionId && remoteSess.sessionId !== saved.sessionId) {
        saveCurrentSession(null);
        setCurrentUser(null);
        setPlaying(null);
        toast("Logged out: Account opened on another device!");
        return;
      }
      // Check incoming broadcast
      if (broadcast && broadcast.id) {
        checkIncomingBroadcast(broadcast, saved.username);
      }
      // Update heartbeat
      dbUpsertSession({
        ...saved,
        lastPing: Date.now(),
        currentView: view
      });
    }, [view, toast, checkIncomingBroadcast]);
    useEffect(() => {
      refreshDatabase();
      const interval = setInterval(refreshDatabase, 2000); // 2-second fast sync
      return () => clearInterval(interval);
    }, [refreshDatabase]);
    // Zero-latency cross-tab broadcast dispatch
    useEffect(() => {
      if (!bc) return;
      const onMsg = (e) => {
        if (e.data && e.data.type === "live_broadcast" && currentUser?.username) {
          checkIncomingBroadcast(e.data.payload, currentUser.username);
        }
        if (e.data && e.data.type === "account_revoked" && currentUser?.username?.toLowerCase() === e.data.username) {
          saveCurrentSession(null);
          setCurrentUser(null);
        }
      };
      bc.addEventListener("message", onMsg);
      return () => bc.removeEventListener("message", onMsg);
    }, [currentUser, checkIncomingBroadcast]);
    const launchGame = useCallback((g) => {
      saveInstalledGame(g.slug);
      setInstalledMap(getInstalledGames());
      if (!settings.cloak) {
        setPlaying(g);
        return;
      }
      openCloaked(frameSource(g), settings);
    }, [settings]);
    return h(Fragment, null,
      h(Stars),
      !currentUser ? h(LoginBox, { onLoginSuccess: (sess) => { setCurrentUser(sess); refreshDatabase(); toast(`Welcome, ${sess.username}!`); } }) : null,
      h(Sidebar, { view, open, onToggle: () => setOpen((o) => !o), onNavigate: navigate, isOwner, userTier }),
      h("main", null,
        view === "home" ? h(Home, { onNavigate: navigate, onSearch: (q) => { setQuery(q); navigate("games"); }, userTier }) : null,
        view === "sports" ? h(SportsView, { currentUser, userTier, isOwner, sessionsMap, toast }) : null,
        view === "broadcast" ? h(BroadcastView, { currentUser, userTier, isOwner, sessionsMap, accountsMap, toast }) : null,
        view === "youtube" ? h(YouTubeView, { toast }) : null,
        view === "tiktok" ? h(TikTokView) : null,
        view === "browser" ? h(BrowserView) : null,
        view === "games" ? h(GamesView, { query, onQuery: setQuery, onPlay: launchGame, installedMap }) : null,
        view === "chat" ? h(ChatView, { currentUser, accountsMap }) : null,
        view === "movies" ? h(MoviesView) : null,
        view === "music" ? h(MusicView) : null,
        view === "account" ? h(AccountProfileView, { currentUser, accountsMap, onLogout: async () => { await dbDeleteSession(currentUser.username); saveCurrentSession(null); setCurrentUser(null); setView("home"); }, onOpenCreator: () => navigate("creator"), isOwner, userTier }) : null,
        view === "creator" && isOwner ? h(AccountCreatorView, { accountsMap, sessionsMap, onRefresh: refreshDatabase, toast }) : null,
        view === "settings" ? h(SettingsView, { settings, onSave: (s) => { setSettings(s); saveSettings(s); toast("Saved"); }, onCloakSite: () => cloakSite(settings) }) : null
      ),
      maintenanceModal ? h(Modal, { onClose: () => setMaintenanceModal(false) },
        h("h3", null, "🔧 Under Maintenance"),
        h("p", null, "TikTok is currently locked for all users while video relay servers are upgraded."),
        h("div", { className: "actions" },
          h("button", { className: "btn", onClick: () => setMaintenanceModal(false) }, "Close")
        )
      ) : null,
      activeBroadcast ? h("div", { className: "screen-broadcast-bg" },
        h("div", { className: "screen-broadcast-box" },
          h("div", null,
            h("div", { style: { display: "flex", justifyContent: "center", alignItems: "center", gap: 8, marginBottom: 12 } },
              h("span", { style: { fontSize: 24 } }, "📢"),
              renderTierBadge(activeBroadcast.tier || "max", activeBroadcast.tier === "owner")
            ),
            h("div", { style: { fontSize: 13, color: "#fca5a5", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6 } },
              `Live Screen Message from ${activeBroadcast.sender}`
            )
          ),
          h("div", { className: "screen-broadcast-msg" },
            String(activeBroadcast.message || "").slice(0, MAX_BROADCAST_CHARS)
          ),
          h("button", {
            className: "btn",
            style: { background: "#ef4444", color: "#fff", width: "100%", height: 48, fontSize: 16, flexShrink: 0 },
            onClick: () => dismissBroadcast(activeBroadcast.id)
          }, "Close")
        )
      ) : null,
      playing ? h(Player, { game: playing, onClose: () => setPlaying(null) }) : null,
      h("div", id: "toast", className: toastOn ? "show" : "")
    );
  }
  createRoot(document.getElementById("root")).render(h(StrictMode, null, h(App)));
})();
    </script>
  </body>
