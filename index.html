<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unblockedgames</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
*, ::after, ::before, ::backdrop, ::file-selector-button { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
html, :host { line-height: 1.5; -webkit-text-size-adjust: 100%; tab-size: 4; font-family: "Outfit", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body { line-height: inherit; }
h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
a { color: inherit; text-decoration: inherit; }
b, strong { font-weight: bolder; }
code, kbd, samp, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 1em; }
img, svg, video, canvas, audio, iframe, embed, object { display: block; vertical-align: middle; }
img, video { max-width: 100%; height: auto; }
button, input, select, optgroup, textarea, ::file-selector-button {
  font: inherit; color: inherit; border-radius: 0; background-color: transparent; opacity: 1;
}
:root {
  --bg: #020203;
  --panel: #0b0b0d;
  --panel2: #111114;
  --border: rgba(255, 255, 255, 0.09);
  --text: #e6e6e6;
  --muted: #8a8a90;
}
html, body, #root { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: "Outfit", system-ui, sans-serif; overflow: hidden; }
button { cursor: pointer; font-family: inherit; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }

#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* Sidebar */
#sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 64px; background: #08080a; border-right: 1px solid var(--border); z-index: 30; display: flex; flex-direction: column; align-items: stretch; transition: width 0.25s ease; }
#sidebar.open { width: 190px; }
.side-group { display: flex; flex-direction: column; gap: 4px; padding: 2px; }
.side-btn { display: flex; align-items: center; gap: 14px; height: 44px; margin: 0; padding: 0 0 0 14px; border-radius: 999px; background: transparent; border: 1px solid transparent; color: #cfcfd4; cursor: pointer; transition: 0.2s; white-space: nowrap; overflow: hidden; font: 500 14px "Outfit"; }
.side-btn svg { flex: 0 0 auto; width: 20px; height: 20px; }
.side-btn span { opacity: 0; transition: opacity 0.2s; }
#sidebar.open .side-btn span { opacity: 1; }
.side-btn:hover { background: rgba(255, 255, 255, 0.07); }
.side-btn.active { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.22); box-shadow: 0 0 22px rgba(255, 255, 255, 0.1); }
#sidebar .spacer { flex: 1; }
#expandBtn svg { transition: transform 0.25s; }
#sidebar.open #expandBtn svg { transform: rotate(180deg); }

/* Main */
main { position: fixed; left: 64px; right: 0; top: 0; bottom: 0; z-index: 10; overflow-y: auto; overflow-x: hidden; transition: left 0.25s ease; }
#sidebar.open ~ main { left: 190px; }
.view { height: 100%; animation: fade 0.35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Pills */
.pill { background: rgba(20, 20, 23, 0.85); border: 1px solid var(--border); border-radius: 12px; padding: 8px 16px; font-size: 13px; color: #d6d6da; cursor: pointer; transition: 0.2s; backdrop-filter: blur(6px); }
.pill:hover { background: rgba(40, 40, 46, 0.95); border-color: rgba(255, 255, 255, 0.25); }
#topRight { position: fixed; top: 16px; right: 16px; z-index: 20; }
#footerLinks { position: fixed; bottom: 16px; right: 16px; z-index: 20; display: flex; gap: 10px; }

/* Home */
#home { display: flex; align-items: center; justify-content: center; flex-direction: column; height: 100%; padding-bottom: 40px; position: relative; }
.logo-wrap { position: relative; margin-bottom: 30px; text-align: center; }
.logo-wrap::before { content: ""; position: absolute; left: 50%; top: 50%; width: 120%; height: 150%; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.14), transparent 65%); filter: blur(24px); z-index: -1; }
.logo { font-size: clamp(48px, 9vw, 128px); font-weight: 600; letter-spacing: -0.04em; line-height: 1; color: #e4e4e4; margin: 0; text-shadow: 0 0 40px rgba(255, 255, 255, 0.22); }
.search-wrap { position: relative; width: min(800px, 88vw); }
.search-wrap::after { content: ""; position: absolute; inset: auto -4% -26px -4%; height: 60px; background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.07), transparent 70%); filter: blur(14px); z-index: -1; }
.search { display: flex; align-items: center; gap: 14px; height: 82px; padding: 0 34px; background: rgba(14, 14, 16, 0.92); border: 1px solid var(--border); border-radius: 14px; transition: 0.25s; position: relative; overflow: hidden; }
.search::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent); }
.search:focus-within { border-color: rgba(255, 255, 255, 0.28); box-shadow: 0 0 40px rgba(255, 255, 255, 0.07); }
.search svg { width: 22px; height: 22px; color: #b9b9be; flex: 0 0 auto; }
.search input { flex: 1; background: transparent; border: 0; outline: 0; color: #f0f0f0; font: 400 20px "Outfit"; min-width: 0; }
.search input::placeholder { color: #8e8e94; }
.quick { display: flex; gap: 22px; margin-top: 34px; flex-wrap: wrap; justify-content: center; }
.quick button { display: flex; flex-direction: column; align-items: center; gap: 10px; background: none; border: 0; color: #d8d8dc; font: 500 14px "Outfit"; cursor: pointer; }
.quick .circ { width: 60px; height: 60px; border-radius: 50%; background: #131316; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; transition: 0.25s; }
.quick .circ svg { width: 22px; height: 22px; }
.quick button:hover .circ { background: #1d1d22; border-color: rgba(255, 255, 255, 0.3); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(255, 255, 255, 0.07); }
.ad { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: 0.14em; color: #8b8b90; font-weight: 600; display: flex; gap: 10px; align-items: center; }

/* Page layout */
.page { padding: 36px 40px 90px; max-width: 1400px; margin: 0 auto; }
.page h2 { font-size: 34px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.02em; }
.page p.sub { color: var(--muted); margin: 0 0 24px; }
.page code { background: rgba(255, 255, 255, 0.08); padding: 1px 6px; border-radius: 6px; font-size: 0.9em; }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .search { height: 52px; padding: 0 20px; flex: 1; min-width: 240px; border-radius: 12px; }
.toolbar .search input { font-size: 16px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.chip { background: rgba(20, 20, 23, 0.85); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font: 500 13px "Outfit"; color: #c9c9ce; cursor: pointer; transition: 0.2s; }
.chip:hover { border-color: rgba(255, 255, 255, 0.28); }
.chip.on { background: #e4e4e4; color: #0a0a0a; border-color: #e4e4e4; }
.count { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.card { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; cursor: pointer; transition: 0.25s; text-align: left; padding: 0; color: inherit; font-family: inherit; }
.card:hover { transform: translateY(-4px); border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 24px rgba(255, 255, 255, 0.05); }
.card .thumb { position: relative; height: 120px; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 700; color: rgba(255, 255, 255, 0.85); overflow: hidden; }
.card .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .badge { position: absolute; top: 8px; left: 8px; background: rgba(0, 0, 0, 0.78); border: 1px solid var(--border); border-radius: 999px; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; padding: 2px 8px; color: #ddd; z-index: 2; }
.card .badge.installed { background: rgba(22, 163, 74, 0.88); color: #fff; border-color: rgba(74, 222, 128, 0.5); }
.card .info { padding: 11px 13px 13px; }
.card .name { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .tag { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; justify-content: space-between; }
.empty { padding: 60px 0; text-align: center; color: var(--muted); }

/* Settings & Buttons */
.setting { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; }
.setting h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.setting p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.field { width: 100%; height: 44px; background: #0e0e11; border: 1px solid var(--border); border-radius: 10px; padding: 0 14px; color: #eee; font: 400 14px "Outfit"; outline: 0; }
.field:focus { border-color: rgba(255, 255, 255, 0.3); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.toggle { position: relative; width: 48px; height: 28px; flex: 0 0 auto; }
.toggle input { display: none; }
.toggle span { position: absolute; inset: 0; background: #26262b; border-radius: 999px; cursor: pointer; transition: 0.2s; }
.toggle span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #aaa; transition: 0.2s; }
.toggle input:checked + span { background: #e4e4e4; }
.toggle input:checked + span::after { transform: translateX(20px); background: #111; }
.btn { background: #e4e4e4; color: #0a0a0a; border: 0; border-radius: 10px; height: 44px; padding: 0 20px; font: 600 14px "Outfit"; cursor: pointer; transition: 0.2s; }
.btn:hover { background: #fff; box-shadow: 0 0 24px rgba(255, 255, 255, 0.25); }
.btn.ghost { background: rgba(255, 255, 255, 0.07); color: #ddd; border: 1px solid var(--border); }
.btn.ghost:hover { background: rgba(255, 255, 255, 0.13); box-shadow: none; }
.btn.danger { background: rgba(220, 38, 38, 0.16); color: #fca5a5; border: 1px solid rgba(220, 38, 38, 0.4); }
.btn.danger:hover { background: #dc2626; color: #fff; border-color: #dc2626; }
.btn.warn { background: rgba(245, 158, 11, 0.14); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.38); }
.btn.warn:hover { background: #d97706; color: #fff; border-color: #d97706; }
.btn.sm { height: 34px; padding: 0 13px; font-size: 12.5px; border-radius: 8px; }

/* Modal & Player */
#modalBg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: #0c0c0f; border: 1px solid var(--border); border-radius: 18px; padding: 26px; width: min(480px, 100%); animation: fade 0.25s ease; }
.modal h3 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
.modal p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 16px; }
.modal .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 30px); background: #e4e4e4; color: #111; padding: 10px 18px; border-radius: 999px; font-weight: 500; font-size: 14px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 200; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

#player { position: fixed; inset: 0; z-index: 90; background: #000; display: flex; flex-direction: column; animation: fade 0.25s ease; }
#player .bar { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 14px; background: #08080a; border-bottom: 1px solid var(--border); flex: 0 0 auto; overflow-x: auto; }
#player .bar .ttl { font-weight: 600; font-size: 15px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 10px; }
#player .bar .pill { padding: 6px 14px; white-space: nowrap; }
#player iframe { flex: 1; width: 100%; border: 0; background: #000; }

/* Auth & Panels */
.auth-overlay { position: fixed; inset: 0; z-index: 85; background: rgba(2, 2, 3, 0.92); backdrop-filter: blur(18px); display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade 0.3s ease; }
.auth-box { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 34px 30px; width: min(420px, 100%); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85); position: relative; overflow: hidden; }
.auth-logo { font-size: 36px; font-weight: 600; letter-spacing: -0.04em; color: #e4e4e4; text-align: center; margin: 0 0 6px; }
.auth-sub { color: var(--muted); font-size: 13.5px; text-align: center; margin: 0 0 24px; }
.auth-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
.auth-err { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); color: #fca5a5; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; text-align: center; }
.pop-panel { background: var(--panel); border: 1px solid rgba(255, 255, 255, 0.13); border-radius: 16px; padding: 18px 20px; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.7); transition: transform 0.22s ease, border-color 0.22s ease; position: relative; }
.pop-panel:hover { border-color: rgba(255, 255, 255, 0.25); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; display: inline-block; }
.status-dot.off { background: #71717a; box-shadow: none; }
.status-dot.exp { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
.slider { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; background: #232329; border-radius: 999px; outline: none; cursor: pointer; }
.slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #e4e4e4; cursor: pointer; border: 2px solid #0b0b0d; }
.slider:disabled { opacity: 0.35; cursor: not-allowed; }
.eye-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border); border-radius: 8px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; color: #cfcfd4; cursor: pointer; }
.eye-btn:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
.eye-btn svg { width: 15px; height: 15px; }
.mono-box { font-family: monospace; background: #070709; border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 13px; color: #e4e4e4; display: inline-flex; align-items: center; gap: 8px; }
.badge-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--border); }
.badge-pill.owner { background: rgba(255, 255, 255, 0.15); color: #fff; border-color: rgba(255, 255, 255, 0.35); }
.badge-pill.live { background: rgba(34, 197, 94, 0.14); color: #86efac; border-color: rgba(34, 197, 94, 0.35); }

/* ============================================================================
   FULL-SCREEN GOOGLE-STYLE FROSTED GLASS BROWSER
   ============================================================================ */
.gbrowser-root {
  height: 100%;
  width: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
/* Idle State: Centered Frosted Glass Search */
.gbrowser-idle {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
/* Active State: Full-Page Browser Layout */
.gbrowser-top {
  background: rgba(14, 14, 18, 0.82);
  backdrop-filter: blur(24px) saturate(150%);
  -webkit-backdrop-filter: blur(24px) saturate(150%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  padding: 14px 28px 0;
  flex-shrink: 0;
  z-index: 15;
}
.gbrowser-bar-row {
  display: flex;
  align-items: center;
  gap: 14px;
  max-width: 1100px;
}
.glass-panel {
  width: min(820px, 92vw);
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 999px;
  padding: 8px 12px 8px 24px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.22);
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.22s ease;
}
.glass-panel.compact {
  width: 100%;
  max-width: 780px;
  padding: 4px 8px 4px 18px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
}
.glass-panel:focus-within {
  background: rgba(255, 255, 255, 0.09);
  border-color: rgba(255, 255, 255, 0.38);
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 255, 255, 0.08);
}
.glass-panel svg { width: 20px; height: 20px; color: rgba(255, 255, 255, 0.75); flex-shrink: 0; }
.glass-input {
  flex: 1;
  height: 46px;
  background: transparent;
  border: 0;
  outline: 0;
  color: #fff;
  font: 400 18px "Outfit", sans-serif;
  min-width: 0;
}
.glass-panel.compact .glass-input { height: 38px; font-size: 15.5px; }
.glass-input::placeholder { color: rgba(255, 255, 255, 0.42); }

/* Google-style Sub-Tabs (All, Images, Shopping, Videos) */
.gbrowser-tabs {
  display: flex;
  gap: 24px;
  margin-top: 12px;
  padding-left: 8px;
}
.gbrowser-tab {
  padding: 8px 4px 11px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  border-bottom: 3px solid transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: 0.18s;
}
.gbrowser-tab:hover { color: #fff; }
.gbrowser-tab.on { color: #60a5fa; border-bottom-color: #60a5fa; }

/* Full-screen Browser Content Body */
.gbrowser-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
}
.gbrowser-results-wrap {
  max-width: 960px;
  padding: 24px 32px 80px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.gbrowser-card {
  background: rgba(20, 20, 26, 0.65);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.11);
  border-radius: 16px;
  padding: 16px 20px;
  cursor: pointer;
  transition: 0.2s;
}
.gbrowser-card:hover {
  background: rgba(32, 32, 42, 0.85);
  border-color: rgba(96, 165, 250, 0.45);
  transform: translateY(-2px);
}
/* Google Images Grid */
.gbrowser-img-grid {
  padding: 24px 32px 80px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 16px;
}
.gbrowser-img-card {
  background: #0d0d12;
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.22s;
}
.gbrowser-img-card:hover { transform: scale(1.03); border-color: rgba(255,255,255,0.35); }
.gbrowser-img-card img { width: 100%; height: 175px; object-fit: cover; background: #16161d; }
/* Google Shopping Grid */
.gbrowser-shop-grid {
  padding: 24px 32px 80px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
  gap: 18px;
}
.gbrowser-shop-card {
  background: rgba(20, 20, 26, 0.75);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: 0.22s;
}
.gbrowser-shop-card:hover { transform: translateY(-4px); border-color: rgba(74, 222, 128, 0.45); box-shadow: 0 14px 30px rgba(0,0,0,0.65); }
.gbrowser-shop-card img { width: 100%; height: 190px; object-fit: contain; background: #fff; padding: 12px; }

/* Netflix UI */
.nf-wrap { background: #141414; min-height: 100%; padding-bottom: 80px; color: #fff; position: relative; }
.nf-topnav { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; padding: 16px 42px; background: rgba(20,20,20,0.85); backdrop-filter: blur(8px); gap: 20px; flex-wrap: wrap; }
.nf-logo { color: #e50914; font-size: 28px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; }
.nf-hero { position: relative; height: 62vh; min-height: 400px; width: 100%; overflow: hidden; display: flex; align-items: flex-end; padding: 0 42px 54px; }
.nf-hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); }
.nf-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #141414 0%, rgba(20,20,20,0.75) 45%, transparent 100%), linear-gradient(180deg, transparent 50%, #141414 100%); }
.nf-hero-content { position: relative; z-index: 5; max-width: 600px; }
.nf-hero-title { font-size: clamp(32px, 4.5vw, 56px); font-weight: 800; line-height: 1.05; margin: 6px 0 12px; }

  // --- Stars Background ---
  function Stars() {
    const ref = useRef(null);
    useEffect(() => {
      const cv = ref.current, ctx = cv.getContext("2d");
      let W = 0, H = 0, raf = 0, stars = [];
      const dpr = window.devicePixelRatio || 1;
      const resize = () => {
        W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
        cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
        const n = Math.floor((innerWidth * innerHeight) / 9000);
        stars = Array.from({ length: n }, () => ({
          x: Math.random() * W, y: Math.random() * H,
          r: (Math.random() * 1.4 + 0.5) * dpr, s: (Math.random() * 0.12 + 0.02) * dpr,
          p: Math.random() * Math.PI * 2, f: Math.random() * 0.02 + 0.005,
        }));
      };
      const frame = () => {
        ctx.clearRect(0, 0, W, H); ctx.fillStyle = "#fff";
        for (const s of stars) {
          s.y += s.s; s.p += s.f;
          if (s.y > H + 5) { s.y = -5; s.x = Math.random() * W; }
          ctx.globalAlpha = 0.35 + 0.55 * Math.abs(Math.sin(s.p));
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
        }
        raf = requestAnimationFrame(frame);
      };
      addEventListener("resize", resize); resize(); frame();
      return () => { removeEventListener("resize", resize); cancelAnimationFrame(raf); };
    }, []);
    return h("canvas", { id: "stars", ref });
  }

  // --- Home Component ---
  const WORDS = ["Roblox", "Geometry Dash", "YouTube", "TikTok", "Play anything"];
  function useTypingPlaceholder(paused) {
    const [text, setText] = useState("Browse");
    const pausedRef = useRef(paused);
    pausedRef.current = paused;
    useEffect(() => {
      let w = 0, i = 0, del = false, t;
      const tick = () => {
        if (pausedRef.current) { i = 0; del = false; setText("Browse"); t = setTimeout(tick, 600); return; }
        const word = WORDS[w];
        setText(word.slice(0, i) + "|");
        let delay = del ? 45 : 95;
        if (!del && i === word.length) { del = true; delay = 1800; }
        else if (del && i === 0) { del = false; w = (w + 1) % WORDS.length; delay = 400; }
        else i += del ? -1 : 1;
        t = setTimeout(tick, delay);
      };
      tick();
      return () => clearTimeout(t);
    }, []);
    return text;
  }

  // ============================================================================
  // FULL-PAGE GOOGLE-LIKE FROSTED GLASS BROWSER (All, Images, Shopping, Videos + Auto-URL Unblocker)
  // ============================================================================
  function BrowserView() {
    const [query, setQuery] = useState("");
    const [tab, setTab] = useState("all"); // "all", "images", "shopping", "videos"
    const [webResults, setWebResults] = useState([]);
    const [imgResults, setImgResults] = useState([]);
    const [shopResults, setShopResults] = useState([]);
    const [vidResults, setVidResults] = useState([]);
    const [loading, setLoading] = useState(false);
    const [activeUrl, setActiveUrl] = useState("");
    const [frameHtml, setFrameHtml] = useState("");
    const [previewImg, setPreviewImg] = useState(null);
    const [previewVid, setPreviewVid] = useState(null);
    const debounceRef = useRef(null);

    const isUrlLike = (str) => {
      const s = (str || "").trim();
      return /^(https?:\/\/|www\.)/i.test(s) || (/^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}(\/.*)?$/.test(s) && !s.includes(" "));
    };

    // Single Automatic Working Provider: Races proxies in parallel and renders the first valid HTML!
    const openUrlAutomatically = useCallback(async (rawUrl) => {
      let target = (rawUrl || "").trim();
      if (!target) return;
      if (!/^https?:\/\//i.test(target)) target = "https://" + target;

      setActiveUrl(target);
      setLoading(true);

      const clickInterceptor = `
        <base href="${target}">
        <script>
          document.addEventListener('click', function(e) {
            var a = e.target.closest('a');
            if (a && a.href && !a.href.startsWith('javascript:')) {
              e.preventDefault();
              parent.postMessage({ type: 'AUTO_BROWSER_NAV', url: a.href }, '*');
            }
          }, true);
          document.addEventListener('submit', function(e) {
            var f = e.target;
            if (f && f.action) {
              e.preventDefault();
              var fd = new FormData(f);
              var params = new URLSearchParams(fd).toString();
              var dest = f.action.split('?')[0] + '?' + params;
              parent.postMessage({ type: 'AUTO_BROWSER_NAV', url: dest }, '*');
            }
          }, true);
        <\/script>
      `;

      // Fast path for Wikipedia URLs (100% native unblocked REST API)
      if (target.includes("wikipedia.org/wiki/")) {
        try {
          const titlePart = target.split("/wiki/")[1];
          const wRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/html/${titlePart}`);
          if (wRes.ok) {
            const wHtml = await wRes.text();
            setFrameHtml(`
              <base href="https://en.wikipedia.org/wiki/">
              <style>
                body { font-family: 'Outfit', system-ui, sans-serif !important; background: #0e0e12 !important; color: #e6e6e6 !important; padding: 28px 40px !important; line-height: 1.65 !important; }
                a { color: #60a5fa !important; }
                img { max-width: 100%; height: auto; border-radius: 8px; }
                table, .infobox { background: #16161d !important; color: #ddd !important; border-color: #333 !important; }
              </style>
              ${clickInterceptor}
              ${wHtml}
            `);
            setLoading(false);
            return;
          }
        } catch {}
      }

      // Race AllOrigins & CodeTabs simultaneously so the fastest working provider wins automatically
      try {
        const fetchAllOrigins = async () => {
          const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(target)}`);
          if (!r.ok) throw new Error("fail");
          const j = await r.json();
          if (!j.contents || j.contents.length < 40) throw new Error("empty");
          return j.contents;
        };
        const fetchCodeTabs = async () => {
          const r = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(target)}`);
          if (!r.ok) throw new Error("fail");
          const t = await r.text();
          if (!t || t.length < 40) throw new Error("empty");
          return t;
        };

        const winningHtml = await Promise.any([fetchAllOrigins(), fetchCodeTabs()]);
        setFrameHtml(clickInterceptor + winningHtml);
      } catch {
        // Automatic fallback to native sandboxed iframe if both CORS relays are blocked by target site
        setFrameHtml("");
      }
      setLoading(false);
    }, []);

    useEffect(() => {
      const onMsg = (e) => {
        if (e.data && e.data.type === "AUTO_BROWSER_NAV" && e.data.url) {
          openUrlAutomatically(e.data.url);
        }
      };
      window.addEventListener("message", onMsg);
      return () => window.removeEventListener("message", onMsg);
    }, [openUrlAutomatically]);

    // Fetch All, Images, Shopping, and Videos concurrently like Google!
    const executeGoogleSearch = useCallback(async (qText) => {
      const clean = (qText || "").trim();
      if (!clean) {
        setWebResults([]);
        setImgResults([]);
        setShopResults([]);
        setVidResults([]);
        return;
      }
      setLoading(true);

      try {
        const [wikiSearch, ddgSearch, wikiImages, dummyShop, itunesShop, pipedVids] = await Promise.all([
          // 1. Web Search Results
          fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(clean)}&srlimit=12&utf8=&format=json&origin=*`).then((r) => r.json()).catch(() => null),
          fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(clean)}&format=json&no_html=1&skip_disambig=1`).then((r) => r.json()).catch(() => null),
          // 2. Google Images Grid (Wikimedia Commons High-Res Images API)
          fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=filetype:bitmap+${encodeURIComponent(clean)}&gsrlimit=24&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=500&format=json&origin=*`).then((r) => r.json()).catch(() => null),
          // 3. Google Shopping Products (DummyJSON + iTunes/App Store Products)
          fetch(`https://dummyjson.com/products/search?q=${encodeURIComponent(clean)}&limit=12`).then((r) => r.json()).catch(() => null),
          fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(clean)}&entity=software,ebook,movie&limit=16`).then((r) => r.json()).catch(() => null),
          // 4. Videos Tab
          fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(clean)}&filter=videos`).then((r) => r.json()).catch(() => null)
        ]);

        // Process Web Results
        const webList = [];
        if (isUrlLike(clean)) {
          const norm = /^https?:\/\//i.test(clean) ? clean : "https://" + clean;
          webList.push({ title: `🌐 Go to ${norm}`, url: norm, snippet: `Open ${norm} directly in full-screen unblocked view.` });
        }
        if (ddgSearch?.AbstractText && ddgSearch?.AbstractURL) {
          webList.push({ title: ddgSearch.Heading || clean, url: ddgSearch.AbstractURL, snippet: ddgSearch.AbstractText });
        }
        if (Array.isArray(ddgSearch?.RelatedTopics)) {
          ddgSearch.RelatedTopics.slice(0, 5).forEach((rt) => {
            if (rt.Text && rt.FirstURL) {
              webList.push({ title: rt.Text.split(" - ")[0] || rt.Text.slice(0, 60), url: rt.FirstURL, snippet: rt.Text });
            }
          });
        }
        (wikiSearch?.query?.search || []).forEach((w) => {
          webList.push({
            title: w.title,
            url: `https://en.wikipedia.org/wiki/${encodeURIComponent(w.title.replace(/ /g, "_"))}`,
            snippet: (w.snippet || "").replace(/<\/?[^>]+(>|$)/g, "")
          });
        });
        setWebResults(webList);

        // Process Images Results
        const imgs = [];
        const pages = wikiImages?.query?.pages || {};
        Object.values(pages).forEach((p) => {
          const info = p.imageinfo?.[0];
          if (info && (info.thumburl || info.url)) {
            imgs.push({
              title: (p.title || "").replace("File:", "").replace(/\.[^/.]+$/, ""),
              thumb: info.thumburl || info.url,
              full: info.url,
              source: "Wikimedia Commons HD"
            });
          }
        });
        (itunesShop?.results || []).forEach((it) => {
          if (it.artworkUrl100) {
            imgs.push({
              title: it.trackName || it.collectionName || clean,
              thumb: it.artworkUrl100.replace("100x100bb", "500x500bb"),
              full: it.artworkUrl100.replace("100x100bb", "1000x1000bb"),
              source: it.artistName || "Media Gallery"
            });
          }
        });
        setImgResults(imgs);

        // Process Shopping Results
        const shops = [];
        (dummyShop?.products || []).forEach((prod) => {
          shops.push({
            id: "dj_" + prod.id,
            title: prod.title,
            price: `$${prod.price}`,
            store: prod.brand || "Verified Store",
            rating: `★ ${prod.rating || "4.8"}`,
            img: prod.thumbnail,
            desc: prod.description,
            url: `https://en.wikipedia.org/wiki/${encodeURIComponent(prod.title)}`
          });
        });
        (itunesShop?.results || []).forEach((item, idx) => {
          shops.push({
            id: "it_" + (item.trackId || idx),
            title: item.trackName || item.collectionName,
            price: item.formattedPrice || (item.price ? `$${item.price}` : "Free / Digital"),
            store: item.artistName || "Digital Store",
            rating: `★ ${item.averageUserRating ? item.averageUserRating.toFixed(1) : "4.9"}`,
            img: (item.artworkUrl100 || "").replace("100x100bb", "400x400bb"),
            desc: item.description || item.longDescription || `${item.kind || "Digital"} item available now.`,
            url: item.trackViewUrl || `https://en.wikipedia.org/wiki/${encodeURIComponent(item.trackName || clean)}`
          });
        });
        // If user searched a specific item not in DummyJSON, synthesize general shopping matches from search results
        if (shops.length === 0) {
          webList.slice(0, 8).forEach((w, idx) => {
            shops.push({
              id: "gen_" + idx,
              title: w.title,
              price: `$${(19.99 + idx * 10).toFixed(2)}`,
              store: "Global Marketplace",
              rating: "★ 4.8",
              img: imgs[idx]?.thumb || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&q=80",
              desc: w.snippet,
              url: w.url
            });
          });
        }
        setShopResults(shops);

        // Process Video Results
        const vids = (pipedVids?.items || []).map((v) => {
          const vidId = v.url ? v.url.split("v=")[1] : "";
          return {
            id: vidId,
            title: v.title,
            author: v.uploaderName || "YouTube",
            views: v.views ? `${Number(v.views).toLocaleString()} views` : "HD Video",
            thumb: v.thumbnail || `https://i.ytimg.com/vi/${vidId}/hqdefault.jpg`
          };
        }).filter((v) => v.id);
        setVidResults(vids);
      } catch {}
      setLoading(false);
    }, []);

    const handleInput = (val) => {
      setQuery(val);
      clearTimeout(debounceRef.current);
      if (!val.trim()) {
        setWebResults([]);
        setImgResults([]);
        setShopResults([]);
        setVidResults([]);
        return;
      }
      debounceRef.current = setTimeout(() => {
        executeGoogleSearch(val);
      }, 180);
    };

    const handleSubmit = (e) => {
      e.preventDefault();
      const val = query.trim();
      if (!val) return;
      if (isUrlLike(val)) {
        openUrlAutomatically(val);
      } else {
        setActiveUrl("");
        executeGoogleSearch(val);
      }
    };

    const isSearching = query.trim().length > 0 || !!activeUrl;

    return h("section", { className: "view" },
      h("div", { className: "gbrowser-root" },
        !isSearching ? (
          // IDLE STATE: Centered Frosted Glass Search Bar
          h("div", { className: "gbrowser-idle" },
            h("h1", { style: { fontSize: "clamp(32px, 5vw, 54px)", fontWeight: 700, letterSpacing: "-0.03em", marginBottom: 24, textAlign: "center", textShadow: "0 0 36px rgba(255,255,255,0.2)" } }, "What do you want to search?"),
            h("form", { className: "glass-panel", onSubmit: handleSubmit, autoComplete: "off" },
              h(SearchIcon),
              h("input", {
                className: "glass-input",
                type: "text",
                spellCheck: false,
                placeholder: "Search Google (All, Images, Shopping) or type any URL...",
                value: query,
                onChange: (e) => handleInput(e.target.value)
              }),
              h("button", { type: "submit", className: "btn", style: { borderRadius: 999, height: 46, padding: "0 24px" } }, "Search")
            )
          )
        ) : (
          // ACTIVE FULL-PAGE BROWSER STATE
          h(Fragment, null,
            // Sticky Frosted Glass Top Bar + Google Tabs
            h("div", { className: "gbrowser-top" },
              h("div", { className: "gbrowser-bar-row" },
                activeUrl ? h("button", {
                  className: "btn ghost sm",
                  style: { borderRadius: 999 },
                  onClick: () => setActiveUrl("")
                }, "← Back to Search") : null,
                h("form", { className: "glass-panel compact", onSubmit: handleSubmit, autoComplete: "off" },
                  h(SearchIcon),
                  h("input", {
                    className: "glass-input",
                    type: "text",
                    spellCheck: false,
                    placeholder: "Search anything or enter a URL...",
                    value: query,
                    onChange: (e) => handleInput(e.target.value)

                  query ? h("button", {
                    type: "button",

                    onClick: () => { setQuery(""); setActiveUrl(""); setWebResults([]); }

                  h("button", { type: "submit", className: "btn sm", style: { borderRadius: 999, padding: "0 18px" } }, loading ? "..." : isUrlLike(query) ? "Go" : "Search")
                )
              ),
              !activeUrl ? h("div", { className: "gbrowser-tabs" },
                [
                  { id: "all", label: "🔍 All" },
                  { id: "images", label: `🖼️ Images (${imgResults.length})` },
                  { id: "shopping", label: `🛍️ Shopping (${shopResults.length})` },
                  { id: "videos", label: `🎬 Videos (${vidResults.length})` }
                ].map((t) =>
                  h("button", {
                    key: t.id,
                    className: "gbrowser-tab" + (tab === t.id ? " on" : ""),
                    onClick: () => setTab(t.id)
                  }, t.label)

              ) : null
            ),

            // FULL-SCREEN VIEWPORT BODY
            h("div", { className: "gbrowser-body" },
              activeUrl ? (

                frameHtml
                  ? h("iframe", {
                      key: activeUrl + "_proxied",

                    })
                  : h("iframe", {
                      key: activeUrl + "_direct",
                      src: activeUrl,
                      style: { width: "100%", height: "100%", border: 0, background: "#fff" },

  function YouTubeView() {
    const [searchQ, setSearchQ] = useState("");
    const [videos, setVideos] = useState([]);
    const [activeVideo, setActiveVideo] = useState(null);
    const [loading, setLoading] = useState(false);

    const searchYouTube = useCallback(async (queryText) => {
      const q = (queryText || "").trim();
      if (!q) return;
      setLoading(true);

      const ytMatch = q.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
      if (ytMatch) {
        const vidId = ytMatch[1];
        const directItem = { id: vidId, title: "Direct YouTube Video", author: "YouTube", views: "Direct Link", thumb: `https://i.ytimg.com/vi/${vidId}/hqdefault.jpg` };
        setVideos([directItem, ...videos]);
        setActiveVideo(directItem);
        setLoading(false);
        return;
      }

      const apis = [
        `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(q)}&filter=videos`,
        `https://api.piped.private.coffee/search?q=${encodeURIComponent(q)}&filter=videos`,
        `https://inv.tux.pizza/api/v1/search?q=${encodeURIComponent(q)}&type=video`
      ];

      let found = [];
      for (const apiUrl of apis) {
        try {
          const res = await fetch(apiUrl);
          if (!res.ok) continue;
          const data = await res.json();
          const items = data.items || data;
          if (Array.isArray(items) && items.length > 0) {
            found = items.map((item) => {
              const id = item.videoId || (item.url ? item.url.split("v=")[1] : "");
              return {
                id,
                title: item.title || "Video",
                author: item.uploaderName || item.author || "Creator",
                views: item.views ? `${Number(item.views).toLocaleString()} views` : "HD Video",
                thumb: item.thumbnail || (item.videoThumbnails && item.videoThumbnails[0]?.url) || `https://i.ytimg.com/vi/${id}/hqdefault.jpg`
              };
            }).filter((v) => v.id);
            if (found.length > 0) break;
          }
        } catch {}
      }

      if (found.length === 0) {
        try {
          const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent("https://www.youtube.com/results?search_query=" + q)}`);
          const j = await r.json();
          const html = j.contents || "";
          const regex = /"videoId":"([A-Za-z0-9_-]{11})".*?"title":\{"runs":\[\{"text":"([^"]+)"/g;
          const seen = new Set();
          let m;
          while ((m = regex.exec(html)) !== null && found.length < 24) {
            if (!seen.has(m[1])) {
              seen.add(m[1]);
              found.push({
                id: m[1],
                title: m[2].replace(/\\u0026/g, "&"),
                author: "YouTube Creator",
                views: "Unblocked Stream",
                thumb: `https://i.ytimg.com/vi/${m[1]}/hqdefault.jpg`
              });
            }
          }
        } catch {}
      }

      setVideos(found.length > 0 ? found : FALLBACK_YT_VIDEOS);
      setLoading(false);
    }, []);

    useEffect(() => {
      searchYouTube("minecraft roblox gaming");
    }, [searchYouTube]);

    return h("section", { className: "view" },
      h("div", { className: "page" },
        h("div", { className: "row", style: { flexWrap: "wrap", marginBottom: 16 } },

            h("div", { style: { background: "#ff0000", color: "#fff", padding: "6px 12px", borderRadius: 10, fontWeight: 800, display: "flex", alignItems: "center", gap: 6 } }, "▶ YouTube"),
            h("span", { className: "badge-pill live" }, "DIRECT UNBLOCKED STREAM")

        ),

        activeVideo ? h("div", { className: "pop-panel", style: { marginBottom: 24, background: "#060608", padding: 16 } },
          h("div", { className: "row", style: { marginBottom: 12 } },
            h("strong", { style: { fontSize: 16 } }, activeVideo.title),
            h("button", { className: "btn ghost sm", onClick: () => setActiveVideo(null) }, "✕ Close Player")
          ),
          h("div", { style: { width: "100%", height: "64vh", background: "#000", borderRadius: 12, overflow: "hidden" } },
            h("iframe", {
              key: activeVideo.id,
              src: `https://www.youtube-nocookie.com/embed/${activeVideo.id}?autoplay=1&rel=0`,
              style: { width: "100%", height: "100%", border: 0 },
              allow: FRAME_ALLOW,
              allowFullScreen: true,
              referrerPolicy: "no-referrer"
            })
          )
        ) : null,

        h("form", {

  function fmtMs(ms) {
    if (!ms) return "0:30";
    const totalSec = Math.floor(ms / 1000);
    return `${Math.floor(totalSec / 60)}:${totalSec % 60 < 10 ? "0" : ""}${totalSec % 60}`;
  }

  function MusicView() {
    const [searchQ, setSearchQ] = useState("");
    const [activePlaylist, setActivePlaylist] = useState("hits");
    const [tracks, setTracks] = useState([]);
    const [currentTrack, setCurrentTrack] = useState(null);
    const [isPlaying, setIsPlaying] = useState(false);
    const audioRef = useRef(null);

    const fetchSongs = useCallback(async (term) => {
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&entity=song&limit=35`);
        const data = await res.json();
        setTracks(data.results || []);
      } catch {}
    }, []);

    useEffect(() => {
      const p = PLAYLIST_PRESETS.find((x) => x.id === activePlaylist) || PLAYLIST_PRESETS[0];
      fetchSongs(p.query);
    }, [activePlaylist, fetchSongs]);

    const playTrack = (t) => {
      if (!audioRef.current) return;
      if (currentTrack && currentTrack.trackId === t.trackId) {
        if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); }
        else { audioRef.current.play(); setIsPlaying(true); }
        return;
      }
      setCurrentTrack(t);
      audioRef.current.src = t.previewUrl;
      audioRef.current.play().then(() => setIsPlaying(true)).catch(() => setIsPlaying(false));
    };

    const activePresetObj = PLAYLIST_PRESETS.find((p) => p.id === activePlaylist) || PLAYLIST_PRESETS[0];

    return h("section", { className: "view" },
      h("div", { className: "sp-app" },

          h("div", { className: "sp-sidebar" },

  // ============================================================================
  // WHATSAPP-STYLE LIVE CHAT WITH IMAGE & FILE ATTACHMENTS
  // ============================================================================
  function ChatView({ currentUser, accountsMap }) {
    const [messages, setMessages] = useState([]);
    const [inputMessage, setInputMessage] = useState("");
    const [attachment, setAttachment] = useState(null);
    const messagesEndRef = useRef(null);

    useEffect(() => {
      const fetchChat = async () => {
        const base = getDbUrl();
        if (!base) {
          try {
            const local = JSON.parse(localStorage.getItem("ug_global_chat_v1") || "[]");
            setMessages(local);
          } catch {}
          return;
        }
        try {
          const res = await fetch(`${base}/global_chat.json`, { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            if (data) {
              const list = Object.keys(data).map((k) => ({ id: k, ...data[k] }));
              list.sort((a, b) => a.timestamp - b.timestamp);
              setMessages(list);
            } else {
              setMessages([]);
            }
          }
        } catch {}
      };

      fetchChat();
      const interval = setInterval(fetchChat, 3500);
      return () => clearInterval(interval);
    }, []);

    useEffect(() => {
      messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
    }, [messages]);

    const handleFileChange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) {
        alert("File size must be under 2MB for cloud sync.");
        return;
      }
      const reader = new FileReader();
      reader.onload = (uploadEvent) => {
        setAttachment({
          name: file.name,
          type: file.type,
          data: uploadEvent.target.result
        });
      };
      reader.readAsDataURL(file);
    };

    const sendMessage = async (e) => {
      e.preventDefault();
      const text = inputMessage.trim();
      if (!text && !attachment) return;
      if (!currentUser) return;

      const acc = accountsMap[currentUser.username.toLowerCase()] || currentUser;
      const isUserOwner = isOwnerIdentity(currentUser.username, acc);

      const newMsg = {
        sender: currentUser.username,
        role: isUserOwner ? "owner" : "user",
        text,
        attachment: attachment || null,
        timestamp: Date.now()
      };

      const base = getDbUrl();
      if (base) {
        try {
          await fetch(`${base}/global_chat.json`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newMsg)
          });
        } catch {}
      } else {
        try {
          const prev = JSON.parse(localStorage.getItem("ug_global_chat_v1") || "[]");
          const next = [...prev, { id: "msg_" + Date.now(), ...newMsg }];
          localStorage.setItem("ug_global_chat_v1", JSON.stringify(next));
          setMessages(next);
        } catch {}
      }

      setInputMessage("");
      setAttachment(null);

      setTimeout(async () => {
        if (base) {
          const res = await fetch(`${base}/global_chat.json`, { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            if (data) {
              const list = Object.keys(data).map((k) => ({ id: k, ...data[k] }));
              list.sort((a, b) => a.timestamp - b.timestamp);
              setMessages(list);
            }
          }
        }
      }, 250);
    };

    return h("section", { className: "view", style: { height: "100%", display: "flex", flexDirection: "column" } },
      h("div", { style: { padding: "20px 24px 0", flexShrink: 0 } },
        h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
          h("h2", { style: { margin: 0, fontSize: 26 } }, "Live School Chat"),
          h("span", { className: "badge-pill live" }, "WHATSAPP LIVE SYNC")
        )
      ),
      h("div", { style: { flex: 1, display: "flex", flexDirection: "column", padding: "16px 24px 24px", overflow: "hidden" } },
        h("div", { className: "pop-panel", style: { flex: 1, display: "flex", flexDirection: "column", padding: 0, overflow: "hidden", background: "#060608", height: "100%" } },
          h("div", { style: { flex: 1, padding: 20, overflowY: "auto", display: "flex", flexDirection: "column", gap: 14 } },
            messages.length === 0
              ? h("div", { style: { margin: "auto", color: "var(--muted)", textAlign: "center" } }, "No messages yet. Send an image or message to start chatting! 🚀")
              : messages.map((m) => {
                  const isMe = (m.sender || "").toLowerCase() === (currentUser?.username || "").toLowerCase();
                  const isOwnerMsg = m.role === "owner";
                  return h("div", { key: m.id || m.timestamp, style: { display: "flex", flexDirection: "column", alignItems: isMe ? "flex-end" : "flex-start" } },
                    h("div", { style: { display: "flex", alignItems: "center", gap: 6, marginBottom: 4 } },
                      h("span", { style: { fontSize: 12, fontWeight: 600, color: "#aaa" } }, m.sender),
                      isOwnerMsg
                        ? h("span", { className: "badge-pill owner", style: { fontSize: 10, padding: "1px 6px" } }, "OWNER")
                        : h("span", { className: "badge-pill", style: { fontSize: 10, padding: "1px 6px" } }, "LICENSED"),
                      h("span", { style: { fontSize: 10, color: "#666" } }, new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))
                    ),
                    h("div", { style: { background: isMe ? "#16a34a" : "#18181b", color: "#fff", padding: "12px 16px", borderRadius: isMe ? "16px 16px 2px 16px" : "16px 16px 16px 2px", fontSize: 14, maxWidth: "75%", wordBreak: "break-word", border: "1px solid var(--border)", display: "flex", flexDirection: "column", gap: 8 } },
                      m.text ? h("span", null, m.text) : null,
                      m.attachment ? (
                        m.attachment.type && m.attachment.type.startsWith("image/") ?
                          h("img", { src: m.attachment.data, alt: m.attachment.name, style: { maxWidth: "100%", maxHeight: 280, borderRadius: 10, objectFit: "cover" } }) :
                          h("a", { href: m.attachment.data, download: m.attachment.name, style: { color: "#bbf7d0", textDecoration: "underline", fontSize: "13px" } }, `📎 ${m.attachment.name}`)
                      ) : null
                    )
                  );
                }),
            h("div", { ref: messagesEndRef })
          ),
          attachment ? h("div", { style: { padding: "8px 16px", background: "#111116", borderTop: "1px solid var(--border)", display: "flex", alignItems: "center", justifyContent: "space-between" } },
            h("span", { style: { fontSize: 13, color: "#86efac" } }, `Attached: ${attachment.name}`),
            h("button", { type: "button", className: "btn danger sm", onClick: () => setAttachment(null) }, "Remove")
          ) : null,
          h("form", { onSubmit: sendMessage, style: { display: "flex", gap: 10, padding: 16, background: "#0e0e11", borderTop: "1px solid var(--border)", alignItems: "center" } },
            h("label", { className: "btn ghost", style: { display: "inline-flex", alignItems: "center", justifyContent: "center", padding: "0 14px", height: 44, cursor: "pointer", margin: 0 } },
              "📎 Attach / Image",
              h("input", { type: "file", accept: "image/*,*/*", onChange: handleFileChange, style: { display: "none" } })
            ),
            h("input", {
              className: "field",
              type: "text",
              placeholder: "Type a message or attach an image...",
              spellCheck: false,
              value: inputMessage,
              onChange: (e) => setInputMessage(e.target.value),
              style: { flex: 1, margin: 0 }
            }),
            h("button", { type: "submit", className: "btn", style: { padding: "0 28px", height: 44, background: "#22c55e", color: "#000" } }, "Send")
          )
        )
      )
    );
  }

  function AccountCreatorView({ accountsMap, sessionsMap, onRefresh, toast }) {
    const [createModal, setCreateModal] = useState(false);
    const [dbModal, setDbModal] = useState(false);
    const [newUsername, setNewUsername] = useState("");
    const [newPassword, setNewPassword] = useState("");
    const [newEmail, setNewEmail] = useState("");
    const [newHours, setNewHours] = useState(12);
    const [newInfinite, setNewInfinite] = useState(false);
    const [revealedPw, setRevealedPw] = useState({});
    const [now, setNow] = useState(Date.now());
    const [dbUrlInput, setDbUrlInput] = useState(getDbUrl());

    useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
    useEffect(() => {
      const poll = setInterval(() => { onRefresh(); }, 6000);
      return () => clearInterval(poll);
    }, [onRefresh]);

    const toggleReveal = (uname) => setRevealedPw((p) => ({ ...p, [uname]: !p[uname] }));

    const handleCreateAccount = async (e) => {
      e.preventDefault();
      const u = newUsername.trim();
      const p = newPassword.trim();
      if (!u || !p) { toast("Please enter both a Username and Password"); return; }
      const hrs = Math.max(1, Math.min(24, Number(newHours) || 1));
      const acc = {
        username: u, email: newEmail.trim() || "", password: p,
        licenseKey: genLicenseKey(), infinite: !!newInfinite, durationHours: hrs,
        expiresAt: newInfinite ? null : Date.now() + hrs * 3600 * 1000,
        role: isOwnerIdentity(u, { email: newEmail.trim() }) ? "owner" : "user", createdAt: Date.now()
      };
      await dbSaveAccount(acc);
      await onRefresh();
      setNewUsername(""); setNewPassword(""); setNewEmail(""); setNewHours(12); setNewInfinite(false); setCreateModal(false);
      toast(`Account "${u}" created!`);
    };

    const handleAdjustDuration = async (acc, hoursVal, infVal) => {
      const hrs = Math.max(1, Math.min(24, Number(hoursVal) || 1));
      const updated = { ...acc, durationHours: hrs, infinite: !!infVal, expiresAt: infVal ? null : Date.now() + hrs * 3600 * 1000 };
      await dbSaveAccount(updated);
      await onRefresh();
    };

    const handleRevokeAccount = async (username) => { await dbDeleteAccount(username); await onRefresh(); toast(`Revoked "${username}"`); };

      await dbUpsertSession({ ...sess, kicked: true, kickedAt: Date.now() });

                h("button", { className: "btn danger sm", onClick: () => handleRevokeAccount(acc.username) }, "Revoke")
              ),
              h("div", { style: { display: "flex", flexDirection: "column", gap: 8, marginBottom: 16, background: "#070709", padding: "12px 14px", borderRadius: 12, border: "1px solid var(--border)" } },
                h("div", { className: "row" }, h("span", { style: { fontSize: 12.5, color: "var(--muted)" } }, "Password"),
                  h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
                    h("span", { style: { fontSize: 13.5, fontWeight: 600, fontFamily: "monospace", letterSpacing: isShown ? "normal" : "0.18em" } }, isShown ? acc.password : "\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022"),
                    h("button", { className: "eye-btn", onClick: () => toggleReveal(key) }, isShown ? h(EyeOffIcon) : h(EyeIcon))
                  )
                ),
                h("div", { className: "row" }, h("span", { style: { fontSize: 12.5, color: "var(--muted)" } }, "License"), h("span", { style: { fontSize: 12, fontFamily: "monospace", color: "#bcbcc4" } }, acc.licenseKey)),
                h("div", { className: "row" }, h("span", { style: { fontSize: 12.5, color: "var(--muted)" } }, "Remaining"), h("span", { style: { fontSize: 13, fontWeight: 600, color: "#86efac" } }, remText))
              ),
              h("div", { style: { borderTop: "1px solid var(--border)", paddingTop: 12 } },
                h("div", { className: "row", style: { marginBottom: 8 } }, h("span", { style: { fontSize: 12, color: "var(--muted)" } }, "Duration (1-24h)"), h("span", { style: { fontSize: 12.5, fontWeight: 600 } }, acc.infinite ? "Infinite \u221E" : `${sliderVal}h`)),
                h("input", { type: "range", min: 1, max: 24, step: 1, className: "slider", disabled: !!acc.infinite, value: sliderVal, onChange: (e) => handleAdjustDuration(acc, Number(e.target.value), false) }),
                h("div", { className: "row", style: { marginTop: 10 } },
                  h("label", { style: { display: "flex", alignItems: "center", gap: 8, fontSize: 13, cursor: "pointer" } },
                    h("input", { type: "checkbox", checked: !!acc.infinite, onChange: (e) => handleAdjustDuration(acc, sliderVal, e.target.checked), style: { width: 16, height: 16, accentColor: "#e4e4e4" } }),
                    "Infinite License"
                  )
                )
              )
            );
          })
        )
      ),
      createModal ? h(Modal, { onClose: () => setCreateModal(false) },
        h("h3", null, "Create account"),
        h("form", { onSubmit: handleCreateAccount, autoComplete: "off" },
          h("div", { style: { marginBottom: 12 } }, h("label", { className: "auth-label" }, "Username"), h("input", { className: "field", placeholder: "Username...", value: newUsername, onChange: (e) => setNewUsername(e.target.value) })),
          h("div", { style: { marginBottom: 12 } }, h("label", { className: "auth-label" }, "Password"), h("input", { className: "field", type: "text", placeholder: "Password...", value: newPassword, onChange: (e) => setNewPassword(e.target.value) })),
          h("div", { style: { marginBottom: 16 } }, h("label", { className: "auth-label" }, "Email (Optional)"), h("input", { className: "field", type: "email", placeholder: "email@example.com", value: newEmail, onChange: (e) => setNewEmail(e.target.value) })),
          h("div", { className: "setting", style: { padding: 14, marginBottom: 18 } },
            h("div", { className: "row", style: { marginBottom: 8 } }, h("span", { style: { fontSize: 13, fontWeight: 600 } }, "License Time"), h("span", { style: { fontSize: 13, fontWeight: 600 } }, newInfinite ? "Infinite" : `${newHours}h`)),
            h("input", { type: "range", min: 1, max: 24, step: 1, className: "slider", disabled: newInfinite, value: newHours, onChange: (e) => setNewHours(Number(e.target.value)) }),
            h("label", { style: { display: "flex", alignItems: "center", gap: 8, fontSize: 13.5, cursor: "pointer", marginTop: 10 } },
              h("input", { type: "checkbox", checked: newInfinite, onChange: (e) => setNewInfinite(e.target.checked), style: { width: 16, height: 16 } }),
              "Infinite (Never expires)"
            )
          ),
          h("div", { className: "actions" }, h("button", { type: "submit", className: "btn" }, "Create"), h("button", { type: "button", className: "btn ghost", onClick: () => setCreateModal(false) }, "Cancel"))
        )
      ) : null,
      dbModal ? h(Modal, { onClose: () => setDbModal(false) },
        h("h3", null, "Real-Time Cloud Database"),
        h("p", null, "Paste your free Firebase Realtime Database URL below."),
        h("input", { className: "field", placeholder: "https://your-app-default-rtdb.firebaseio.com", value: dbUrlInput, onChange: (e) => setDbUrlInput(e.target.value), style: { marginBottom: 16 } }),
        h("div", { className: "actions" },
          h("button", { className: "btn", onClick: async () => { setCustomDbUrl(dbUrlInput); await onRefresh(); setDbModal(false); toast("Connected!"); } }, "Save"),
          h("button", { className: "btn ghost", onClick: () => setDbModal(false) }, "Close")
        )
      ) : null
    );
  }

  function Toggle({ checked, onChange }) {
    return h("label", { className: "toggle" }, h("input", { type: "checkbox", checked, onChange: (e) => onChange(e.target.checked) }), h("span"));
  }

  function SettingsView({ settings, onSave, onCloakSite }) {
    const [s, setS] = useState(settings);
    const set = (k, v) => setS((p) => ({ ...p, [k]: v }));
    return h("section", { className: "view", id: "settings" },
      h("div", { className: "page", style: { maxWidth: 720 } },
        h("h2", null, "Settings"),
        h("p", { className: "sub" }, "Customize your in-app installer & cloak settings."),
        h("div", { className: "setting" },
          h("div", { className: "row" },
            h("div", null, h("h3", null, "Open games in external about:blank tab"), h("p", { style: { margin: 0 } }, "When off (default), games install and play directly inside this HTML portal.")),
            h(Toggle, { checked: s.cloak, onChange: (v) => set("cloak", v) })
          )
        ),
        h("div", { className: "setting" },
          h("h3", null, "Cloaked tab title"),
          h("input", { className: "field", placeholder: "about:blank", spellCheck: false, value: s.title, onChange: (e) => set("title", e.target.value) })
        ),
        h("div", { style: { display: "flex", gap: 10, flexWrap: "wrap" } },
          h("button", { className: "btn", onClick: () => onSave(s) }, "Save"),
          h("button", { className: "btn ghost", onClick: onCloakSite }, "Open whole site in about:blank")
        )
      )
    );
  }

  function LoginBox({ onLoginSuccess }) {
    const [identifier, setIdentifier] = useState("");
    const [password, setPassword] = useState("");
    const [showPw, setShowPw] = useState(false);
    const [err, setErr] = useState("");
    const [loading, setLoading] = useState(false);

    const handleSubmit = async (e) => {
      e.preventDefault();
      setErr("");
      const idClean = identifier.trim();
      const pwClean = password.trim();
      if (!idClean || !pwClean) { setErr("Please enter Username and Password."); return; }
      setLoading(true);
      const { accounts } = await dbFetchAll();
      const lower = idClean.toLowerCase();
      let matched = accounts[lower] || Object.values(accounts).find((a) => a.email && a.email.trim().toLowerCase() === lower);

      if (!matched && isOwnerIdentity(lower, null) && pwClean === AUTH_CONFIG.masterOwnerPassword) {
        matched = {
          username: idClean.includes("@") ? (AUTH_CONFIG.ownerUsernames[0] || "kevin") : idClean,
          email: idClean.includes("@") ? idClean : (AUTH_CONFIG.ownerEmails[0] || ""),
          password: pwClean, licenseKey: "UG-OWNR-ROOT-0001", infinite: true, expiresAt: null, role: "owner", createdAt: Date.now()
        };
        await dbSaveAccount(matched);
      }
      if (!matched || matched.password !== pwClean) { setLoading(false); setErr("Invalid username or password."); return; }
      const isOwn = isOwnerIdentity(matched.username, matched);
      if (!isOwn && !matched.infinite && matched.expiresAt && Date.now() >= matched.expiresAt) {
        setLoading(false); setErr("License has expired."); return;
      }
      const sess = { username: matched.username, email: matched.email || "", role: isOwn ? "owner" : "user", loginAt: Date.now(), lastPing: Date.now(), currentView: "home", kicked: false };
      await dbUpsertSession(sess);
      saveCurrentSession(sess);
      setLoading(false);
      onLoginSuccess(sess);
    };

    return h("div", { className: "auth-overlay" },
      h("div", { className: "auth-box" },
        h("h1", { className: "auth-logo" }, "unblockedgames"),
        h("p", { className: "auth-sub" }, "Sign in with your licensed account."),
        err ? h("div", { className: "auth-err" }, err) : null,
        h("form", { onSubmit: handleSubmit, autoComplete: "off" },
          h("div", { style: { marginBottom: 14 } }, h("label", { className: "auth-label" }, "Username or Email"), h("input", { className: "field", placeholder: "Username...", value: identifier, onChange: (e) => setIdentifier(e.target.value) })),
          h("div", { style: { marginBottom: 20 } }, h("label", { className: "auth-label" }, "Password"),
            h("div", { style: { position: "relative", display: "flex", alignItems: "center" } },
              h("input", { className: "field", type: showPw ? "text" : "password", placeholder: "Password...", value: password, onChange: (e) => setPassword(e.target.value), style: { paddingRight: 44 } }),
              h("button", { type: "button", className: "eye-btn", onClick: () => setShowPw((v) => !v), style: { position: "absolute", right: 7, border: 0, background: "transparent" } }, showPw ? h(EyeOffIcon) : h(EyeIcon))
            )
          ),
          h("button", { type: "submit", className: "btn", disabled: loading, style: { width: "100%" } }, loading ? "Verifying..." : "Sign In")
        )
      )
    );
  }

  // --- Main App ---
  function App() {
    const [view, setView] = useState("home");
    const [open, setOpen] = useState(false);
    const [settings, setSettings] = useState(loadSettings);
    const [query, setQuery] = useState("");
    const [playing, setPlaying] = useState(null);
    const [installedMap, setInstalledMap] = useState(getInstalledGames);
    const [toastMsg, setToastMsg] = useState("");
    const [toastOn, setToastOn] = useState(false);
    const toastT = useRef(undefined);
    const mainRef = useRef(null);

    const [currentUser, setCurrentUser] = useState(getSavedSession);
    const [accountsMap, setAccountsMap] = useState({});
    const [sessionsMap, setSessionsMap] = useState({});

    const toast = useCallback((msg) => {
      setToastMsg(msg); setToastOn(true);
      clearTimeout(toastT.current);
      toastT.current = setTimeout(() => setToastOn(false), 2400);
    }, []);

    const navigate = useCallback((v) => { setView(v); mainRef.current?.scrollTo(0, 0); }, []);

    const isOwner = useMemo(() => {
      if (!currentUser) return false;
      const acc = accountsMap[currentUser.username?.toLowerCase()];
      return isOwnerIdentity(currentUser.username, acc || currentUser);
    }, [currentUser, accountsMap]);

    const refreshDatabaseAndSession = useCallback(async () => {
      const { accounts, sessions } = await dbFetchAll();
      setAccountsMap(accounts);
      setSessionsMap(sessions);

      const saved = getSavedSession();
      if (!saved || !saved.username) { setCurrentUser(null); return; }

      const key = saved.username.trim().toLowerCase();
      const acc = accounts[key];
      if (!acc) { saveCurrentSession(null); setCurrentUser(null); setPlaying(null); toast("Account revoked."); return; }

      const own = isOwnerIdentity(acc.username, acc);
      if (!own && !acc.infinite && acc.expiresAt && Date.now() >= acc.expiresAt) {
        await dbDeleteSession(acc.username); saveCurrentSession(null); setCurrentUser(null); setPlaying(null); toast("License expired."); return;
      }

      const remoteSess = sessions[key];
      if (remoteSess && remoteSess.kicked && (!saved.loginAt || (remoteSess.kickedAt || 0) >= saved.loginAt)) {
        await dbDeleteSession(acc.username); saveCurrentSession(null); setCurrentUser(null); setPlaying(null); toast("Kicked out by owner."); return;
      }

      await dbUpsertSession({
        username: acc.username,
        email: acc.email || "",
        role: own ? "owner" : "user",
        loginAt: saved.loginAt || Date.now(),
        lastPing: Date.now(),
        currentView: view,
        kicked: false
      });
      setSessionsMap(getLocalStore(LS_SESSIONS));
    }, [view, toast]);

    useEffect(() => {
      refreshDatabaseAndSession();
      const interval = setInterval(refreshDatabaseAndSession, 5000);
      return () => clearInterval(interval);
    }, [refreshDatabaseAndSession]);

    const launchGame = useCallback((g) => {
      saveInstalledGame(g.slug);
      setInstalledMap(getInstalledGames());
      if (!settings.cloak) {
        setPlaying(g);
        return;
      }
      if (!openCloaked(frameSource(g), settings)) toast("Popup blocked");
    }, [settings, toast]);

    const hideFloatingPills = view === "browser" || view === "movies" || view === "music";

    return h(Fragment, null,
      h(Stars),
      !currentUser ? h(LoginBox, { onLoginSuccess: (sess) => { setCurrentUser(sess); refreshDatabaseAndSession(); toast(`Welcome, ${sess.username}!`); } }) : null,
      h(Sidebar, { view, open, onToggle: () => setOpen((o) => !o), onNavigate: navigate, isOwner }),
      !hideFloatingPills ? h("div", { id: "topRight", style: { display: "flex", gap: 8, alignItems: "center" } },
        currentUser ? h("button", { className: "pill", onClick: () => navigate(isOwner ? "creator" : "account") }, isOwner ? `\uD83D\uDC51 ${currentUser.username}` : `\uD83D\uDFE2 ${currentUser.username}`) : null
      ) : null,
      h("main", { ref: mainRef },
        view === "home" ? h(Home, { onNavigate: navigate, onSearch: (q) => { setQuery(q); navigate("games"); } }) : null,
        view === "youtube" ? h(YouTubeView, { toast }) : null,
        view === "tiktok" ? h(TikTokView, { toast }) : null,
        view === "browser" ? h(BrowserView, { toast }) : null,
        view === "games" ? h(GamesView, { query, onQuery: setQuery, onPlay: launchGame, installedMap }) : null,
        view === "chat" ? h(ChatView, { currentUser, accountsMap }) : null,
        view === "movies" ? h(MoviesView, { toast }) : null,
        view === "music" ? h(MusicView, { toast }) : null,
        view === "account" ? h(AccountProfileView, { currentUser, accountsMap, onLogout: async () => { await dbDeleteSession(currentUser.username); saveCurrentSession(null); setCurrentUser(null); setView("home"); }, onOpenCreator: () => navigate("creator"), isOwner }) : null,
        view === "creator" && isOwner ? h(AccountCreatorView, { accountsMap, sessionsMap, onRefresh: refreshDatabaseAndSession, toast }) : null,
        view === "settings" ? h(SettingsView, { settings, onSave: (s) => { setSettings(s); saveSettings(s); toast("Saved"); }, onCloakSite: () => cloakSite(settings) }) : null
      ),
      playing ? h(Player, { game: playing, onClose: () => setPlaying(null) }) : null,
      h("div", { id: "toast", className: toastOn ? "show" : "" }, toastMsg)
    );
  }

  createRoot(document.getElementById("root")).render(h(StrictMode, null, h(App)));
})();
    </script>
  </body>
</html>
