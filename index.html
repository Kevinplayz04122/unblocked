  function buildRobloxDirectEngine() {
    return `<!doctype html><html><head><meta charset="utf-8"><style>

  function Stars() {
    const ref = useRef(null);
    useEffect(() => {
      const cv = ref.current, ctx = cv.getContext("2d");
      let W = 0, H = 0, raf = 0, stars = [];
      const dpr = window.devicePixelRatio || 1;
      const resize = () => {
        W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
        stars = Array.from({ length: 120 }, () => ({
          x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.4 + 0.5) * dpr, s: (Math.random() * 0.12 + 0.02) * dpr, p: Math.random() * Math.PI * 2
        }));
      };
      const frame = () => {
        ctx.clearRect(0, 0, W, H); ctx.fillStyle = "#fff";
        for (const s of stars) {
          s.y += s.s; if (s.y > H + 5) s.y = -5;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
        }
        raf = requestAnimationFrame(frame);
      };
      addEventListener("resize", resize); resize(); frame();
      return () => { removeEventListener("resize", resize); cancelAnimationFrame(raf); };
    }, []);
    return h("canvas", { id: "stars", ref });
  }

        view === "movies" ? h(MoviesView) : null,
        view === "music" ? h(MusicView) : null,
        view === "account" ? h(AccountProfileView, { currentUser, onLogout: () => { saveCurrentSession(null); setCurrentUser(null); } }) : null,
        view === "creator" ? h(AccountCreatorView, { toast }) : null,
        view === "settings" ? h(SettingsView) : null
      ),
      playing ? h(Player, { game: playing, onClose: () => setPlaying(null) }) : null,
      h("div", { id: "toast", className: toastOn ? "show" : "" }, toastMsg)
    );
  }

  createRoot(document.getElementById("root")).render(h(StrictMode, null, h(App)));
})();
    </script>
  </body>
</html>
