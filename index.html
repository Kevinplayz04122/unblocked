  // --- Stars Background ---
  function Stars() {
    const ref = useRef(null);
    useEffect(() => {
      const cv = ref.current, ctx = cv.getContext("2d");
      let W = 0, H = 0, raf = 0, stars = [];
      const dpr = window.devicePixelRatio || 1;
      const resize = () => {
        W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
        cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
        const n = Math.floor((innerWidth * innerHeight) / 9000);
        stars = Array.from({ length: n }, () => ({
          x: Math.random() * W, y: Math.random() * H,
          r: (Math.random() * 1.4 + 0.5) * dpr, s: (Math.random() * 0.12 + 0.02) * dpr,
          p: Math.random() * Math.PI * 2, f: Math.random() * 0.02 + 0.005,
        }));
      };
      const frame = () => {
        ctx.clearRect(0, 0, W, H); ctx.fillStyle = "#fff";
        for (const s of stars) {
          s.y += s.s; s.p += s.f;
          if (s.y > H + 5) { s.y = -5; s.x = Math.random() * W; }
          ctx.globalAlpha = 0.35 + 0.55 * Math.abs(Math.sin(s.p));
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
        }
        raf = requestAnimationFrame(frame);
      };
      addEventListener("resize", resize); resize(); frame();
      return () => { removeEventListener("resize", resize); cancelAnimationFrame(raf); };
    }, []);
    return h("canvas", { id: "stars", ref });
  }

  const WORDS = ["Roblox", "Geometry Dash", "YouTube", "TikTok", "Play anything"];
  function useTypingPlaceholder(paused) {
    const [text, setText] = useState("Browse");
    const pausedRef = useRef(paused);
    pausedRef.current = paused;
    useEffect(() => {
      let w = 0, i = 0, del = false, t;
      const tick = () => {
        if (pausedRef.current) { i = 0; del = false; setText("Browse"); t = setTimeout(tick, 600); return; }
        const word = WORDS[w];
        setText(word.slice(0, i) + "|");
        let delay = del ? 45 : 95;
        if (!del && i === word.length) { del = true; delay = 1800; }
        else if (del && i === 0) { del = false; w = (w + 1) % WORDS.length; delay = 400; }
        else i += del ? -1 : 1;
        t = setTimeout(tick, delay);
      };
      tick();
      return () => clearTimeout(t);
    }, []);
    return text;
  }

      if (!audioRef.current) return;
      if (currentTrack && currentTrack.trackId === t.trackId) {
        if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); }
        else { audioRef.current.play(); setIsPlaying(true); }
        return;
      }
      setCurrentTrack(t);
      audioRef.current.src = t.previewUrl;
      audioRef.current.play().then(() => setIsPlaying(true)).catch(() => setIsPlaying(false));
    };

    const activePresetObj = PLAYLIST_PRESETS.find((p) => p.id === activePlaylist) || PLAYLIST_PRESETS[0];

    return h("section", { className: "view" },
      h("div", { className: "sp-app" },
        h("audio", { ref: audioRef }),
        h("div", { className: "sp-body" },
          h("div", { className: "sp-sidebar" },
            h("div", { className: "sp-nav-box" },
              h("div", { style: { fontWeight: 800, fontSize: 18, color: "#1ed760" } }, "● Spotify"),
              h("form", { onSubmit: (e) => { e.preventDefault(); if (searchQ.trim()) fetchSongs(searchQ.trim()); }, style: { display: "flex", alignItems: "center", background: "#242424", borderRadius: 999, padding: "0 12px", height: 36 } },
                h("input", { type: "text", placeholder: "Search songs...", value: searchQ, onChange: (e) => setSearchQ(e.target.value), style: { flex: 1, background: "transparent", border: 0, outline: 0, color: "#fff", fontSize: 13 } })
              )
            ),
            h("div", { className: "sp-lib-box" },
              PLAYLIST_PRESETS.map((p) =>
                h("button", { key: p.id, className: "sp-pl-item" + (activePlaylist === p.id ? " active" : ""), onClick: () => setActivePlaylist(p.id) },
                  h("div", { className: "sp-pl-cover", style: { background: p.color } }, p.icon),
                  h("div", { style: { fontWeight: 600, fontSize: 13.5, color: "#fff" } }, p.name)
                )
              )
            )
          ),
          h("div", { className: "sp-main" },
            h("div", { className: "sp-header", style: { background: `linear-gradient(180deg, ${activePresetObj.color} 0%, #121212 100%)` } },
              h("div", { className: "sp-header-art", style: { background: activePresetObj.color } }, activePresetObj.icon),
              h("div", null,
                h("h1", { style: { fontSize: 42, fontWeight: 800 } }, activePresetObj.name),
                h("p", { style: { color: "#ccc", fontSize: 13 } }, `${tracks.length} unblocked songs`)
              )
            ),
            h("div", { className: "sp-table" },
              tracks.map((t, i) => {
                const isCurr = currentTrack && currentTrack.trackId === t.trackId;
                return h("div", { key: t.trackId || i, className: "sp-trow" + (isCurr ? " active" : ""), onClick: () => playTrack(t) },
                  h("span", null, isCurr && isPlaying ? "▶" : i + 1),
                  h("div", { style: { display: "flex", alignItems: "center", gap: 10, minWidth: 0 } },
                    h("img", { src: t.artworkUrl100, style: { width: 38, height: 38, borderRadius: 4 } }),
                    h("div", { style: { minWidth: 0 } },
                      h("div", { style: { fontWeight: 600, color: isCurr ? "#1ed760" : "#fff", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, t.trackName),
                      h("div", { style: { fontSize: 12, color: "#b3b3b3" } }, t.artistName)
                    )
                  ),
                  h("span", { style: { whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", fontSize: 12.5 } }, t.collectionName),
                  h("span", { style: { textAlign: "right", fontSize: 12.5 } }, fmtMs(t.trackTimeMillis))
                );
              })
            )
          )
        ),
        h("div", { className: "sp-player-bar" },
          currentTrack ? h("div", { style: { display: "flex", alignItems: "center", gap: 12 } },
            h("img", { src: currentTrack.artworkUrl100, style: { width: 48, height: 48, borderRadius: 6 } }),
            h("div", null,
              h("div", { style: { fontWeight: 600, fontSize: 14 } }, currentTrack.trackName),
              h("div", { style: { fontSize: 12, color: "#b3b3b3" } }, currentTrack.artistName)
            )
          ) : h("div", { style: { color: "#888", fontSize: 13 } }, "Select a song to play"),
          h("button", { className: "btn sm", style: { background: "#1ed760", color: "#000", borderRadius: 999 }, onClick: () => currentTrack && playTrack(currentTrack) }, isPlaying ? "⏸ Pause" : "▶ Play")
        )
      )
    );
  }

  // --- Netflix Movies & Anime View ---
  function MoviesView() {
    const [activeMedia, setActiveMedia] = useState(null);
    const [serverIdx, setServerIdx] = useState(0);
    const heroItem = INITIAL_MEDIA[0];

    const getEmbedUrl = (item, srv) => {
      const tmdbId = item.tmdb || item.id;
      if (item.type === "tv") {
        if (srv === 0) return `https://vidsrc.cc/v2/embed/tv/${tmdbId}/1/1`;
        if (srv === 1) return `https://vidlink.pro/tv/${tmdbId}/1/1`;
        return `https://vidsrc.pm/embed/tv?tmdb=${tmdbId}&season=1&episode=1`;
      }
      if (srv === 0) return `https://vidsrc.cc/v2/embed/movie/${tmdbId}`;
      if (srv === 1) return `https://vidlink.pro/movie/${tmdbId}`;
      return `https://vidsrc.pm/embed/movie?tmdb=${tmdbId}`;
    };

    return h("section", { className: "view" },
      h("div", { className: "nf-wrap" },
        h("div", { className: "nf-topnav" },
          h("div", { className: "nf-logo", onClick: () => setActiveMedia(null) }, "NETFLIX")
        ),
        activeMedia ? h("div", { style: { padding: "16px 42px" } },
          h("div", { className: "pop-panel", style: { background: "#08080a" } },
            h("div", { className: "row", style: { marginBottom: 12, flexWrap: "wrap" } },
              h("button", { className: "btn sm", style: { background: "#e50914", color: "#fff" }, onClick: () => setActiveMedia(null) }, "← Back"),
              h("div", { style: { display: "flex", gap: 6 } },
                ["Server 1 (VidSrc.cc)", "Server 2 (VidLink)", "Server 3 (VidSrc.pm)"].map((l, idx) =>
                  h("button", { key: idx, className: "chip" + (serverIdx === idx ? " on" : ""), onClick: () => setServerIdx(idx) }, l)
                )
              )
            ),
            h("div", { style: { width: "100%", height: "66vh", background: "#000", borderRadius: 12, overflow: "hidden" } },
              h("iframe", { key: `${activeMedia.id}_${serverIdx}`, src: getEmbedUrl(activeMedia, serverIdx), style: { width: "100%", height: "100%", border: 0 }, allow: FRAME_ALLOW, allowFullScreen: true })
            )
          )
        ) : h(Fragment, null,
          h("div", { className: "nf-hero" },
            h("img", { src: heroItem.backdrop, className: "nf-hero-bg", referrerPolicy: "no-referrer" }),
            h("div", { className: "nf-hero-content" },
              h("h1", { className: "nf-hero-title" }, heroItem.title),
              h("p", { className: "nf-hero-desc" }, heroItem.desc),
              h("button", { className: "nf-btn-play", onClick: () => setActiveMedia(heroItem) }, "▶ Play Now")
            )
          ),
          h("div", { className: "nf-row-section" },
            h("h3", { className: "nf-row-title" }, "🔥 Trending Movies & Anime"),
            h("div", { className: "nf-carousel" },
              INITIAL_MEDIA.map((item) =>
                h("div", { key: item.id, className: "nf-card", onClick: () => setActiveMedia(item) },
                  h("img", { src: item.thumb, className: "nf-card-poster", referrerPolicy: "no-referrer" })
                )
              )
            )
          )
        )
      )
    );
  }

  // --- Embedded Brave Browser ---
  function BrowserView() {
    const [omnibar, setOmnibar] = useState("https://search.brave.com/search?q=unblocked+games");
    const [frameSrcDoc, setFrameSrcDoc] = useState("");
    const [loading, setLoading] = useState(false);

    const loadUrl = useCallback(async (raw) => {
      let target = (raw || "").trim();
      if (!target) return;
      if (!/^(https?:\/\/|www\.)/i.test(target)) target = `https://search.brave.com/search?q=${encodeURIComponent(target)}`;
      else if (!/^https?:\/\//i.test(target)) target = "https://" + target;
      setOmnibar(target);
      setLoading(true);
      try {
        const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(target)}`);
        const j = await r.json();
        setFrameSrcDoc(`<base href="${target}">` + (j.contents || ""));
      } catch {}
      setLoading(false);
    }, []);

    useEffect(() => { loadUrl(omnibar); }, []);

    return h("section", { className: "view" },
      h("div", { className: "br-shell" },
        h("form", { className: "br-toolbar", onSubmit: (e) => { e.preventDefault(); loadUrl(omnibar); } },
          h("span", { style: { color: "#fb542b", fontWeight: 800 } }, "🦁 Brave"),
          h("div", { className: "br-omnibar" },
            h("input", { type: "text", value: omnibar, onChange: (e) => setOmnibar(e.target.value), style: { flex: 1, background: "transparent", border: 0, outline: 0, color: "#fff", fontSize: 13.5 } })
          ),
          h("button", { type: "submit", className: "btn sm", style: { background: "#fb542b", color: "#fff" } }, loading ? "..." : "Go")
        ),
        h("div", { style: { flex: 1, background: "#101217" } },
          h("iframe", { srcDoc: frameSrcDoc, style: { width: "100%", height: "100%", border: 0, background: "#fff" }, sandbox: "allow-scripts allow-same-origin allow-forms" })
        )
      )
    );
  }

  // --- Live Chat View ---
  function ChatView({ currentUser, accountsMap }) {
    const [messages, setMessages] = useState([]);
    const [inputMessage, setInputMessage] = useState("");
    const messagesEndRef = useRef(null);

    useEffect(() => {
      const fetchChat = async () => {
        const base = getDbUrl();
        if (!base) return;
        try {
          const res = await fetch(`${base}/global_chat.json`, { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            if (data) {
              const list = Object.keys(data).map((k) => ({ id: k, ...data[k] }));
              list.sort((a, b) => a.timestamp - b.timestamp);
              setMessages(list);
            }
          }
        } catch {}
      };
      fetchChat();
      const t = setInterval(fetchChat, 4000);
      return () => clearInterval(t);
    }, []);

    const sendMessage = async (e) => {
      e.preventDefault();
      const text = inputMessage.trim();
      if (!text || !currentUser) return;
      const acc = accountsMap[currentUser.username.toLowerCase()] || currentUser;
      const newMsg = { sender: currentUser.username, role: isOwnerIdentity(currentUser.username, acc) ? "owner" : "user", text, timestamp: Date.now() };
      const base = getDbUrl();
      if (base) {
        try { await fetch(`${base}/global_chat.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(newMsg) }); } catch {}
      }
      setInputMessage("");
    };

    return h("section", { className: "view", style: { height: "100%", display: "flex", flexDirection: "column", padding: 24 } },
      h("h2", { style: { marginBottom: 12 } }, "Live School Chat"),
      h("div", { className: "pop-panel", style: { flex: 1, display: "flex", flexDirection: "column", padding: 0, overflow: "hidden" } },
        h("div", { style: { flex: 1, padding: 20, overflowY: "auto", display: "flex", flexDirection: "column", gap: 12 } },
          messages.map((m) =>
            h("div", { key: m.id || m.timestamp },
              h("strong", { style: { fontSize: 12, color: "#aaa" } }, `${m.sender}: `),
              h("span", { style: { fontSize: 14 } }, m.text)
            )
          ),
          h("div", { ref: messagesEndRef })
        ),
        h("form", { onSubmit: sendMessage, style: { display: "flex", gap: 10, padding: 14, borderTop: "1px solid var(--border)" } },
          h("input", { className: "field", value: inputMessage, onChange: (e) => setInputMessage(e.target.value), placeholder: "Type a message..." }),
          h("button", { type: "submit", className: "btn" }, "Send")
        )
      )
    );
  }

  // --- Player Component ---
  function Player({ game, initialServerIdx = 0, onClose }) {
    const [nonce, setNonce] = useState(0);
    const [srvIdx, setSrvIdx] = useState(initialServerIdx);
    const frameRef = useRef(null);
    const source = frameSource(game, srvIdx);

    return h("div", { id: "player" },
      h("div", { className: "bar" },
        h("button", { className: "pill", onClick: onClose }, "\u2190 Back to Hub"),
        h("div", { className: "ttl" }, h("span", null, game.name)),
        game.servers && game.servers.length > 1
          ? game.servers.map((srv, idx) =>
              h("button", { key: idx, className: "chip" + (srvIdx === idx ? " on" : ""), onClick: () => setSrvIdx(idx) }, srv.name)
            )
          : null,
        h("button", { className: "pill", onClick: () => setNonce((n) => n + 1) }, "Reload"),
        h("button", { className: "pill", onClick: () => frameRef.current?.requestFullscreen?.() }, "Fullscreen")
      ),
      h("iframe", { key: `${game.slug}_${srvIdx}_${nonce}`, ref: frameRef, title: game.name, src: source.src, srcDoc: source.srcdoc, allow: FRAME_ALLOW, allowFullScreen: true })
    );
  }

  function AccountProfileView({ currentUser, accountsMap, onLogout, onOpenCreator, isOwner }) {
    const acc = currentUser ? accountsMap[currentUser.username.toLowerCase()] || currentUser : null;
    return h("section", { className: "view" },
      h("div", { className: "page", style: { maxWidth: 680 } },
        h("h2", null, "Account"),
        acc ? h("div", { className: "pop-panel" },
          h("div", { className: "row" },
            h("h3", null, acc.username),
            h("button", { className: "btn danger sm", onClick: onLogout }, "Log Out")
          ),
          isOwner ? h("button", { className: "btn sm", style: { marginTop: 14 }, onClick: onOpenCreator }, "Open Account Creator Hub") : null
        ) : null
      )
    );
  }

  function AccountCreatorView({ accountsMap, onRefresh, toast }) {
    const [u, setU] = useState("");
    const [p, setP] = useState("");
    const create = async (e) => {
      e.preventDefault();
      if (!u.trim() || !p.trim()) return;
      await dbSaveAccount({ username: u.trim(), password: p.trim(), licenseKey: genLicenseKey(), infinite: true, role: "user", createdAt: Date.now() });
      setU(""); setP(""); await onRefresh(); toast("Account created!");
    };
    return h("section", { className: "view" },
      h("div", { className: "page", style: { maxWidth: 900 } },
        h("h2", null, "Account Creator Hub"),
        h("form", { onSubmit: create, className: "pop-panel", style: { display: "flex", gap: 10, marginBottom: 20 } },
          h("input", { className: "field", placeholder: "Username...", value: u, onChange: (e) => setU(e.target.value) }),
          h("input", { className: "field", placeholder: "Password...", value: p, onChange: (e) => setP(e.target.value) }),
          h("button", { type: "submit", className: "btn" }, "Create")
        ),
        Object.values(accountsMap || {}).map((acc) =>
          h("div", { key: acc.username, className: "setting", style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
            h("span", null, `${acc.username} (${acc.role})`),
            h("button", { className: "btn danger sm", onClick: async () => { await dbDeleteAccount(acc.username); onRefresh(); } }, "Revoke")
          )
        )
      )
    );
  }

  function SettingsView({ settings, onSave, onCloakSite }) {
    return h("section", { className: "view" },
      h("div", { className: "page", style: { maxWidth: 680 } },
        h("h2", null, "Settings"),
        h("button", { className: "btn", onClick: onCloakSite }, "Open whole site in about:blank")
      )
    );
  }

  function LoginBox({ onLoginSuccess }) {
    const [identifier, setIdentifier] = useState("");
    const [password, setPassword] = useState("");
    const [err, setErr] = useState("");

    const handleSubmit = async (e) => {
      e.preventDefault();
      const idClean = identifier.trim();
      const pwClean = password.trim();
      const { accounts } = await dbFetchAll();
      const lower = idClean.toLowerCase();
      let matched = accounts[lower] || Object.values(accounts).find((a) => a.email && a.email.toLowerCase() === lower);

      if (!matched && isOwnerIdentity(lower, null) && pwClean === AUTH_CONFIG.masterOwnerPassword) {
        matched = { username: idClean, password: pwClean, licenseKey: "UG-OWNR-ROOT", infinite: true, role: "owner", createdAt: Date.now() };
        await dbSaveAccount(matched);
      }
      if (!matched || matched.password !== pwClean) { setErr("Invalid login."); return; }
      const sess = { username: matched.username, role: isOwnerIdentity(matched.username, matched) ? "owner" : "user", loginAt: Date.now(), lastPing: Date.now() };
      await dbUpsertSession(sess);
      saveCurrentSession(sess);
      onLoginSuccess(sess);
    };

    return h("div", { className: "auth-overlay" },
      h("div", { className: "auth-box" },
        h("h1", { className: "auth-logo" }, "unblockedgames"),
        h("p", { className: "auth-sub" }, "Sign in with your licensed account."),
        err ? h("div", { className: "auth-err" }, err) : null,
        h("form", { onSubmit: handleSubmit },
          h("input", { className: "field", style: { marginBottom: 12 }, placeholder: "Username or Email...", value: identifier, onChange: (e) => setIdentifier(e.target.value) }),
          h("input", { className: "field", style: { marginBottom: 18 }, type: "password", placeholder: "Password...", value: password, onChange: (e) => setPassword(e.target.value) }),
          h("button", { type: "submit", className: "btn", style: { width: "100%" } }, "Sign In")
        )
      )
    );
  }

  // --- Main App ---
  function App() {
    const [view, setView] = useState("home");
    const [open, setOpen] = useState(false);
    const [settings, setSettings] = useState(loadSettings);
    const [query, setQuery] = useState("");
    const [installingGame, setInstallingGame] = useState(null);
    const [playing, setPlaying] = useState(null);
    const [playingServerIdx, setPlayingServerIdx] = useState(0);
    const [installedMap, setInstalledMap] = useState(getInstalledGames);
    const [toastMsg, setToastMsg] = useState("");
    const [toastOn, setToastOn] = useState(false);
    const toastT = useRef(undefined);
    const mainRef = useRef(null);

    const [currentUser, setCurrentUser] = useState(getSavedSession);
    const [accountsMap, setAccountsMap] = useState({});
    const [sessionsMap, setSessionsMap] = useState({});

    const toast = useCallback((msg) => {
      setToastMsg(msg); setToastOn(true);
      clearTimeout(toastT.current);
      toastT.current = setTimeout(() => setToastOn(false), 2400);
    }, []);

    const navigate = useCallback((v) => { setView(v); mainRef.current?.scrollTo(0, 0); }, []);

    const isOwner = useMemo(() => {
      if (!currentUser) return false;
      const acc = accountsMap[currentUser.username?.toLowerCase()];
      return isOwnerIdentity(currentUser.username, acc || currentUser);
    }, [currentUser, accountsMap]);

    const refreshDatabaseAndSession = useCallback(async () => {
      const { accounts, sessions } = await dbFetchAll();
      setAccountsMap(accounts);
      setSessionsMap(sessions);
    }, []);

    useEffect(() => {
      refreshDatabaseAndSession();
      const interval = setInterval(refreshDatabaseAndSession, 8000);
      return () => clearInterval(interval);
    }, [refreshDatabaseAndSession]);

    const launchGame = useCallback(async (g, bestIdx = 0) => {
      saveInstalledGame(g.slug, bestIdx);
      setInstalledMap(getInstalledGames());
      setInstallingGame(null);
      setPlayingServerIdx(bestIdx);
      setPlaying(g);
    }, []);

    const handleCardClick = useCallback((g) => {
      if (installedMap[g.slug]) launchGame(g, 0);
      else setInstallingGame(g);
    }, [installedMap, launchGame]);

    return h(Fragment, null,
      h(Stars),
      !currentUser ? h(LoginBox, { onLoginSuccess: (sess) => { setCurrentUser(sess); refreshDatabaseAndSession(); toast(`Welcome, ${sess.username}!`); } }) : null,
      h(Sidebar, { view, open, onToggle: () => setOpen((o) => !o), onNavigate: navigate, isOwner }),
      h("main", { ref: mainRef },
        view === "home" ? h(Home, { onNavigate: navigate, onSearch: (q) => { setQuery(q); navigate("games"); } }) : null,
        view === "youtube" ? h(YouTubeView, { toast }) : null,
        view === "tiktok" ? h(TikTokView, { toast }) : null,
        view === "browser" ? h(BrowserView, { toast }) : null,
        view === "games" ? h(GamesView, { query, onQuery: setQuery, onPlay: handleCardClick, installedMap }) : null,
        view === "chat" ? h(ChatView, { currentUser, accountsMap }) : null,
        view === "movies" ? h(MoviesView, { toast }) : null,
        view === "music" ? h(MusicView, { toast }) : null,
        view === "account" ? h(AccountProfileView, { currentUser, accountsMap, onLogout: () => { saveCurrentSession(null); setCurrentUser(null); }, onOpenCreator: () => navigate("creator"), isOwner }) : null,
        view === "creator" && isOwner ? h(AccountCreatorView, { accountsMap, sessionsMap, onRefresh: refreshDatabaseAndSession, toast }) : null,
        view === "settings" ? h(SettingsView, { settings, onSave: (s) => { setSettings(s); saveSettings(s); }, onCloakSite: () => cloakSite(settings) }) : null
      ),
      installingGame ? h(GameInstallerModal, { game: installingGame, onComplete: launchGame, onCancel: () => setInstallingGame(null) }) : null,
      playing ? h(Player, { game: playing, initialServerIdx: playingServerIdx, onClose: () => setPlaying(null) }) : null,
      h("div", { id: "toast", className: toastOn ? "show" : "" }, toastMsg)
    );
  }

  createRoot(document.getElementById("root")).render(h(StrictMode, null, h(App)));
})();
    </script>
  </body>
