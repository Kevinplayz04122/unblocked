<!doctype html>
<html lang="en">
  <head>

    <title>unblockedgames</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
/* Tailwind v4 Preflight Base */
*, ::after, ::before, ::backdrop, ::file-selector-button {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border: 0 solid;
}
html, :host {
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  tab-size: 4;
  font-family: "Outfit", system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body {
  line-height: inherit;
}
h1, h2, h3, h4, h5, h6 {
  font-size: inherit;
  font-weight: inherit;
}
a {
  color: inherit;
  -webkit-text-decoration: inherit;
  text-decoration: inherit;
}
b, strong {
  font-weight: bolder;
}
code, kbd, samp, pre {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  font-size: 1em;
}
img, svg, video, canvas, audio, iframe, embed, object {
  display: block;
  vertical-align: middle;
}
img, video {
  max-width: 100%;
  height: auto;
}
button, input, select, optgroup, textarea, ::file-selector-button {
  font: inherit;
  font-feature-settings: inherit;
  font-variation-settings: inherit;
  letter-spacing: inherit;
  color: inherit;
  border-radius: 0;
  background-color: transparent;
  opacity: 1;
}
:root {
  --bg: #020203;
  --panel: #0b0b0d;
  --panel2: #111114;
  --border: rgba(255, 255, 255, 0.09);
  --text: #e6e6e6;
  --muted: #8a8a90;
}
- { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: "Outfit", system-ui, sans-serif; overflow: hidden; }
button { cursor: pointer; font-family: inherit; }

#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* Sidebar */
#sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 64px; background: #08080a; border-right: 1px solid var(--border); z-index: 30; display: flex; flex-direction: column; align-items: stretch; transition: width 0.25s ease; }
#sidebar.open { width: 190px; }
.side-group { display: flex; flex-direction: column; gap: 6px; padding: 2px; }
.side-btn { display: flex; align-items: center; gap: 14px; height: 52px; margin: 0; padding: 0 0 0 14px; border-radius: 999px; background: transparent; border: 1px solid transparent; color: #cfcfd4; cursor: pointer; transition: 0.2s; white-space: nowrap; overflow: hidden; font: 500 14px "Outfit"; }
.side-btn svg { flex: 0 0 auto; width: 20px; height: 20px; }
.side-btn span { opacity: 0; transition: opacity 0.2s; }
#sidebar.open .side-btn span { opacity: 1; }
.side-btn:hover { background: rgba(255, 255, 255, 0.07); }
.side-btn.active { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.22); box-shadow: 0 0 22px rgba(255, 255, 255, 0.1); }
#sidebar .spacer { flex: 1; }
#expandBtn svg { transition: transform 0.25s; }
#sidebar.open #expandBtn svg { transform: rotate(180deg); }

/* Main */
main { position: fixed; left: 64px; right: 0; top: 0; bottom: 0; z-index: 10; overflow-y: auto; overflow-x: hidden; transition: left 0.25s ease; }
#sidebar.open ~ main { left: 190px; }
.view { min-height: 100%; animation: fade 0.35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Pills */
.pill { background: rgba(20, 20, 23, 0.85); border: 1px solid var(--border); border-radius: 12px; padding: 8px 16px; font-size: 13px; color: #d6d6da; cursor: pointer; transition: 0.2s; backdrop-filter: blur(6px); }
.pill:hover { background: rgba(40, 40, 46, 0.95); border-color: rgba(255, 255, 255, 0.25); }
#topRight { position: fixed; top: 16px; right: 16px; z-index: 20; }
#footerLinks { position: fixed; bottom: 16px; right: 16px; z-index: 20; display: flex; gap: 10px; }

/* Home */
#home { display: flex; align-items: center; justify-content: center; flex-direction: column; height: 100%; padding-bottom: 40px; position: relative; }
.logo-wrap { position: relative; margin-bottom: 30px; text-align: center; }
.logo-wrap::before { content: ""; position: absolute; left: 50%; top: 50%; width: 120%; height: 150%; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.14), transparent 65%); filter: blur(24px); z-index: -1; }
.logo { font-size: clamp(48px, 9vw, 128px); font-weight: 600; letter-spacing: -0.04em; line-height: 1; color: #e4e4e4; margin: 0; text-shadow: 0 0 40px rgba(255, 255, 255, 0.22); }
.search-wrap { position: relative; width: min(800px, 88vw); }
.search-wrap::after { content: ""; position: absolute; inset: auto -4% -26px -4%; height: 60px; background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.07), transparent 70%); filter: blur(14px); z-index: -1; }
.search { display: flex; align-items: center; gap: 14px; height: 82px; padding: 0 34px; background: rgba(14, 14, 16, 0.92); border: 1px solid var(--border); border-radius: 14px; transition: 0.25s; position: relative; overflow: hidden; }
.search::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent); }
.search:focus-within { border-color: rgba(255, 255, 255, 0.28); box-shadow: 0 0 40px rgba(255, 255, 255, 0.07); }
.search svg { width: 22px; height: 22px; color: #b9b9be; flex: 0 0 auto; }
.search input { flex: 1; background: transparent; border: 0; outline: 0; color: #f0f0f0; font: 400 20px "Outfit"; min-width: 0; }
.search input::placeholder { color: #8e8e94; }
.quick { display: flex; gap: 28px; margin-top: 34px; }
.quick button { display: flex; flex-direction: column; align-items: center; gap: 10px; background: none; border: 0; color: #d8d8dc; font: 500 14px "Outfit"; cursor: pointer; }
.quick .circ { width: 60px; height: 60px; border-radius: 50%; background: #131316; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; transition: 0.25s; }
.quick .circ svg { width: 22px; height: 22px; }
.quick button:hover .circ { background: #1d1d22; border-color: rgba(255, 255, 255, 0.3); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(255, 255, 255, 0.07); }
.ad { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: 0.14em; color: #8b8b90; font-weight: 600; display: flex; gap: 10px; align-items: center; }

/* Page layout */
.page { padding: 36px 40px 90px; max-width: 1400px; margin: 0 auto; }
.page h2 { font-size: 34px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.02em; }
.page p.sub { color: var(--muted); margin: 0 0 24px; }
.page code { background: rgba(255, 255, 255, 0.08); padding: 1px 6px; border-radius: 6px; font-size: 0.9em; }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .search { height: 52px; padding: 0 20px; flex: 1; min-width: 240px; border-radius: 12px; }
.toolbar .search input { font-size: 16px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.chip { background: rgba(20, 20, 23, 0.85); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font: 500 13px "Outfit"; color: #c9c9ce; cursor: pointer; transition: 0.2s; }
.chip:hover { border-color: rgba(255, 255, 255, 0.28); }
.chip.on { background: #e4e4e4; color: #0a0a0a; border-color: #e4e4e4; }
.count { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.card { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; cursor: pointer; transition: 0.25s; text-align: left; padding: 0; color: inherit; font-family: inherit; }
.card:hover { transform: translateY(-4px); border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 24px rgba(255, 255, 255, 0.05); }
.card .thumb { position: relative; height: 120px; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 700; color: rgba(255, 255, 255, 0.85); overflow: hidden; }
.card .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .badge { position: absolute; top: 8px; left: 8px; background: rgba(0, 0, 0, 0.7); border: 1px solid var(--border); border-radius: 999px; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; padding: 2px 8px; color: #ddd; z-index: 2; }
.card .info { padding: 11px 13px 13px; }
.card .name { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .tag { font-size: 12px; color: var(--muted); margin-top: 2px; }
.empty { padding: 60px 0; text-align: center; color: var(--muted); }
.soon { height: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
.soon .circ { width: 84px; height: 84px; border-radius: 50%; background: #131316; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; box-shadow: 0 0 40px rgba(255, 255, 255, 0.06); }
.soon .circ svg { width: 34px; height: 34px; }
.soon h2 { font-size: 34px; margin: 0; font-weight: 600; }
.soon p { color: var(--muted); margin: 0; max-width: 420px; }

/* Settings */
.setting { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; }
.setting h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.setting p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.field { width: 100%; height: 44px; background: #0e0e11; border: 1px solid var(--border); border-radius: 10px; padding: 0 14px; color: #eee; font: 400 14px "Outfit"; outline: 0; }
.field:focus { border-color: rgba(255, 255, 255, 0.3); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.toggle { position: relative; width: 48px; height: 28px; flex: 0 0 auto; }
.toggle input { display: none; }
.toggle span { position: absolute; inset: 0; background: #26262b; border-radius: 999px; cursor: pointer; transition: 0.2s; }
.toggle span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #aaa; transition: 0.2s; }
.toggle input:checked + span { background: #e4e4e4; }
.toggle input:checked + span::after { transform: translateX(20px); background: #111; }
.btn { background: #e4e4e4; color: #0a0a0a; border: 0; border-radius: 10px; height: 44px; padding: 0 20px; font: 600 14px "Outfit"; cursor: pointer; transition: 0.2s; }
.btn:hover { background: #fff; box-shadow: 0 0 24px rgba(255, 255, 255, 0.25); }
.btn.ghost { background: rgba(255, 255, 255, 0.07); color: #ddd; border: 1px solid var(--border); }
.btn.ghost:hover { background: rgba(255, 255, 255, 0.13); box-shadow: none; }

/* Modal */
#modalBg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(6px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: #0c0c0f; border: 1px solid var(--border); border-radius: 18px; padding: 26px; width: min(480px, 100%); animation: fade 0.25s ease; }
.modal h3 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
.modal p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 16px; }
.modal .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 30px); background: #e4e4e4; color: #111; padding: 10px 18px; border-radius: 999px; font-weight: 500; font-size: 14px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 200; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* In-page player */
#player { position: fixed; inset: 0; z-index: 90; background: #000; display: flex; flex-direction: column; animation: fade 0.25s ease; }
#player .bar { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; background: #08080a; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
#player .bar .ttl { font-weight: 600; font-size: 15px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#player .bar .pill { padding: 6px 14px; }
#player iframe { flex: 1; width: 100%; border: 0; background: #000; }

@media (max-width: 640px) {
  .quick { gap: 16px; }
  .page { padding: 28px 18px 90px; }
  #footerLinks .pill { padding: 6px 12px; }
  .search { height: 64px; padding: 0 20px; }
  .ad { display: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}

/* Auth & License Creator Hub Extensions */
.auth-overlay { position: fixed; inset: 0; z-index: 85; background: rgba(2, 2, 3, 0.92); backdrop-filter: blur(18px); display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade 0.3s ease; }
.auth-box { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 34px 30px; width: min(420px, 100%); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(255, 255, 255, 0.04); position: relative; overflow: hidden; }
.auth-box::before { content: ""; position: absolute; top: 0; left: 20%; right: 20%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent); }
.auth-logo { font-size: 36px; font-weight: 600; letter-spacing: -0.04em; color: #e4e4e4; text-align: center; margin: 0 0 6px; text-shadow: 0 0 30px rgba(255, 255, 255, 0.22); }
.auth-sub { color: var(--muted); font-size: 13.5px; text-align: center; margin: 0 0 24px; }
.auth-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
.auth-err { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); color: #fca5a5; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; text-align: center; }

.btn.danger { background: rgba(220, 38, 38, 0.16); color: #fca5a5; border: 1px solid rgba(220, 38, 38, 0.4); }
.btn.danger:hover { background: #dc2626; color: #fff; border-color: #dc2626; box-shadow: 0 0 20px rgba(220, 38, 38, 0.4); }
.btn.warn { background: rgba(245, 158, 11, 0.14); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.38); }
.btn.warn:hover { background: #d97706; color: #fff; border-color: #d97706; box-shadow: 0 0 20px rgba(245, 158, 11, 0.35); }
.btn.sm { height: 34px; padding: 0 13px; font-size: 12.5px; border-radius: 8px; }

.pop-panel { background: var(--panel); border: 1px solid rgba(255, 255, 255, 0.13); border-radius: 16px; padding: 18px 20px; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.7), 0 0 22px rgba(255, 255, 255, 0.03); transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease; position: relative; }
.pop-panel:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.28); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.8), 0 0 28px rgba(255, 255, 255, 0.06); }

.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; display: inline-block; }
.status-dot.off { background: #71717a; box-shadow: none; }
.status-dot.exp { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

.slider { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; background: #232329; border-radius: 999px; outline: none; cursor: pointer; }
.slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #e4e4e4; cursor: pointer; box-shadow: 0 0 12px rgba(255, 255, 255, 0.5); border: 2px solid #0b0b0d; }
.slider:disabled { opacity: 0.35; cursor: not-allowed; }

.eye-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border); border-radius: 8px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; color: #cfcfd4; cursor: pointer; transition: 0.2s; }
.eye-btn:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
.eye-btn svg { width: 15px; height: 15px; }

.mono-box { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #070709; border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 13px; color: #e4e4e4; display: inline-flex; align-items: center; gap: 8px; }
.badge-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--border); }

.badge-pill.live { background: rgba(34, 197, 94, 0.14); color: #86efac; border-color: rgba(34, 197, 94, 0.35); }

  // --- Stars Component ---
  function Stars() {
    const ref = useRef(null);
    useEffect(() => {
      const cv = ref.current;
      const ctx = cv.getContext("2d");
      let W = 0, H = 0, raf = 0;
      let stars = [];
      const dpr = window.devicePixelRatio || 1;
      const resize = () => {
        W = cv.width = innerWidth * dpr;
        H = cv.height = innerHeight * dpr;
        cv.style.width = innerWidth + "px";
        cv.style.height = innerHeight + "px";
        const n = Math.floor((innerWidth * innerHeight) / 9000);
        stars = Array.from({ length: n }, () => ({
          x: Math.random() * W, y: Math.random() * H,
          r: (Math.random() * 1.4 + 0.5) * dpr, s: (Math.random() * 0.12 + 0.02) * dpr,
          p: Math.random() * Math.PI * 2, f: Math.random() * 0.02 + 0.005,
        }));
      };
      const frame = () => {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "#fff";
        for (const s of stars) {
          s.y += s.s; s.p += s.f;
          if (s.y > H + 5) { s.y = -5; s.x = Math.random() * W; }
          ctx.globalAlpha = 0.35 + 0.55 * Math.abs(Math.sin(s.p));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, 6.283);
          ctx.fill();
        }
        raf = requestAnimationFrame(frame);
      };
      addEventListener("resize", resize);
      resize();
      frame();
      return () => { removeEventListener("resize", resize); cancelAnimationFrame(raf); };
    }, []);
    return h("canvas", { id: "stars", ref });
  }

  const WORDS = ["Browse", "Search games", "Slope", "Subway Surfers", "Play anything"];
  function useTypingPlaceholder(paused) {
    const [text, setText] = useState("Browse");
    const pausedRef = useRef(paused);
    pausedRef.current = paused;
    useEffect(() => {
      let w = 0, i = 0, del = false, t;
      const tick = () => {
        if (pausedRef.current) { i = 0; del = false; setText("Browse"); t = setTimeout(tick, 600); return; }
        const word = WORDS[w];
        setText(word.slice(0, i) + "|");
        let delay = del ? 45 : 95;
        if (!del && i === word.length) { del = true; delay = 1800; }
        else if (del && i === 0) { del = false; w = (w + 1) % WORDS.length; delay = 400; }
        else i += del ? -1 : 1;
        t = setTimeout(tick, delay);
      };
      tick();
      return () => clearTimeout(t);
    }, []);
    return text;
  }

  // --- Real-Time Live Chat Component ---
  function ChatView({ currentUser, accountsMap }) {
    const [messages, setMessages] = useState([]);
    const [inputMessage, setInputMessage] = useState("");
    const messagesEndRef = useRef(null);

    // Fetch / listen to global chat room in Firebase
    useEffect(() => {
      const fetchChat = async () => {
        const base = getDbUrl();
        if (!base) {
          try {
            const local = JSON.parse(localStorage.getItem("ug_global_chat_v1") || "[]");
            setMessages(local);
          } catch {}
          return;
        }
        try {
          const res = await fetch(`${base}/global_chat.json`, { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            if (data) {
              const list = Object.keys(data).map((k) => ({ id: k, ...data[k] }));
              list.sort((a, b) => a.timestamp - b.timestamp);
              setMessages(list);
            } else {
              setMessages([]);
            }
          }
        } catch {}
      };

      fetchChat();
      const interval = setInterval(fetchChat, 4000);
      return () => clearInterval(interval);
    }, []);

    useEffect(() => {
      messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
    }, [messages]);

    const sendMessage = async (e) => {
      e.preventDefault();
      const text = inputMessage.trim();
      if (!text || !currentUser) return;

      const acc = accountsMap[currentUser.username.toLowerCase()] || currentUser;
      const isUserOwner = isOwnerIdentity(currentUser.username, acc);

      const newMsg = {
        sender: currentUser.username,
        role: isUserOwner ? "owner" : "user",
        text,
        timestamp: Date.now()
      };

      const base = getDbUrl();
      if (base) {
        try {
          await fetch(`${base}/global_chat.json`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newMsg)
          });
        } catch {}
      } else {
        try {
          const prev = JSON.parse(localStorage.getItem("ug_global_chat_v1") || "[]");
          const next = [...prev, { id: "msg_" + Date.now(), ...newMsg }];
          localStorage.setItem("ug_global_chat_v1", JSON.stringify(next));
          setMessages(next);
        } catch {}
      }

      setInputMessage("");
      // immediate poll
      setTimeout(async () => {
        if (base) {
          const res = await fetch(`${base}/global_chat.json`, { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            if (data) {
              const list = Object.keys(data).map((k) => ({ id: k, ...data[k] }));
              list.sort((a, b) => a.timestamp - b.timestamp);
              setMessages(list);
            }
          }
        }
      }, 300);
    };

    return h("section", { className: "view" },
      h("div", { className: "page", style: { maxWidth: 900, display: "flex", flexDirection: "column", height: "calc(100vh - 40px)" } },
        h("div", { style: { marginBottom: 16 } },
          h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
            h("h2", { style: { margin: 0 } }, "Live School Chat"),
            h("span", { className: "badge-pill live" }, "ONLINE SYNC")
          ),
          h("p", { className: "sub", style: { margin: "4px 0 0" } }, "Chat in real-time with everyone currently online on the portal.")
        ),
        // Chat Box Panel
        h("div", { className: "pop-panel", style: { flex: 1, display: "flex", flexDirection: "column", padding: 0, overflow: "hidden", background: "#08080a" } },
          // Messages list area
          h("div", { style: { flex: 1, padding: 20, overflowY: "auto", display: "flex", flexDirection: "column", gap: 14 } },
            messages.length === 0
              ? h("div", { style: { margin: "auto", color: "var(--muted)", textAlign: "center" } }, "No messages yet. Say hello to your schoolmates! 👋")
              : messages.map((m) => {
                  const isMe = m.sender.toLowerCase() === currentUser?.username?.toLowerCase();
                  const isOwnerMsg = m.role === "owner";
                  return h("div", { key: m.id || m.timestamp, style: { display: "flex", flexDirection: "column", alignItems: isMe ? "flex-end" : "flex-start" } },
                    h("div", { style: { display: "flex", alignItems: "center", gap: 6, marginBottom: 4 } },
                      h("span", { style: { fontSize: 12, fontWeight: 600, color: "#aaa" } }, m.sender),
                      isOwnerMsg
                        ? h("span", { className: "badge-pill owner", style: { fontSize: 10, padding: "1px 6px" } }, "OWNER")

                }),
            h("div", { ref: messagesEndRef })

          ) : null
        ) : null
      )
    );
  }

  // --- Account Creator Hub ---
  function AccountCreatorView({ accountsMap, sessionsMap, onRefresh, toast }) {
    const [createModal, setCreateModal] = useState(false);
    const [dbModal, setDbModal] = useState(false);
    const [newUsername, setNewUsername] = useState("");
    const [newPassword, setNewPassword] = useState("");
    const [newEmail, setNewEmail] = useState("");
    const [newHours, setNewHours] = useState(12);
    const [newInfinite, setNewInfinite] = useState(false);
    const [revealedPw, setRevealedPw] = useState({});
    const [now, setNow] = useState(Date.now());
    const [dbUrlInput, setDbUrlInput] = useState(getDbUrl());

    useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
    useEffect(() => {
      const poll = setInterval(() => { onRefresh(); }, 10000);
      return () => clearInterval(poll);
    }, [onRefresh]);

    const toggleReveal = (uname) => setRevealedPw((p) => ({ ...p, [uname]: !p[uname] }));

    const handleCreateAccount = async (e) => {
      e.preventDefault();
      const u = newUsername.trim();
      const p = newPassword.trim();
      if (!u || !p) { toast("Please enter both a Username and Password"); return; }
      const hrs = Math.max(1, Math.min(24, Number(newHours) || 1));
      const acc = {
        username: u, email: newEmail.trim() || "", password: p,
        licenseKey: genLicenseKey(), infinite: !!newInfinite, durationHours: hrs,
        expiresAt: newInfinite ? null : Date.now() + hrs * 3600 * 1000,
        role: isOwnerIdentity(u, { email: newEmail.trim() }) ? "owner" : "user", createdAt: Date.now()
      };
      await dbSaveAccount(acc);
      await onRefresh();
      setNewUsername(""); setNewPassword(""); setNewEmail(""); setNewHours(12); setNewInfinite(false); setCreateModal(false);
      toast(`Account "${u}" created!`);
    };

    const handleAdjustDuration = async (acc, hoursVal, infVal) => {
      const hrs = Math.max(1, Math.min(24, Number(hoursVal) || 1));
      const updated = { ...acc, durationHours: hrs, infinite: !!infVal, expiresAt: infVal ? null : Date.now() + hrs * 3600 * 1000 };
      await dbSaveAccount(updated);
      await onRefresh();
    };

    const handleRevokeAccount = async (username) => { await dbDeleteAccount(username); await onRefresh(); toast(`Revoked "${username}"`); };
    const handleKickUser = async (sess) => {
      await dbUpsertSession({ ...sess, kicked: true, kickedAt: Date.now() });
      await onRefresh();
      toast(`Kicked "${sess.username}"`);
    };

    const accountsList = Object.values(accountsMap || {}).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const activeSessions = Object.values(sessionsMap || {}).filter((s) => s && !s.kicked && accountsMap[s.username?.toLowerCase()] && now - (s.lastPing || 0) < 35000);

    return h("section", { className: "view", id: "creator" },
      h("div", { className: "page", style: { maxWidth: 1180 } },
        h("div", { className: "row", style: { flexWrap: "wrap", marginBottom: 24 } },
          h("div", null,
            h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
              h("h2", { style: { margin: 0 } }, "Account Creator Hub"),
              h("span", { className: "badge-pill owner" }, "OWNER ONLY")
            ),
            h("p", { className: "sub", style: { margin: "6px 0 0" } }, "Manage accounts, licenses, and live online users.")
          ),
          h("div", { style: { display: "flex", gap: 10, flexWrap: "wrap" } },
            h("button", { className: "btn ghost", onClick: () => setDbModal(true) }, getDbUrl() ? "\u2601\uFE0F Cloud DB Connected" : "\u2699\uFE0F Cloud DB Setup"),
            h("button", { className: "btn", onClick: () => setCreateModal(true) }, "+ Create a New Account")
          )
        ),
        // Live Active Users
        h("div", { className: "setting", style: { padding: "20px 22px", marginBottom: 28 } },
          h("div", { className: "row", style: { marginBottom: 14, flexWrap: "wrap" } },
            h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
              h("span", { className: "status-dot" }),
              h("h3", { style: { margin: 0, fontSize: 18 } }, `Active Accounts on Site (${activeSessions.length} Live)`),
              h("span", { className: "badge-pill live" }, "Auto-refreshes every 10s")
            ),
            h("button", { className: "pill", onClick: () => { onRefresh(); toast("Refreshed"); } }, "Refresh Now")
          ),
          activeSessions.length === 0
            ? h("div", { style: { padding: "22px 0", textAlign: "center", color: "var(--muted)", fontSize: 13.5 } }, "No active users online right now.")
            : h("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(310px, 1fr))", gap: 14 } },
                activeSessions.map((sess) => {
                  const acc = accountsMap[sess.username.toLowerCase()];
                  return h("div", { key: sess.username, className: "pop-panel", style: { background: "#0e0e12" } },
                    h("div", { className: "row", style: { marginBottom: 10 } },
                      h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
                        h("span", { className: "status-dot" }),
                        h("strong", { style: { fontSize: 16 } }, sess.username),
                        acc?.role === "owner" ? h("span", { className: "badge-pill owner" }, "OWNER") : null
                      ),
                      h("span", { style: { fontSize: 12, color: "var(--muted)" } }, `View: ${sess.currentView || "home"}`)
                    ),
                    h("div", { style: { fontSize: 12.5, color: "var(--muted)", marginBottom: 14 } }, "Remaining: ", h("strong", { style: { color: "#e4e4e4" } }, formatRemainingTime(acc, now))),
                    h("div", { style: { display: "flex", gap: 8 } },
                      h("button", { className: "btn warn sm", style: { flex: 1 }, onClick: () => handleKickUser(sess) }, "Kick Out"),
                      h("button", { className: "btn danger sm", style: { flex: 1 }, onClick: () => handleRevokeAccount(sess.username) }, "Revoke")
                    )
                  );
                })
              )
        ),
        h("h3", { style: { fontSize: 20, fontWeight: 600, marginBottom: 14 } }, `Licensed Accounts (${accountsList.length})`),
        h("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(340px, 1fr))", gap: 18 } },
          accountsList.map((acc) => {
            const key = acc.username.toLowerCase();
            const isShown = !!revealedPw[key];
            const remText = formatRemainingTime(acc, now);
            const isOnline = activeSessions.some((s) => s.username.toLowerCase() === key);
            const sliderVal = acc.durationHours || 12;
            return h("div", { key: acc.username, className: "pop-panel" },
              h("div", { className: "row", style: { marginBottom: 14 } },
                h("div", { style: { display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" } },
                  h("span", { className: "status-dot" + (isOnline ? "" : " off") }),
                  h("span", { style: { fontSize: 17, fontWeight: 600 } }, acc.username),
                  acc.role === "owner" ? h("span", { className: "badge-pill owner" }, "OWNER") : null,
                  isOnline ? h("span", { className: "badge-pill live" }, "ONLINE") : null
                ),
                h("button", { className: "btn danger sm", onClick: () => handleRevokeAccount(acc.username) }, "Revoke")
              ),
              h("div", { style: { display: "flex", flexDirection: "column", gap: 8, marginBottom: 16, background: "#070709", padding: "12px 14px", borderRadius: 12, border: "1px solid var(--border)" } },
                h("div", { className: "row" }, h("span", { style: { fontSize: 12.5, color: "var(--muted)" } }, "Password"),
                  h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
                    h("span", { style: { fontSize: 13.5, fontWeight: 600, fontFamily: "monospace", letterSpacing: isShown ? "normal" : "0.18em" } }, isShown ? acc.password : "\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022"),
                    h("button", { className: "eye-btn", onClick: () => toggleReveal(key) }, isShown ? h(EyeOffIcon) : h(EyeIcon))
                  )
                ),
                h("div", { className: "row" }, h("span", { style: { fontSize: 12.5, color: "var(--muted)" } }, "License"), h("span", { style: { fontSize: 12, fontFamily: "monospace", color: "#bcbcc4" } }, acc.licenseKey)),
                h("div", { className: "row" }, h("span", { style: { fontSize: 12.5, color: "var(--muted)" } }, "Remaining"), h("span", { style: { fontSize: 13, fontWeight: 600, color: "#86efac" } }, remText))
              ),
              h("div", { style: { borderTop: "1px solid var(--border)", paddingTop: 12 } },
                h("div", { className: "row", style: { marginBottom: 8 } }, h("span", { style: { fontSize: 12, color: "var(--muted)" } }, "Duration (1-24h)"), h("span", { style: { fontSize: 12.5, fontWeight: 600 } }, acc.infinite ? "Infinite \u221E" : `${sliderVal}h`)),
                h("input", { type: "range", min: 1, max: 24, step: 1, className: "slider", disabled: !!acc.infinite, value: sliderVal, onChange: (e) => handleAdjustDuration(acc, Number(e.target.value), false) }),
                h("div", { className: "row", style: { marginTop: 10 } },
                  h("label", { style: { display: "flex", alignItems: "center", gap: 8, fontSize: 13, cursor: "pointer" } },
                    h("input", { type: "checkbox", checked: !!acc.infinite, onChange: (e) => handleAdjustDuration(acc, sliderVal, e.target.checked), style: { width: 16, height: 16, accentColor: "#e4e4e4" } }),
                    "Infinite License"
                  )
                )
              )
            );
          })
        )
      ),
      createModal ? h(Modal, { onClose: () => setCreateModal(false) },
        h("h3", null, "Create account"),
        h("form", { onSubmit: handleCreateAccount, autoComplete: "off" },
          h("div", { style: { marginBottom: 12 } }, h("label", { className: "auth-label" }, "Username"), h("input", { className: "field", placeholder: "Username...", value: newUsername, onChange: (e) => setNewUsername(e.target.value) })),
          h("div", { style: { marginBottom: 12 } }, h("label", { className: "auth-label" }, "Password"), h("input", { className: "field", type: "text", placeholder: "Password...", value: newPassword, onChange: (e) => setNewPassword(e.target.value) })),
          h("div", { style: { marginBottom: 16 } }, h("label", { className: "auth-label" }, "Email (Optional)"), h("input", { className: "field", type: "email", placeholder: "email@example.com", value: newEmail, onChange: (e) => setNewEmail(e.target.value) })),
          h("div", { className: "setting", style: { padding: 14, marginBottom: 18 } },
            h("div", { className: "row", style: { marginBottom: 8 } }, h("span", { style: { fontSize: 13, fontWeight: 600 } }, "License Time"), h("span", { style: { fontSize: 13, fontWeight: 600 } }, newInfinite ? "Infinite" : `${newHours}h`)),
            h("input", { type: "range", min: 1, max: 24, step: 1, className: "slider", disabled: newInfinite, value: newHours, onChange: (e) => setNewHours(Number(e.target.value)) }),
            h("label", { style: { display: "flex", alignItems: "center", gap: 8, fontSize: 13.5, cursor: "pointer", marginTop: 10 } },
              h("input", { type: "checkbox", checked: newInfinite, onChange: (e) => setNewInfinite(e.target.checked), style: { width: 16, height: 16 } }),
              "Infinite (Never expires)"
            )
          ),
          h("div", { className: "actions" }, h("button", { type: "submit", className: "btn" }, "Create"), h("button", { type: "button", className: "btn ghost", onClick: () => setCreateModal(false) }, "Cancel"))
        )
      ) : null,
      dbModal ? h(Modal, { onClose: () => setDbModal(false) },
        h("h3", null, "Real-Time Cloud Database"),
        h("p", null, "Paste your free Firebase Realtime Database URL below."),
        h("input", { className: "field", placeholder: "https://your-app-default-rtdb.firebaseio.com", value: dbUrlInput, onChange: (e) => setDbUrlInput(e.target.value), style: { marginBottom: 16 } }),
        h("div", { className: "actions" },
          h("button", { className: "btn", onClick: async () => { setCustomDbUrl(dbUrlInput); await onRefresh(); setDbModal(false); toast("Connected!"); } }, "Save"),
          h("button", { className: "btn ghost", onClick: () => setDbModal(false) }, "Close")
        )
      ) : null
    );
  }

  // --- Login Gate Overlay ---
  function LoginBox({ onLoginSuccess }) {
    const [identifier, setIdentifier] = useState("");
    const [password, setPassword] = useState("");
    const [showPw, setShowPw] = useState(false);
    const [err, setErr] = useState("");
    const [loading, setLoading] = useState(false);

    const handleSubmit = async (e) => {
      e.preventDefault();
      setErr("");
      const idClean = identifier.trim();
      const pwClean = password.trim();
      if (!idClean || !pwClean) { setErr("Please enter Username and Password."); return; }
      setLoading(true);
      const { accounts } = await dbFetchAll();
      const lower = idClean.toLowerCase();
      let matched = accounts[lower];
      if (!matched) matched = Object.values(accounts).find((a) => a.email && a.email.trim().toLowerCase() === lower);

      if (!matched && isOwnerIdentity(lower, null) && pwClean === AUTH_CONFIG.masterOwnerPassword) {
        matched = {
          username: idClean.includes("@") ? (AUTH_CONFIG.ownerUsernames[0] || "kevin") : idClean,
          email: idClean.includes("@") ? idClean : (AUTH_CONFIG.ownerEmails[0] || ""),
          password: pwClean, licenseKey: "UG-OWNR-ROOT-0001", infinite: true, expiresAt: null, role: "owner", createdAt: Date.now()
        };
        await dbSaveAccount(matched);
      }

      if (!matched || matched.password !== pwClean) {
        setLoading(false); setErr("Invalid username or password."); return;
      }

      const isOwn = isOwnerIdentity(matched.username, matched);
      if (!isOwn && !matched.infinite && matched.expiresAt && Date.now() >= matched.expiresAt) {
        setLoading(false); setErr("License has expired."); return;
      }

      const sessionObj = { username: matched.username, email: matched.email || "", role: isOwn ? "owner" : "user", loginAt: Date.now(), lastPing: Date.now(), currentView: "home", kicked: false };
      await dbUpsertSession(sessionObj);
      saveCurrentSession(sessionObj);
      setLoading(false);
      onLoginSuccess(sessionObj);
    };

    return h("div", { className: "auth-overlay" },
      h("div", { className: "auth-box" },
        h("h1", { className: "auth-logo" }, "unblockedgames"),
        h("p", { className: "auth-sub" }, "Sign in with your licensed account."),
        err ? h("div", { className: "auth-err" }, err) : null,
        h("form", { onSubmit: handleSubmit, autoComplete: "off" },
          h("div", { style: { marginBottom: 14 } }, h("label", { className: "auth-label" }, "Username or Email"), h("input", { className: "field", placeholder: "Username...", value: identifier, onChange: (e) => setIdentifier(e.target.value) })),
          h("div", { style: { marginBottom: 20 } }, h("label", { className: "auth-label" }, "Password"),
            h("div", { style: { position: "relative", display: "flex", alignItems: "center" } },
              h("input", { className: "field", type: showPw ? "text" : "password", placeholder: "Password...", value: password, onChange: (e) => setPassword(e.target.value), style: { paddingRight: 44 } }),
              h("button", { type: "button", className: "eye-btn", onClick: () => setShowPw((v) => !v), style: { position: "absolute", right: 7, border: 0, background: "transparent" } }, showPw ? h(EyeOffIcon) : h(EyeIcon))
            )
          ),
          h("button", { type: "submit", className: "btn", disabled: loading, style: { width: "100%" } }, loading ? "Verifying..." : "Sign In")
        )
      )
    );
  }

  // --- Main App Component ---
  function App() {
    const [view, setView] = useState("home");
    const [open, setOpen] = useState(false);
    const [settings, setSettings] = useState(loadSettings);
    const [query, setQuery] = useState("");
    const [modal, setModal] = useState(null);
    const [playing, setPlaying] = useState(null);
    const [toastMsg, setToastMsg] = useState("");
    const [toastOn, setToastOn] = useState(false);
    const toastT = useRef(undefined);
    const mainRef = useRef(null);

    const [currentUser, setCurrentUser] = useState(getSavedSession);
    const [accountsMap, setAccountsMap] = useState({});
    const [sessionsMap, setSessionsMap] = useState({});

    const toast = useCallback((msg) => {
      setToastMsg(msg); setToastOn(true);
      clearTimeout(toastT.current);
      toastT.current = setTimeout(() => setToastOn(false), 2400);
    }, []);

    const navigate = useCallback((v) => { setView(v); mainRef.current?.scrollTo(0, 0); }, []);

    const isOwner = useMemo(() => {
      if (!currentUser) return false;
      const acc = accountsMap[currentUser.username?.toLowerCase()];
      return isOwnerIdentity(currentUser.username, acc || currentUser);
    }, [currentUser, accountsMap]);

    const refreshDatabaseAndSession = useCallback(async () => {
      const { accounts, sessions } = await dbFetchAll();
      setAccountsMap(accounts);
      setSessionsMap(sessions);

      const saved = getSavedSession();
      if (!saved || !saved.username) { setCurrentUser(null); return; }

      const key = saved.username.trim().toLowerCase();
      const acc = accounts[key];
      if (!acc) { saveCurrentSession(null); setCurrentUser(null); setPlaying(null); toast("Account revoked."); return; }

      const own = isOwnerIdentity(acc.username, acc);
      if (!own && !acc.infinite && acc.expiresAt && Date.now() >= acc.expiresAt) {
        await dbDeleteSession(acc.username); saveCurrentSession(null); setCurrentUser(null); setPlaying(null); toast("License expired."); return;
      }

      const remoteSess = sessions[key];
      if (remoteSess && remoteSess.kicked && (!saved.loginAt || (remoteSess.kickedAt || 0) >= saved.loginAt)) {
        await dbDeleteSession(acc.username); saveCurrentSession(null); setCurrentUser(null); setPlaying(null); toast("Kicked out."); return;
      }

      await dbUpsertSession({ username: acc.username, email: acc.email || "", role: own ? "owner" : "user", loginAt: saved.loginAt || Date.now(), lastPing: Date.now(), currentView: view, kicked: false });
      setSessionsMap(getLocalStore(LS_SESSIONS));
    }, [view, toast]);

    useEffect(() => {
      refreshDatabaseAndSession();
      const interval = setInterval(refreshDatabaseAndSession, 5000);
      return () => clearInterval(interval);
    }, [refreshDatabaseAndSession]);

    const play = useCallback((g) => {
      if (!settings.cloak) { setPlaying(g); return; }
      if (!openCloaked(frameSource(g), settings)) toast("Popup blocked");
    }, [settings, toast]);

    return h(Fragment, null,
      h(Stars),
      !currentUser ? h(LoginBox, { onLoginSuccess: (sess) => { setCurrentUser(sess); refreshDatabaseAndSession(); toast(`Welcome, ${sess.username}!`); } }) : null,
      h(Sidebar, { view, open, onToggle: () => setOpen((o) => !o), onNavigate: navigate, isOwner }),
      h("div", { id: "topRight", style: { display: "flex", gap: 8, alignItems: "center" } },
        currentUser ? h("button", { className: "pill", onClick: () => navigate(isOwner ? "creator" : "account") }, isOwner ? `\uD83D\uDC51 ${currentUser.username}` : `\uD83D\uDFE2 ${currentUser.username}`) : null,
        h("button", { className: "pill", onClick: () => setModal("links") }, "Get More Links")
      ),
      h("div", { id: "footerLinks" },
        h("button", { className: "pill", onClick: () => setModal("privacy") }, "Privacy"),
        h("button", { className: "pill", onClick: () => setModal("dmca") }, "DMCA"),
        h("button", { className: "pill", onClick: () => setModal("partners") }, "Partners")
      ),
      h("main", { ref: mainRef },
        view === "home" ? h(Home, { onNavigate: navigate, onSearch: (q) => { setQuery(q); navigate("games"); } }) : null,
        view === "games" ? h(GamesView, { query, onQuery: setQuery, onPlay: play }) : null,
        view === "chat" ? h(ChatView, { currentUser, accountsMap }) : null,
        view === "movies" ? h(Soon, { icon: h(MoviesIcon, { sw: 1.6 }), title: "Movies" }) : null,
        view === "music" ? h(Soon, { icon: h(MusicIcon, { sw: 1.6 }), title: "Music" }) : null,
        view === "ai" ? h(Soon, { icon: h(AiIcon, { sw: 1.6 }), title: "AI" }) : null,
        view === "account" ? h(AccountProfileView, { currentUser, accountsMap, onLogout: async () => { await dbDeleteSession(currentUser.username); saveCurrentSession(null); setCurrentUser(null); setView("home"); }, onOpenCreator: () => navigate("creator"), isOwner }) : null,
        view === "creator" && isOwner ? h(AccountCreatorView, { accountsMap, sessionsMap, onRefresh: refreshDatabaseAndSession, toast }) : null,
        view === "settings" ? h(SettingsView, { settings, onSave: (s) => { setSettings(s); saveSettings(s); toast("Saved"); }, onCloakSite: () => cloakSite(settings) }) : null
      ),
      playing ? h(Player, { game: playing, onClose: () => setPlaying(null) }) : null,
      modal ? h(Modal, { onClose: () => setModal(null) },
        modal === "links" ? h(Fragment, null, h("h3", null, "Get More Links"), h("p", null, "Bookmark this page."), h("div", { className: "actions" }, h("button", { className: "btn", onClick: () => { setModal(null); cloakSite(settings); } }, "Open in about:blank"), h("button", { className: "btn ghost", onClick: () => setModal(null) }, "Close"))) : null
      ) : null,
      h("div", { id: "toast", className: toastOn ? "show" : "" }, toastMsg)
    );
  }

  createRoot(document.getElementById("root")).render(h(StrictMode, null, h(App)));

})();
    </script>
  </body>
</html>
